      "118.2": { value: "param.qppAdditionalMaxPensionable - param.qppMaxPensionable", when: "line.QCU.33 > 0" }
      "118.3":
        value: "min(max(0, line.TP1.98_1 + line.QCU.33 - param.qppMaxPensionable), param.qppAdditionalMaxPensionable - param.qppMaxPensionable)"
        when: "line.QCU.33 > 0"
      "122":
        value: "round(min(max(0, line.TP1.98_1 + line.QCU.33 - param.qppMaxPensionable), param.qppAdditionalMaxPensionable - param.qppMaxPensionable) * param.qppSecondRate, 2)"
        when: "line.QCU.33 > 0"
      "123":
        value: >-
          min(max(0, line.TP1.98 - round(line.QCU.111 * param.qppEmployeeRate, 2)) + line.TP1.98_2,
          round(min(max(0, line.TP1.98_1 + line.QCU.33 - param.qppMaxPensionable), param.qppAdditionalMaxPensionable - param.qppMaxPensionable) * param.qppSecondRate, 2))
