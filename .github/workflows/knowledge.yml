name: knowledge

on:
  push:
    branches: [main]
    paths:
      - knowledge/**
      - .github/workflows/knowledge.yml
      - .github/workflows/app.yml
      - .github/scripts/**
  pull_request:
    paths:
      - knowledge/**
      - .github/workflows/knowledge.yml
      - .github/workflows/app.yml
      - .github/scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    uses: ./.github/workflows/app.yml
    with:
      app: knowledge
      workerd-smoke: true
