# The IRS forms a return is printed on, and what goes in each row. A row is the line number printed beside its box
# (form-layout.yaml finds it in the label the IRS gives each box of its fill-in PDF); a named place (a name, a filing
# status box, a column of a table) is named in scripts/form-layout.ts by its field. Each amount is a formula from the
# return's side, like a line's. A zero or a missing amount is left blank, unless the field says `zero: true`. Rows the
# app has nothing for (IRA distributions, Schedule 1) are left out. A field is an amount unless it says otherwise:
#   { count: <formula> }   a whole number (a number of children or months), with no cents; with `digits: <n>`, written
#                          with n digits, zeros included, even when it is zero (the decimals of Form 8863, line 6)
#   { tick: <formula> }    a tick in a box, when the formula is yes from the person's answers (not from a usual answer)
#   { text: <fact> }       the person's firstName or lastName, their spouse's spouseFirstName, spouseLastName or whole
#                          spouseName, or the returnNames a schedule is headed with (both spouses' on a joint return)
# A form's table of dependants (`dependants`) is filled for each dependant of the return that `which` takes, one per
# column; its fields are worked out from the dependant's side (`dependant.`), and its `when`s are about the return.
#
# A form applies to the returns whose `applies` is yes; the forms print in the order of the attachment sequence number
# printed at the top right of each, as the IRS asks them attached: Form 1040, then Schedules 1, 1-A, 2, 3, A, C, D and
# SE (on a joint return, the spouse's copy after the preparer's), Forms 2441 and 6251, Schedule EIC, Schedule 8812, and
# Forms 8863, 8889, 8995, 8959 and 8960. A form with `side: spouse` is the spouse's copy, worked out from their side; `layout` reuses another
# form's places on the same PDF.
#
# The PDFs come from irs.gov on first use (url: the 2025 revision's own address, which doesn't change when the IRS
# publishes the next year's) and must match the layout's SHA-256: a form the IRS changes is placed again with npm run
# form-layout before it is filled.

forms:
  F1040:
    title: Form 1040, U.S. Individual Income Tax Return
    url: https://www.irs.gov/pub/irs-prior/f1040--2025.pdf
    applies: "true"
    fields:
      # Page 1: the names and the filing status. The social security numbers, the address, the presidential campaign
      # fund, the digital assets question and the home in the U.S. stay for the person to fill in.
      firstName: { text: firstName }
      lastName: { text: lastName }
      spouseFirstName: { text: spouseFirstName, when: "line.US.joint == 1" }
      spouseLastName: { text: spouseLastName, when: "line.US.joint == 1" }
      single: { tick: "line.US.single == 1" }
      joint: { tick: "line.US.joint == 1" }
      separate: { tick: "line.US.separate == 1" }
      separateSpouseName: { text: spouseName, when: "line.US.separate == 1" }
      hoh: { tick: "line.US.hoh == 1" }
      qss: { tick: "line.US.qss == 1" }
      livedApart: { tick: "line.US.separate == 1 and answer.livedApartLastSixMonths" }
      # Income
      1a: line.F1040.1a
      1e: line.F1040.1e
      1z: line.F1040.1z
      2a: line.F1040.2a
      2b: line.F1040.2b
      3a: line.F1040.3a
      3b: line.F1040.3b
      # Lines 4a and 5a only when part isn't taxable (a rollover); fully taxable, the total goes on 4b or 5b alone.
      4a: { value: line.F1040.4a, when: "line.F1040.4a > line.F1040.4b" }
      4b: line.F1040.4b
      iraRollover: { tick: "line.US.iraRollover == 1" }
      5a: { value: line.F1040.5a, when: "line.F1040.5a > line.F1040.5b" }
      5b: line.F1040.5b
      pensionRollover: { tick: "line.US.pensionRollover == 1" }
      6a: line.F1040.6a
      6b: { value: line.F1040.6b, when: "line.F1040.6a > 0", zero: true }
      benefitsLivedApart: { tick: "line.US.separate == 1 and line.F1040.6a > 0 and answer.livedApartAllYear" }
      7a: line.F1040.7a
      noScheduleD: { tick: "line.US.scheduleD == 0 and line.F1040.7a > 0" }
      "8": line.F1040.8
      "9": line.F1040.9
      "10": line.F1040.10
      11a: line.F1040.11a
      # Page 2: tax and credits
      11b: line.F1040.11a
      claimYou: { tick: answer.canBeClaimed }
      claimSpouse: { tick: "line.US.joint == 1 and spouse.answer.canBeClaimed" }
      youSenior: { tick: "person.age >= 65" }
      youBlind: { tick: answer.isBlind }
      spouseSenior: { tick: "line.US.joint == 1 and spouse.person.age >= 65" }
      spouseBlind: { tick: "line.US.joint == 1 and spouse.answer.isBlind" }
      spouseItemizes: { tick: "line.US.separate == 1 and answer.spouseItemizes" }
      12e: line.F1040.12e
      13a: line.F1040.13a
      13b: line.F1040.13b
      "14": line.F1040.14
      # "If zero or less, enter -0-" (lines 15 and 22), and the total tax.
      "15": { value: line.F1040.15, zero: true }
      "16": line.F1040.16
      "17": line.F1040.17
      "18": line.F1040.18
      "19": line.F1040.19
      "20": line.F1040.20
      "21": line.F1040.21
      "22": { value: line.F1040.22, zero: true }
      "23": line.F1040.23
      "24": { value: line.F1040.24, zero: true }
      # Payments
      25a: line.F1040.25a
      25b: line.F1040.25b
      25c: line.F1040.25c
      25d: line.F1040.25d
      "26": line.F1040.26
      27a: line.F1040.27a
      "28": line.F1040.28
      "29": line.F1040.29
      "31": line.F1040.31
      "32": line.F1040.32
      "33": line.F1040.33
      # The refund, all of it refunded (line 35a); the routing and account numbers stay for the person to fill in.
      "34": line.F1040.34
      35a: line.F1040.34
      "37": line.F1040.37
    # The dependents this return claims, four on the form; with more, the "more than four" box is ticked and the
    # worksheet lists the others, for the statement the instructions ask for. The child tax credit's box is for a
    # child counted on Schedule 8812 line 4, which needs your social security number (without one, the child counts
    # on line 6); any other dependent's is the credit for other dependents'. "And in the U.S." stays for the person
    # to tick.
    dependants:
      when: "line.US.claimsDependants == 1"
      which: "line.DEP.dependent == 1"
      columns: 4
      more: moreDependants
      fields:
        firstName: { text: firstName }
        lastName: { text: lastName }
        relationship: { choice: relationship, labels: { child: Child, foster: Foster child } }
        livedWithYou: { tick: "dependant.answer.monthsWithYou >= 7" }
        student: { tick: dependant.answer.fullTimeStudent }
        disabled: { tick: dependant.answer.disabled }
        childTaxCredit: { tick: "line.DEP.ctcChild == 1", when: "line.US.filerSSN == 1" }
        otherDependents: { tick: "line.DEP.ctcChild == 0" }
        childWithoutYourSSN: { tick: "line.DEP.ctcChild == 1", when: "line.US.filerSSN == 0", place: otherDependents }

  S1:
    title: Schedule 1 (Form 1040), Additional Income and Adjustments to Income
    url: https://www.irs.gov/pub/irs-prior/f1040s1--2025.pdf
    applies: "line.S1.10 > 0 or line.S1.26 > 0"
    fields:
      names: { text: returnNames }
      # Part I: business income only; Part II: the HSA deduction, the deductible part of self-employment tax, the IRA
      # deduction and the student loan interest deduction.
      "3": line.S1.3
      "10": line.S1.10
      "13": line.S1.13
      "15": line.S1.15
      "20": line.S1.20
      "21": line.S1.21
      "26": line.S1.26

  S1A:
    title: Schedule 1-A (Form 1040), Additional Deductions
    url: https://www.irs.gov/pub/irs-prior/f1040s1a--2025.pdf
    applies: "line.S1A.38 > 0"
    fields:
      names: { text: returnNames }
      # Part I: modified AGI (no income from Puerto Rico or abroad)
      "1": line.F1040.11a
      "3": line.S1A.3
      # Part II: qualified tips as an employee (line 4c: the total, from one employer or several; none from a business,
      # line 5). Each part's rows are written only when it has something.
      4c: line.S1A.4c
      "6": line.S1A.4c
      "7": line.S1A.7
      "8": { value: line.S1A.3, when: &tips "line.S1A.4c > 0" }
      "9": { value: line.S1A.9, when: *tips }
      "10": { value: line.S1A.10, when: *tips }
      "11": { count: "floor(line.S1A.10, 1000) / 1000", when: *tips }
      "12": { value: line.S1A.12, when: *tips }
      "13": line.S1A.13
      # Part III: qualified overtime compensation on Forms W-2 (none on Form 1099, line 14b)
      14a: line.S1A.14c
      14c: line.S1A.14c
      "15": line.S1A.15
      "16": { value: line.S1A.3, when: &overtime "line.S1A.14c > 0" }
      "17": { value: line.S1A.9, when: *overtime }
      "18": { value: line.S1A.10, when: *overtime }
      "19": { count: "floor(line.S1A.10, 1000) / 1000", when: *overtime }
      "20": { value: line.S1A.12, when: *overtime }
      "21": line.S1A.21
      # Part IV: car loan interest, one row of line 22 for each spouse's car; the VIN is for the person to write.
      22a: line.US.ownCarLoan
      22b: "if(line.US.joint == 1, spouse.line.US.ownCarLoan, 0)"
      "23": line.S1A.23
      "24": line.S1A.24
      "25": { value: line.S1A.3, when: &car "line.S1A.23 > 0" }
      "26": { value: line.S1A.26, when: *car }
      "27": { value: line.S1A.27, when: *car }
      "28": { count: "(0 - floor(0 - line.S1A.27, 1000)) / 1000", when: *car }
      "29": { value: line.S1A.29, when: *car }
      "30": line.S1A.30
      # Part V: the enhanced deduction for seniors
      "31": { value: line.S1A.3, when: &senior "line.S1A.37 > 0" }
      "32": { value: line.S1A.32, when: *senior }
      "33": { value: "max(0, line.S1A.3 - line.S1A.32)", when: *senior }
      "34": { value: "round(max(0, line.S1A.3 - line.S1A.32) * param.seniorPhaseOutRate, 2)", when: *senior }
      "35": { value: line.S1A.35, when: *senior }
      36a: "if(person.age >= 65, line.S1A.35, 0)"
      36b: "if(line.US.joint == 1, if(spouse.person.age >= 65, line.S1A.35, 0), 0)"
      "37": line.S1A.37
      "38": line.S1A.38

  S2:
    title: Schedule 2 (Form 1040), Additional Taxes
    url: https://www.irs.gov/pub/irs-prior/f1040s2--2025.pdf
    applies: "line.S2.21 > 0 or line.F1040.17 > 0"
    fields:
      names: { text: returnNames }
      "2": line.F1040.17
      "3": line.F1040.17
      "4": line.S2.4
      "8": line.S2.8
      line8NoForm: { tick: "line.S2.8 > 0" }
      "11": line.F8959.18
      "12": line.F8960.17
      "21": line.S2.21

  S3:
    title: Schedule 3 (Form 1040), Additional Credits and Payments
    url: https://www.irs.gov/pub/irs-prior/f1040s3--2025.pdf
    applies: "line.S3.8 > 0 or line.S3.11 > 0"
    fields:
      names: { text: returnNames }
      "1": line.S3.1
      "2": line.S3.2
      "3": line.S3.3
      "8": line.S3.8
      "11": line.S3.11
      "15": line.S3.11

  # Schedule A: when the return itemizes.
  SA:
    title: Schedule A (Form 1040), Itemized Deductions
    url: https://www.irs.gov/pub/irs-prior/f1040sa--2025.pdf
    applies: "line.US.itemizes == 1"
    fields:
      names: { text: returnNames }
      "1": line.SA.1
      "2": { value: line.F1040.11a, when: "line.SA.1 > 0" }
      "3": { value: line.SA.3, when: "line.SA.1 > 0" }
      "4": line.SA.4
      5a: line.SA.5a
      5b: line.SA.5b
      5c: line.SA.5c
      5d: line.SA.5d
      5e: line.SA.5e
      "7": line.SA.7
      8a: line.SA.8a
      8e: line.SA.8a
      "10": line.SA.10
      "11": line.SA.11
      "12": line.SA.12
      "14": line.SA.14
      "17": line.SA.17

  # Schedule C: each person's business, the person preparing's here and the spouse's below on a joint return. The
  # business's name, address, code and accounting method, the vehicle information of Part IV (with car expenses) and
  # what the other expenses are (Part V) stay for the person to fill in.
  SC:
    title: Schedule C (Form 1040), Profit or Loss From Business
    url: https://www.irs.gov/pub/irs-prior/f1040sc--2025.pdf
    applies: "line.SC.31 > 0"
    fields: &scheduleC
      name: { text: name }
      "1": line.SC.1
      "3": line.SC.1
      "5": line.SC.1
      "7": line.SC.7
      "8": line.SC.8
      "9": line.SC.9
      "11": line.SC.11
      "15": line.SC.15
      "17": line.SC.17
      "18": line.SC.18
      20b: line.SC.20b
      "22": line.SC.22
      24a: line.SC.24a
      24b: line.SC.24b
      "25": line.SC.25
      27b: line.SC.27b
      "28": line.SC.28
      "29": line.SC.31
      "31": line.SC.31
      otherAmount: line.SC.27b
      "48": line.SC.27b
  SCS:
    title: Schedule C (Form 1040), Profit or Loss From Business (spouse)
    url: https://www.irs.gov/pub/irs-prior/f1040sc--2025.pdf
    applies: "line.US.joint == 1 and spouse.line.SC.31 > 0"
    side: spouse
    layout: SC
    fields: *scheduleC

  # Schedule D: sales on 1099-B summaries for box A and D (lines 1a and 8a), a carryover, and capital gain
  # distributions with them. Lines 6, 14 and 21 are printed in brackets on the form, so their amounts are written as
  # they are; lines 7, 15 and 16 can be losses, written in brackets.
  SD:
    title: Schedule D (Form 1040), Capital Gains and Losses
    url: https://www.irs.gov/pub/irs-prior/f1040sd--2025.pdf
    applies: "line.US.scheduleD == 1"
    fields:
      names: { text: returnNames }
      qofNo: { tick: "line.US.scheduleD == 1" }
      1aD: line.SD.1ad
      1aE: line.SD.1ae
      1aH: { value: line.SD.1ah, when: "line.SD.1ad > 0" }
      "6": line.SD.6
      "7": line.SD.7
      8aD: line.SD.8ad
      8aE: line.SD.8ae
      8aH: { value: line.SD.8ah, when: "line.SD.8ad > 0" }
      "13": line.SD.13
      "14": line.SD.14
      "15": line.SD.15
      "16": { value: line.SD.16, zero: true }
      line17Yes: { tick: "line.SD.15 > 0 and line.SD.16 > 0" }
      line17No: { tick: "line.SD.15 <= 0 or line.SD.16 <= 0" }
      line20Yes: { tick: "line.SD.15 > 0 and line.SD.16 > 0" }
      "21": "0 - line.SD.21"
      line22Yes: { tick: "line.SD.16 <= 0 and line.F1040.3a > 0" }
      line22No: { tick: "line.SD.16 <= 0 and line.F1040.3a == 0" }

  # Schedule SE: each person with $400 or more of net earnings from self-employment.
  SE:
    title: Schedule SE (Form 1040), Self-Employment Tax
    url: https://www.irs.gov/pub/irs-prior/f1040sse--2025.pdf
    applies: "line.SE.6 > 0"
    fields: &scheduleSE
      name: { text: name }
      "2": line.SC.31
      "3": line.SC.31
      4a: line.SE.4a
      4c: line.SE.4a
      "6": line.SE.6
      # Line 7, $176,100, is printed on the form.
      8a: line.SE.8a
      8d: line.SE.8a
      "9": line.SE.9
      "10": line.SE.10
      "11": line.SE.11
      "12": line.SE.12
      "13": line.SE.13
  SES:
    title: Schedule SE (Form 1040), Self-Employment Tax (spouse)
    url: https://www.irs.gov/pub/irs-prior/f1040sse--2025.pdf
    applies: "line.US.joint == 1 and spouse.line.SE.6 > 0"
    side: spouse
    layout: SE
    fields: *scheduleSE

  F2441:
    title: Form 2441, Child and Dependent Care Expenses
    url: https://www.irs.gov/pub/irs-prior/f2441--2025.pdf
    applies: "line.F2441.11 > 0 or line.F2441.12 > 0"
    fields:
      names: { text: returnNames }
      # A and B: filing separately as unmarried, and the deemed income of a spouse who was a student or disabled.
      livedApart: { tick: "line.US.separate == 1 and line.US.careUnmarried == 1" }
      deemedIncome: { tick: "line.US.joint == 1 and answer.studentOrDisabledMonths + spouse.answer.studentOrDisabledMonths > 0" }
      # Part I, the care providers (name, address, identifying number), stays for the person to fill in.
      # Part II: the credit. Line 9b (2024 care paid in 2025) is 0: the app says so when it isn't.
      "3": line.F2441.3
      "4": { value: line.F2441.4, when: "line.US.paidForCare == 1" }
      "5": { value: line.F2441.5, when: "line.US.paidForCare == 1" }
      "6": line.F2441.6
      "7": { value: line.F2441.7, when: "line.US.paidForCare == 1" }
      # The rate's digits after the decimal point, printed on the form.
      "8": { count: "line.F2441.8 * 100", when: "line.US.paidForCare == 1" }
      9a: line.F2441.9a
      9c: line.F2441.9a
      "10": { value: line.F2441.10, when: "line.US.paidForCare == 1" }
      "11": line.F2441.11
      # Part III: dependent care benefits. Line 14 is printed in brackets on the form.
      "12": line.F2441.12
      "13": line.F2441.13
      "14": line.F2441.14
      "15": line.F2441.15
      "16": { value: line.F2441.16, when: "line.F2441.12 > 0" }
      "17": { value: line.F2441.17, when: "line.F2441.12 > 0" }
      "18": { value: line.F2441.18, when: "line.F2441.12 > 0" }
      "19": { value: line.F2441.19, when: "line.F2441.12 > 0" }
      "20": { value: line.F2441.20, when: "line.F2441.12 > 0" }
      "21": { value: line.F2441.21, when: "line.F2441.12 > 0" }
      # No benefits from a sole proprietorship or partnership: line 22 is No and 0, and none are deductible (24).
      line22No: { tick: "line.F2441.12 > 0" }
      "22": { value: "0", when: "line.F2441.12 > 0", zero: true }
      "23": line.F2441.15
      "24": { value: "0", when: "line.F2441.12 > 0", zero: true }
      "25": line.F2441.25
      "26": line.F2441.26
      "27": { value: line.F2441.27, when: "line.F2441.12 > 0 and line.US.paidForCare == 1" }
      "28": { value: line.F2441.25, when: "line.US.paidForCare == 1" }
      "29": { value: line.F2441.29, when: "line.F2441.12 > 0 and line.US.paidForCare == 1" }
      "30": { value: line.F2441.30, when: "line.F2441.12 > 0 and line.US.paidForCare == 1" }
      "31": { value: line.F2441.31, when: "line.F2441.12 > 0 and line.US.paidForCare == 1" }
    # Line 2: each qualifying person with care expenses, three on the form; with more, its box is ticked and the
    # worksheet lists the others. Their social security numbers stay for the person to fill in.
    dependants:
      when: "line.US.paidForCare == 1"
      which: "line.DEP.careChildExpenses + line.DEP.careDisabledExpenses > 0"
      columns: 3
      more: moreQualifying
      fields:
        firstName: { text: firstName }
        lastName: { text: lastName }
        disabled: { tick: "line.DEP.careDisabled == 1" }
        expenses: "line.DEP.careChildExpenses + line.DEP.careDisabledExpenses"

  # Form 6251: when there is an AMT to pay (line 7 more than line 10, 6251 instructions, Who Must File).
  F6251:
    title: Form 6251, Alternative Minimum Tax—Individuals
    url: https://www.irs.gov/pub/irs-prior/f6251--2025.pdf
    applies: "line.F6251.11 > 0"
    fields:
      names: { text: returnNames }
      1a: line.F6251.1a
      1b: line.F6251.1b
      2a: line.F6251.2a
      2g: line.F6251.2g
      "4": line.F6251.4
      "5": line.F6251.5
      "6": line.F6251.6
      "7": line.F6251.7
      "8": line.F6251.8
      "9": line.F6251.9
      "10": line.F6251.10
      "11": line.F6251.11
      # Part III, when the regular tax used the Qualified Dividends and Capital Gain Tax Worksheet.
      "12": { value: line.F6251.6, when: "line.QDW.applies == 1" }
      "13": { value: line.F6251.13, when: "line.QDW.applies == 1" }
      "15": { value: line.F6251.13, when: "line.QDW.applies == 1" }
      "16": { value: line.F6251.16, when: "line.QDW.applies == 1" }
      "17": { value: line.F6251.17, when: "line.QDW.applies == 1" }
      "18": { value: line.F6251.18, when: "line.QDW.applies == 1" }
      "19": { value: line.QDW.6, when: "line.QDW.applies == 1" }
      "20": { value: line.QDW.5, when: "line.QDW.applies == 1" }
      "21": { value: line.F6251.21, when: "line.QDW.applies == 1" }
      "22": { value: line.F6251.22, when: "line.QDW.applies == 1" }
      "23": { value: line.F6251.23, when: "line.QDW.applies == 1" }
      "24": { value: "line.F6251.22 - line.F6251.23", when: "line.QDW.applies == 1" }
      "25": { value: line.QDW.13, when: "line.QDW.applies == 1" }
      "26": { value: line.F6251.21, when: "line.QDW.applies == 1" }
      "27": { value: line.QDW.5, when: "line.QDW.applies == 1" }
      "28": { value: "line.F6251.21 + line.QDW.5", when: "line.QDW.applies == 1" }
      "29": { value: "max(0, line.QDW.13 - (line.F6251.21 + line.QDW.5))", when: "line.QDW.applies == 1" }
      "30": { value: line.F6251.30, when: "line.QDW.applies == 1" }
      "31": { value: line.F6251.31, when: "line.QDW.applies == 1" }
      "32": { value: "line.F6251.23 + line.F6251.30", when: "line.QDW.applies == 1" }
      "33": { value: "line.F6251.22 - (line.F6251.23 + line.F6251.30)", when: "line.QDW.applies == 1" }
      "34": { value: line.F6251.34, when: "line.QDW.applies == 1" }
      "38": { value: "line.F6251.18 + line.F6251.31 + line.F6251.34", when: "line.QDW.applies == 1" }
      "39": { value: line.F6251.39, when: "line.QDW.applies == 1" }
      "40": { value: line.F6251.40, when: "line.QDW.applies == 1" }

  SEIC:
    title: Schedule EIC (Form 1040), Earned Income Credit
    url: https://www.irs.gov/pub/irs-prior/f1040sei--2025.pdf
    applies: "line.F1040.27a > 0 and line.US.eicChildren > 0"
    fields:
      names: { text: returnNames }
    # Each qualifying child, three at most: the credit counts three. Their social security numbers stay for the
    # person to fill in. Lines 4a and 4b are for a child 19 or older: under 24 and a student, or else disabled.
    dependants:
      which: "line.DEP.eicChild == 1"
      columns: 3
      fields:
        name: { text: name }
        birthYear: { text: birthYear }
        studentYes: { tick: "dependant.age >= 19 and dependant.age < 24 and dependant.answer.fullTimeStudent" }
        studentNo: { tick: "dependant.age >= 24 or (dependant.age >= 19 and not dependant.answer.fullTimeStudent)" }
        disabledYes: { tick: "line.DEP.ageTest == 1 and dependant.age >= 19 and not (dependant.age < 24 and dependant.answer.fullTimeStudent)" }
        relationship: { choice: relationship, labels: { child: Child, foster: Foster child } }
        months: { count: dependant.answer.monthsWithYou }

  S8812:
    title: Schedule 8812 (Form 1040), Credits for Qualifying Children and Other Dependents
    url: https://www.irs.gov/pub/irs-prior/f1040s8--2025.pdf
    applies: "line.S8812.8 > 0"
    fields:
      names: { text: returnNames }
      # Part I
      "1": line.F1040.11a
      "3": line.S8812.3
      "4": { count: line.S8812.4 }
      "5": line.S8812.5
      "6": { count: line.S8812.6 }
      "7": line.S8812.7
      "8": line.S8812.8
      "9": line.S8812.9
      "10": line.S8812.10
      "11": line.S8812.11
      line12No: { tick: "line.S8812.8 <= line.S8812.11" }
      line12Yes: { tick: "line.S8812.8 > line.S8812.11" }
      "12": line.S8812.12
      "13": line.S8812.13
      "14": line.S8812.14
      # Part II-A, when the credits are more than the tax.
      16a: line.S8812.16a
      16bChildren: { count: line.S8812.4, when: "line.S8812.16a > 0" }
      16b: { value: line.S8812.16b, when: "line.S8812.16a > 0" }
      "17": line.S8812.17
      18a: { value: line.S8812.18a, when: "line.S8812.16a > 0" }
      line19No: { tick: "line.S8812.16a > 0 and line.S8812.18a <= param.actcEarnedFloor" }
      line19Yes: { tick: "line.S8812.16a > 0 and line.S8812.18a > param.actcEarnedFloor" }
      "19": { value: line.S8812.19, when: "line.S8812.16a > 0" }
      "20": { value: line.S8812.20, when: "line.S8812.16a > 0" }
      line20No: { tick: "line.S8812.16a > 0 and line.S8812.16b < param.actcThreeChildren" }
      line20Yes: { tick: "line.S8812.16a > 0 and line.S8812.16b >= param.actcThreeChildren" }
      # Part II-B, for three or more children when line 20 is less than line 17.
      "21": { value: line.S8812.21, when: &partIIB "line.S8812.16a > 0 and line.S8812.16b >= param.actcThreeChildren and line.S8812.20 < line.S8812.17" }
      "22": { value: line.S8812.22, when: *partIIB }
      "23": { value: line.S8812.23, when: *partIIB }
      "24": { value: line.S8812.24, when: *partIIB }
      "25": { value: line.S8812.25, when: *partIIB }
      "26": { value: line.S8812.26, when: *partIIB }
      # Part II-C
      "27": line.S8812.27

  # Form 8863: page 1 for the return, and page 2 (Part III) for one student: you, else your spouse filing jointly, else
  # the first dependant with a credit. Each other student needs a copy of page 2, which the worksheet asks for. The
  # student's social security number and each school's name, address, EIN and Form 1098-T answers (line 22) stay for
  # the person to fill in. Lines 23 to 26 are ticked for a student who takes the American opportunity credit, as they
  # said all of its conditions are true; for one who takes the lifetime learning credit, they stay for the person.
  F8863:
    title: Form 8863, Education Credits (American Opportunity and Lifetime Learning Credits)
    url: https://www.irs.gov/pub/irs-prior/f8863--2025.pdf
    applies: "line.F8863.7 + line.F8863.18 > 0"
    fields:
      names: { text: returnNames }
      names2: { text: returnNames }
      # Part I. Lines 6 and 17 are decimals: the digit before the point, and the three after it.
      "1": line.F8863.1
      "2": { value: line.F8863.2, when: &aotc "line.F8863.1 > 0" }
      "3": { value: line.F8863.3, when: *aotc }
      "4": { value: line.F8863.4, when: *aotc }
      "5": { value: line.F8863.5, when: *aotc }
      "6": { count: "floor(line.F8863.6, 1)", digits: 1, when: *aotc }
      6digits: { count: "(line.F8863.6 - floor(line.F8863.6, 1)) * 1000", digits: 3, when: *aotc }
      line7NoRefund: { tick: "line.US.aotcNoRefund == 1" }
      "7": line.F8863.7
      "8": line.F8863.8
      "9": line.F8863.9
      # Part II
      "10": line.F8863.10
      "11": line.F8863.11
      "12": line.F8863.12
      "13": { value: line.F8863.2, when: &llc "line.F8863.10 > 0" }
      "14": { value: line.F8863.3, when: *llc }
      "15": { value: line.F8863.15, when: *llc }
      "16": { value: line.F8863.5, when: *llc }
      "17": { count: "floor(line.F8863.17, 1)", digits: 1, when: *llc }
      17digits: { count: "(line.F8863.17 - floor(line.F8863.17, 1)) * 1000", digits: 3, when: *llc }
      "18": line.F8863.18
      "19": line.F8863.19
      # Part III for you or your spouse
      student: { text: name, when: "line.US.page2 == 1" }
      spouseStudent: { text: spouseName, when: "line.US.page2 == 2" }
      line23No: { tick: &page2Aotc "if(line.US.page2 == 1, line.US.ownAotcStudent, if(line.US.page2 == 2, spouse.line.US.ownAotcStudent, 0)) == 1" }
      line24Yes: { tick: *page2Aotc }
      line25No: { tick: *page2Aotc }
      line26No: { tick: *page2Aotc }
      "27": "if(line.US.page2 == 1, line.US.ownAotc27, if(line.US.page2 == 2, spouse.line.US.ownAotc27, 0))"
      "28": "max(0, if(line.US.page2 == 1, line.US.ownAotc27, if(line.US.page2 == 2, spouse.line.US.ownAotc27, 0)) - param.aotcFullRate)"
      "29": "round(max(0, if(line.US.page2 == 1, line.US.ownAotc27, if(line.US.page2 == 2, spouse.line.US.ownAotc27, 0)) - param.aotcFullRate) * param.aotcPartRate, 2)"
      "30": "if(line.US.page2 == 1, line.US.ownAotc30, if(line.US.page2 == 2, spouse.line.US.ownAotc30, 0))"
      "31": "if(line.US.page2 == 1, line.US.ownLlc31, if(line.US.page2 == 2, spouse.line.US.ownLlc31, 0))"
    # Part III for a dependant, when neither you nor your spouse is a student.
    dependants:
      when: "line.US.page2 == 0 and line.US.educationAsked == 1"
      which: "line.DEP.student == 1"
      columns: 1
      fields:
        student: { text: name }
        line23No: { tick: "line.DEP.aotcStudent == 1" }
        line24Yes: { tick: "line.DEP.aotcStudent == 1" }
        line25No: { tick: "line.DEP.aotcStudent == 1" }
        line26No: { tick: "line.DEP.aotcStudent == 1" }
        "27": line.DEP.aotc27
        "28": "max(0, line.DEP.aotc27 - param.aotcFullRate)"
        "29": "round(max(0, line.DEP.aotc27 - param.aotcFullRate) * param.aotcPartRate, 2)"
        "30": line.DEP.aotc30
        "31": line.DEP.llc31

  # Form 8889, Part I: each person's own HSA (the spouse's copy below on a joint return).
  F8889:
