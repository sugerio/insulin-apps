name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-content:
    # The repository is public. One scan of every tracked file, before any app job. Organization-specific terms
    # live in the maintainer's private deny list, which this job never has.
    name: Public content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Scanner tests
        run: node --test scripts/check-public-content.test.mjs
      - name: Scan tracked files
        run: node scripts/check-public-content.mjs

  app:
    name: ${{ matrix.app }}
    needs: public-content
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [captable]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The platform previews and publishes on Node 22.
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Insulin compatibility (source)
        working-directory: .
        run: node scripts/check-insulin-app.mjs ${{ matrix.app }}
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Migrations match the schema
        # The same drizzle-kit and drizzle-orm the publish pipeline pins: publishing
        # refuses an app whose `drizzle-kit generate` would write anything.
        run: |
          tools="$RUNNER_TEMP/drizzle-tools"
          mkdir -p "$tools" && echo '{"private":true}' > "$tools/package.json"
          npm install --prefix "$tools" --no-audit --no-fund drizzle-kit@0.31.11 drizzle-orm@0.45.3
          "$tools/node_modules/.bin/drizzle-kit" generate
          if [ -n "$(git status --porcelain -- src/app/db/migrations)" ]; then
            git status --porcelain -- src/app/db/migrations
            echo "::error::src/app/db/schema.ts and its migrations are out of step: run npm run db:generate and commit the result."
            exit 1
          fi
      - name: Build for Cloudflare Workers
        run: npm run build
        env:
          NODE_ENV: production
          NITRO_PRESET: cloudflare_module
      - name: Insulin compatibility (build output)
        working-directory: .
        run: node scripts/check-insulin-app.mjs ${{ matrix.app }} --built

  workerd-smoke:
    name: captable workerd smoke
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            captable/package-lock.json
            tools/workerd-smoke/package-lock.json
      - name: Install app
        working-directory: captable
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install smoke harness
        working-directory: tools/workerd-smoke
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build, migrate, and run in workerd
        working-directory: tools/workerd-smoke
        run: node smoke.mjs
