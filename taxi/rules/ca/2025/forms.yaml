      "21": { value: "min(param.tuitionTransferMax, line.S11.8)", when: "line.S11.24 > 0" }
      "22": { value: line.S11.16, when: "line.S11.24 > 0" }
      "23": { value: line.S11.23, when: "line.S11.24 > 0" }
      "24": line.S11.24
