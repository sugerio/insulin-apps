name: Deploy

# Deploys a release by hand (Actions → Deploy → Run workflow, on main): to retry a deploy that failed, to go back to an
# earlier release (with `rollback`), or to send changed settings out. It waits in one queue with the Release runs (the
# `release` concurrency group, every run kept), so a deploy by hand never overlaps a release's. An app or the gateway
# named here whose latest check at or before the version didn't pass is refused; `all` leaves such an app out. See
# deploy-release.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The release to deploy, such as v0.1.2
        required: true
        type: string
      apps:
        description: The apps to deploy, separated by spaces, or all
        type: string
        default: all
      gateway:
        description: Deploy the gateway too (untick it for a rollback of apps only)
        type: boolean
        default: true
      rollback:
        description: Go back, if the version is older than the latest release
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    uses: ./.github/workflows/deploy-release.yml
    with:
      version: ${{ inputs.version }}
      apps: ${{ inputs.apps }}
      gateway: ${{ inputs.gateway }}
      rollback: ${{ inputs.rollback }}
    secrets: inherit
