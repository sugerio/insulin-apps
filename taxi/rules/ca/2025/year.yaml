# The 2025 Canadian rules. Each number names its source; check it there before changing it.
country: ca
year: 2025
filingUnit: person   # one return per adult; a couple's returns read each other through spouse.
extends: null        # the first year; 2026 will say `extends: 2025` and list only what changed

# The lines a summary shows, in order.
result:
  - T1.15000
  - T1.23600
  - T1.26000
  - T1.42000
  - T1.42800
  - T1.43500
  - T1.43700
  - T1.48400
  - T1.48500
  - TP1.478   # Quebec refund (TP-1 line 478)
  - TP1.479   # Quebec balance due (TP-1 line 479)

# Result lines that apply to some returns only: a resident of Quebec has no line 42800 and files the TP-1.
resultWhen:
  T1.42800: 'person.province != "QC"'
  TP1.478: 'person.province == "QC"'
  TP1.479: 'person.province == "QC"'

# The line hints compare with and without their change, added up over both returns.
outcome: RESULT.net

# The refund or balance owing a return shows: the federal one, then Quebec's for a resident of Quebec (its lines are
# in the result only then, by resultWhen).
balances:
  - { name: Federal, refund: T1.48400, owing: T1.48500 }
  - { name: Quebec, refund: TP1.478, owing: TP1.479 }

# What person.residentAllYear means.
residency: Lived in Canada all year

# What AI reading is told about Canada's documents (server/lib/reader.ts adds the slip types of slips.yaml). {year},
# {nextYear} and {lastYear} are years.
reading:
  documents: Canadian personal tax slips, receipts and notices
  notes:
    - "Quebec RL slips (RL-1, RL-2 …) print boxes as letters: report each under its key in the list, a point or dash as an underscore (box B.A of an RL-1 is B_A). On an RL-2, box C goes under C_QPP when its source of income is RRQ, and under C otherwise. Their amounts print with a space and a comma: 45 000,00 is 45000.00."
    - "Receipts and notices (RRSP, DONATION, MEDICAL, NOA) have no box numbers printed: the numbers in their list are this app's. Put each amount under the number of the matching description. For a medical receipt, person is the patient; for a notice of assessment, the taxpayer, and issuer is Canada Revenue Agency."
    - "An RRSP receipt shows contributions for one period: report those from March 4 to December 31, {year} as box 1, and those from January 1 to March 2, {nextYear} as box 2. Contributions from January 1 to March 3, {year} belong to the year before: leave them out."
    - "For a notice of assessment, taxYear is the year it assesses, such as {lastYear}; for an RRSP receipt, the year of the contributions."
