# Retirement income: IRA distributions (lines 4a and 4b), pensions and annuities (5a and 5b) from Form 1099-R, the 10%
# additional tax on an early distribution (Schedule 2, line 8), and social security benefits (6a and 6b) from Form
# SSA-1099 with the Social Security Benefits Worksheet. "Instructions" is the 2025 Instructions for Form 1040.
#
# A 1099-R is one of two types, by its IRA/SEP/SIMPLE box: RIRA when it is checked (lines 4a and 4b), R otherwise (5a
# and 5b). Box 2a is the taxable amount, and box 7 the distribution code. Worked out: codes 1, 2, 3, 4 and 7, and a
# direct rollover (G, H). Not worked out: other codes (a Roth IRA's, a loan offset, a corrective distribution), two
# codes in box 7, a taxable amount the payer didn't figure (the Simplified Method, nondeductible IRA contributions on
# Form 8606), a rollover you made yourself within 60 days, and an exception to the 10% tax (Form 5329). Each says so.

slips:
  RIRA:
    title: Form 1099-R from an IRA (the IRA/SEP/SIMPLE box checked)
    name: 1099-R (IRA)
    about: A distribution from a traditional, Roth, SEP or SIMPLE IRA, with the IRA/SEP/SIMPLE box checked
    boxes: &retirementBoxes
      1: Gross distribution
      2A: Taxable amount
      4: Federal income tax withheld
      5: Employee contributions/Designated Roth contributions or insurance premiums
      7: Distribution code(s)
      7B: Second distribution code
      14: State tax withheld
      15: State
      16: State distribution
      17: Local tax withheld
      18: Name of locality
      19: Local distribution
    # Box 15 is the state's code (the payer's state number after it isn't read); box 14, with it, is California's or
    # New York's withholding (california.yaml, new-york.yaml). Box 18 is the locality when it is New York City or
    # Yonkers, and box 17, with it, that city's withholding (new-york.yaml).
    codes: &distributionCodes
      7: [1, 2, 3, 4, 5, 6, 7, 8, 9, A, B, C, D, E, F, G, H, J, K, L, M, N, P, Q, R, S, T, U, W, Y]
      7B: [1, 2, 3, 4, 5, 6, 7, 8, 9, A, B, C, D, E, F, G, H, J, K, L, M, N, P, Q, R, S, T, U, W, Y]
      18: [NYC, YONKERS]
      15: [AL, AK, AZ, AR, CA, CO, CT, DE, DC, FL, GA, HI, ID, IL, IN, IA, KS, KY, LA, ME, MD, MA, MI, MN, MS, MO, MT, NE, NV, NH, NJ, NM, NY, NC, ND, OH, OK, OR, PA, RI, SC, SD, TN, TX, UT, VT, VA, WA, WV, WI, WY]
    # Box 5 is the part already taxed, which box 2a leaves out; boxes 16 and 19 only say which distribution the state
    # or local tax was withheld from.
    informational: [5, 16, 19]
  R:
    title: Form 1099-R Distributions From Pensions, Annuities, Retirement Plans
    name: 1099-R
    about: >-
      A pension, an annuity, or a distribution from a 401(k), 403(b) or other retirement plan, with the IRA/SEP/SIMPLE
      box not checked
    boxes: *retirementBoxes
    codes: *distributionCodes
    informational: [5, 16, 19]

  SSA:
    title: Form SSA-1099 Social Security Benefit Statement
    name: SSA-1099
    about: The social security benefits paid to you in 2025, and any federal income tax withheld from them
    boxes:
      3: Benefits paid in 2025
      4: Benefits repaid to SSA in 2025
      5: Net benefits for 2025
      6: Voluntary federal income tax withheld
    # Box 5 is box 3 less box 4.
    informational: [3, 4]

params:
  earlyDistributionRate:
    label: Additional tax on an early distribution from a retirement plan
    source: "Instructions, Schedule 2, line 8: 10% of the taxable amount of a distribution with code 1 in box 7, without Form 5329 when no exception applies"
    value: 10%
  benefitsBase:
    label: Base amount of the Social Security Benefits Worksheet
    source: "Instructions, Social Security Benefits Worksheet, line 8: $25,000 if single, head of household, qualifying surviving spouse, or married filing separately and lived apart all year"
    value: 25000
  benefitsBaseJoint:
    label: Base amount of the Social Security Benefits Worksheet, Married filing jointly
    source: "Instructions, the same worksheet, line 8: $32,000 if married filing jointly"
    value: 32000
  benefitsSecond:
    label: Second amount of the Social Security Benefits Worksheet
    source: "Instructions, the same worksheet, line 10: $9,000 if single, head of household, qualifying surviving spouse, or married filing separately and lived apart all year"
    value: 9000
  benefitsSecondJoint:
    label: Second amount of the Social Security Benefits Worksheet, Married filing jointly
    source: "Instructions, the same worksheet, line 10: $12,000 if married filing jointly"
    value: 12000
  benefitsHalf:
    label: Half of the benefits
    source: "Instructions, the same worksheet, lines 2 and 13: 50%"
    value: 50%
  benefitsMost:
    label: Most of the benefits that are taxable
    source: "Instructions, the same worksheet, lines 15 and 17: 85%"
    value: 85%

questions:
  hasIraDistribution:
    type: boolean
    module: income
    slip: RIRA
    ask: Distributions from an IRA
    help: >-
      A Form 1099-R from each IRA you took money out of, rolled over or converted, with the IRA/SEP/SIMPLE box checked.
  hasPension:
    type: boolean
    module: income
    slip: R
    ask: Pensions, annuities or retirement plan distributions
    help: A Form 1099-R from each pension, annuity, 401(k), 403(b) or other plan that paid you, with the IRA/SEP/SIMPLE box not checked.
  hasSocialSecurity:
    type: boolean
    module: income
    slip: SSA
    ask: Social security benefits
    help: The Form SSA-1099 the Social Security Administration sends each January.
  # Asked only when they matter, under the forms above.
  iraBasis:
    type: boolean
    module: income
    ask: You made nondeductible contributions to a traditional IRA (Form 8606)
    help: >-
      Contributions you made in any year without deducting them are your basis: part of each distribution is then tax
      free, figured on Form 8606. Your earlier Forms 8606 show it. Most people answer No.
    default: false
  indirectRollover:
    type: boolean
    module: income
    ask: You put money from a distribution back into an IRA or plan yourself, within 60 days
    help: >-
      A rollover the payer didn't make for you (box 7 isn't G or H). The amount you put back isn't taxed, which this app
      doesn't work out yet.
    default: false
  earlyException:
    type: boolean
    module: income
    ask: An exception to the 10% additional tax applies to a distribution with code 1
    help: >-
      Code 1 in box 7 means you were under 59½. You owe 10% more on the taxable amount, unless an exception applies (such
      as disability, medical expenses over 7.5% of AGI, a first home up to $10,000 from an IRA, higher education from an
      IRA, or a separation from service in or after the year you turned 55). An exception is claimed on Form 5329, which
      this app doesn't prepare.
    default: false
  livedApartAllYear:
    type: boolean
    module: about
    ask: You and your spouse lived apart all of 2025
    help: >-
      Filing separately, more of your social security benefits are taxable if you lived with your spouse at any time in
      2025 (Form 1040, line 6d).

lines:
  # Lines 4a to 5b: the gross and taxable amounts, for distributions with a code this app works out.
  US.ownIraGross:
    label: IRA distributions on this person's Forms 1099-R, box 1
    formula: "sum(RIRA.box1)"
  US.ownIraTaxable:
    label: Taxable IRA distributions on this person's Forms 1099-R, box 2a
    formula: 'sumWhere(RIRA.box2A, RIRA.box7, "1", "2", "3", "4", "7")'
    source: "Instructions, lines 4a and 4b: box 2a of each distribution not rolled over; a direct rollover (code G or H) is 0"
  US.ownPensionGross:
    label: Pensions and annuities on this person's Forms 1099-R, box 1
    formula: "sum(R.box1)"
  US.ownPensionTaxable:
    label: Taxable pensions and annuities on this person's Forms 1099-R, box 2a
    formula: 'sumWhere(R.box2A, R.box7, "1", "2", "3", "4", "7")'
  US.ownIraRollover:
    label: This person rolled an IRA distribution over directly (1 for yes)
    formula: 'if(countWhere(RIRA.box1, RIRA.box7, "G", "H") > 0, 1, 0)'
  US.ownPensionRollover:
    label: This person rolled a plan distribution over directly (1 for yes)
    formula: 'if(countWhere(R.box1, R.box7, "G", "H") > 0, 1, 0)'
  US.ownEarlyDistribution:
    label: Taxable early distributions (code 1) on this person's Forms 1099-R
    formula: 'sumWhere(RIRA.box2A, RIRA.box7, "1") + sumWhere(R.box2A, R.box7, "1")'
  US.ownRetirementScope:
    label: This person's Forms 1099-R this app doesn't work out
    formula: >-
      if(count(RIRA.box1) + count(R.box1) > countWhere(RIRA.box1, RIRA.box7, "1", "2", "3", "4", "7", "G", "H") + countWhere(R.box1, R.box7, "1", "2", "3", "4", "7", "G", "H"),
      unsupported("A Form 1099-R has a distribution code in box 7 this app doesn't work out yet (only 1, 2, 3, 4, 7, G and H), or none: check box 7 at Confirm"),
      if(countWhere(RIRA.box1, RIRA.box7B, "1", "2", "3", "4", "5", "6", "7", "8", "9", "A", "B", "C", "D", "E", "F", "G", "H", "J", "K", "L", "M", "N", "P", "Q", "R", "S", "T", "U", "W", "Y") + countWhere(R.box1, R.box7B, "1", "2", "3", "4", "5", "6", "7", "8", "9", "A", "B", "C", "D", "E", "F", "G", "H", "J", "K", "L", "M", "N", "P", "Q", "R", "S", "T", "U", "W", "Y") > 0,
      unsupported("A Form 1099-R has two codes in box 7, which this app doesn't work out yet"),
      if(countWhere(RIRA.box1, RIRA.box7, "1", "2", "3", "4", "7") + countWhere(R.box1, R.box7, "1", "2", "3", "4", "7")
      > countWhere(RIRA.box2A, RIRA.box7, "1", "2", "3", "4", "7") + countWhere(R.box2A, R.box7, "1", "2", "3", "4", "7"),
      unsupported("A Form 1099-R has no taxable amount in box 2a: enter it at Confirm (for a traditional IRA without nondeductible contributions, box 1). A pension's taxable part may need the Simplified Method, which this app doesn't work out"),
      if(count(RIRA.box1) + count(R.box1) == 0, 0,
      if(line.US.ownIraTaxable > 0 and answer.iraBasis,
      unsupported("Nondeductible contributions make part of an IRA distribution tax free, figured on Form 8606, which this app doesn't prepare"),
      if(answer.indirectRollover, unsupported("A rollover you made yourself within 60 days isn't worked out yet"),
      if(line.US.ownEarlyDistribution > 0 and answer.earlyException,
      unsupported("An exception to the 10% additional tax is claimed on Form 5329, which this app doesn't prepare"), 0)))))))
    source: "Instructions, lines 4a to 5b and Schedule 2, line 8"

  F1040.4a:
    label: IRA distributions
    formula: "line.US.ownIraGross + if(line.US.joint == 1, spouse.line.US.ownIraGross, 0)"
  F1040.4b:
    label: Taxable IRA distributions
    formula: "line.US.ownIraTaxable + if(line.US.joint == 1, spouse.line.US.ownIraTaxable, 0)"
  F1040.5a:
    label: Pensions and annuities
    formula: "line.US.ownPensionGross + if(line.US.joint == 1, spouse.line.US.ownPensionGross, 0)"
  F1040.5b:
    label: Taxable pensions and annuities
    formula: "line.US.ownPensionTaxable + if(line.US.joint == 1, spouse.line.US.ownPensionTaxable, 0)"
  US.iraRollover:
    label: An IRA distribution was rolled over (1 for yes)
    formula: "if(line.US.ownIraRollover + if(line.US.joint == 1, spouse.line.US.ownIraRollover, 0) > 0, 1, 0)"
    source: "Instructions, lines 4a and 4b, Exception 1: check box 1 (Rollover) on line 4c"
  US.pensionRollover:
    label: A pension or plan distribution was rolled over (1 for yes)
    formula: "if(line.US.ownPensionRollover + if(line.US.joint == 1, spouse.line.US.ownPensionRollover, 0) > 0, 1, 0)"
    source: "Instructions, lines 5a and 5b: check box 1 (Rollover) on line 5c"
  S2.8:
    label: Additional tax on early distributions
    formula: "round((line.US.ownEarlyDistribution + if(line.US.joint == 1, spouse.line.US.ownEarlyDistribution, 0)) * param.earlyDistributionRate, 2)"
    source: "Instructions, Schedule 2, line 8: 10% of the taxable amount with code 1, when no exception applies and Form 5329 isn't needed"

  # Lines 6a and 6b: the Social Security Benefits Worksheet.
  US.ownBenefits:
    label: Net social security benefits on this person's Form SSA-1099, box 5
    formula: "sum(SSA.box5)"
  SSW.1:
    label: Net social security benefits
    formula: "line.US.ownBenefits + if(line.US.joint == 1, spouse.line.US.ownBenefits, 0)"
  SSW.5:
    label: Half the benefits plus other income
    formula: >-
      round(line.SSW.1 * param.benefitsHalf, 2) + line.F1040.1z + line.F1040.2b + line.F1040.3b + line.F1040.4b + line.F1040.5b
      + line.F1040.7a + line.F1040.8 + line.F1040.2a
    source: "Worksheet, lines 2 to 5: half of line 1, Form 1040 lines 1z, 2b, 3b, 4b, 5b, 7a and 8, and line 2a"
  SSW.6:
    label: Adjustments from Schedule 1
    formula: "line.S1.13 + line.S1.15 + line.S1.20"
    source: "Worksheet, line 6: Schedule 1, lines 11 to 20, 23 and 25 (lines 13, 15 and 20 are the ones this app works out)"
  SSW.7:
    label: Income over the adjustments
    formula: "max(0, line.SSW.5 - line.SSW.6)"
  US.livedWithSpouse:
    label: Married filing separately and lived with the spouse at some time in 2025 (1 for yes)
    formula: "if(line.US.separate == 0, 0, if(line.SSW.1 == 0, 0, if(answer.livedApartAllYear, 0, 1)))"
    source: "Instructions, line 6d: married filing separately, check the box if you lived apart from your spouse all of 2025"
  SSW.9:
    label: Income over the base amount
    formula: "max(0, line.SSW.7 - if(line.US.joint == 1, param.benefitsBaseJoint, param.benefitsBase))"
    source: "Worksheet, lines 8 and 9: $32,000 jointly, else $25,000"
  SSW.10:
    label: Second amount
    formula: "if(line.US.joint == 1, param.benefitsSecondJoint, param.benefitsSecond)"
  SSW.16:
    label: Taxable benefits before the 85% limit
    formula: >-
      if(line.US.livedWithSpouse == 1, round(line.SSW.7 * param.benefitsMost, 2),
      min(round(line.SSW.1 * param.benefitsHalf, 2), round(min(line.SSW.9, line.SSW.10) * param.benefitsHalf, 2))
      + round(max(0, line.SSW.9 - line.SSW.10) * param.benefitsMost, 2))
    source: "Worksheet, lines 11 to 16 (married filing separately and living together: 85% of line 7)"
  F1040.6a:
    label: Social security benefits
    formula: "line.SSW.1"
  F1040.6b:
    label: Taxable social security benefits
    formula: "if(line.SSW.1 == 0, 0, if(line.SSW.7 == 0, 0, min(line.SSW.16, round(line.SSW.1 * param.benefitsMost, 2))))"
    source: "Worksheet, lines 17 and 18: the smaller of line 16 and 85% of the benefits"
