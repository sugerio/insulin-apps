  F3514:
    title: Form FTB 3514, California Earned Income Tax Credit
    url: https://www.ftb.ca.gov/forms/2025/2025-3514.pdf
    applies: "line.CAL.files == 1 and line.F3514.20 + line.F3514.28 + line.F3514.39 > 0"
    wholeDollars: true
    fields:
      names: { text: returnNames }
      "2": line.F540.13
      "3": "round(line.F1040.27a, 0)"
      "4": { value: line.F3514.4, zero: true }
      "13": line.F3514.13
      "16": line.F3514.13
      "18": "line.F3514.19 - line.F3514.13"
      "19": line.F3514.19
      "20": line.F3514.20
      # Part VII, the Young Child Tax Credit, and Part IX, the Foster Youth Tax Credit (each to the cent where the form
      # says "do not round").
      "23": { value: line.F3514.19, when: "line.F3514.28 > 0" }
      "25": { value: "line.F3514.19 - param.calYoungChildThreshold", when: "line.F3514.28 > 0 and line.F3514.19 > param.calYoungChildThreshold" }
      "26": { value: "floor((line.F3514.19 - param.calYoungChildThreshold) / 100, 0.01)", when: "line.F3514.28 > 0 and line.F3514.19 > param.calYoungChildThreshold" }
      "27": { value: line.CAL.youngReduction, when: "line.F3514.28 > 0" }
      "28": line.F3514.28
      "34": { value: line.F3514.19, when: "line.F3514.39 > 0" }
      "35": { value: "line.CAL.fosterYouths * param.calYoungChildCredit", when: "line.F3514.39 > 0" }
      "36": { value: "line.F3514.19 - param.calYoungChildThreshold", when: "line.F3514.39 > 0 and line.F3514.19 > param.calYoungChildThreshold" }
      "37": { value: "floor((line.F3514.19 - param.calYoungChildThreshold) / 100, 0.01)", when: "line.F3514.39 > 0 and line.F3514.19 > param.calYoungChildThreshold" }
      "38": { value: "line.CAL.fosterYouths * line.CAL.youngReduction", when: "line.F3514.39 > 0" }
      "39": line.F3514.39
    # Part III: each qualifying child's name; the SSN, date of birth, relationship, days in California and address stay
    # for the person to fill in.
    dependants:
      which: "line.DEP.calEitcChild == 1"
      columns: 3
      fields:
        firstName: { text: firstName }
        lastName: { text: lastName }

  # New York (the Department of Taxation and Finance): printed after the federal forms for a New York return, in the
