      "134": line.T1.40600
      "139": line.T1.40600
      "142": line.T1.42000
      # Step 6 – Refund or balance owing
      "143": line.T1.42000
      "144": line.T1.42100
      "146": line.T1.42200
      "147": line.T1.42800
      "148": line.T1.43500
      "149": line.T1.43500
      "150": line.T1.43700
      "152": line.T1.44800
      "153": line.T1.45000
      "166": line.T1.48200
      "167": line.T1.43500 - line.T1.48200
