name: Gateway

# The gateway's checks: typecheck and tests (which fail while the generated docs are stale). Nothing deploys here: once
# every workflow a push started has passed, release.yml tags it as a release and deploy.yml deploys it.
on:
  push:
    branches: [main]
    paths:
      - .github/hosting/gateway/**
      - .github/hosting/scripts/**
      # The public docs: the platform's pages and images, and each app's pages (npm run check:docs).
      - .github/hosting/docs/**
      - '*/docs/public/**'
      - .github/workflows/gateway.yml
      - .github/scripts/deploy-apps.mjs
      - .github/scripts/list-apps.mjs
  pull_request:
    paths:
      - .github/hosting/gateway/**
      - .github/hosting/scripts/**
      # The public docs: the platform's pages and images, and each app's pages (npm run check:docs).
      - .github/hosting/docs/**
      - '*/docs/public/**'
      - .github/workflows/gateway.yml
      - .github/scripts/deploy-apps.mjs
      - .github/scripts/list-apps.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .github/hosting/gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/hosting/gateway/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
