name: Deploy

# Deploys a release to production: a v* tag, which only release.yml creates, on a commit of main. Nothing deploys on a
# push; a push's workflows only check it, and once they have all passed, release.yml tags the release and calls this
# workflow with it, naming the apps whose workflows ran on the released pushes.
#
# Each app is built from the release's commit in a job without the deploy settings, then a `production` job treats the
# downloaded build as untrusted, applies the app's migrations and deploys its private Worker. The gateway follows once
# every app deployed, with every app's bindings. Each Worker version is tagged with the release (`wrangler deploy --tag`),
# so Cloudflare shows which release runs.
#
# Run it by hand on main (Actions → Deploy → Run workflow) to retry a deploy that failed, or to go back to an earlier
# release. .github/scripts/check-deploy.mjs refuses a release that isn't on main, an app it doesn't have, and going back
# past a migration of anything it deploys, which needs the database restored first.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      apps:
        type: string
        default: ''
      gateway:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: The release to deploy, such as v0.1.2
        required: true
        type: string
      apps:
        description: The apps to deploy, separated by spaces, or all
        type: string
        default: all
      gateway:
        description: Deploy the gateway too
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Check the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      apps: ${{ steps.check.outputs.apps }}
      gateway: ${{ steps.check.outputs.gateway }}
    steps:
      # main's history and tags; the release is read from its tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check what to deploy
        id: check
        env:
          VERSION: ${{ inputs.version }}
          APPS: ${{ inputs.apps }}
          GATEWAY: ${{ inputs.gateway }}
        run: |
          # The production environment lets only main deploy, so the release comes from the version input.
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run Deploy on main, with the release to deploy as its version."
            exit 1
          fi
          node .github/scripts/check-deploy.mjs "$VERSION" "$APPS" "$GATEWAY"

  build:
    name: Build ${{ matrix.app }}
    needs: release
    if: needs.release.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.release.outputs.apps) }}
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The platform previews and publishes on Node 22.
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build for Cloudflare Workers
        run: npm run build
        env:
          NODE_ENV: production
          NITRO_PRESET: cloudflare_module
      - name: Insulin compatibility (build output)
        working-directory: .
        run: node .github/scripts/check-insulin-app.mjs "${{ matrix.app }}" --built
      - name: Pack build
        working-directory: .
        run: tar -czf "$RUNNER_TEMP/${{ matrix.app }}-build.tgz" "${{ matrix.app }}/.output"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.app }}-build
          path: ${{ runner.temp }}/${{ matrix.app }}-build.tgz
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: [release, build]
    if: needs.release.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.release.outputs.apps) }}
    concurrency:
      group: deploy-${{ matrix.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/hosting/gateway/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.app }}-build
          path: ${{ runner.temp }}
      - name: Unpack build
        run: |
          set -o pipefail
          archive="$RUNNER_TEMP/${{ matrix.app }}-build.tgz"
          members="$RUNNER_TEMP/${{ matrix.app }}-build.members"
          tar --list --gzip --file "$archive" --quoting-style=literal | tee "$members"
          node .github/scripts/check-build-archive.mjs "$members" "${{ matrix.app }}/.output"
          if ! tar --list --verbose --gzip --file "$archive" | awk 'substr($1, 1, 1) != "-" && substr($1, 1, 1) != "d" { exit 1 }'; then
            echo "::error::Build archive contains a link or special file."
            exit 1
          fi
          tar --extract --gzip --file "$archive" --no-same-owner --no-same-permissions
      - name: Install deployment tooling
        run: npm ci --prefix .github/hosting/gateway --ignore-scripts --no-audit --no-fund
      - name: Deploy app
        run: node .github/scripts/deploy-apps.mjs --skip-build --only "${{ matrix.app }}"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'insulinapps.com' }}
          # Optional: derives the app's SUGER_APP_TOKEN for the gateway's integration proxy and mail relay.
          GATEWAY_SECRET_KEY: ${{ secrets.GATEWAY_SECRET_KEY }}
          # The environment's secrets and variables, from which the deploy picks only the names the app declares in
          # its package.json (insulin.secrets). Only this step sees them; the build ran in its own job, without them.
          APP_SECRETS_JSON: ${{ toJSON(secrets) }}
          APP_VARS_JSON: ${{ toJSON(vars) }}

  gateway:
    name: Deploy gateway
    needs: [release, build, deploy]
    # After every app deployed (or when there were none), so new hostnames and service bindings go live with them.
    if: >-
      !cancelled() && needs.release.result == 'success' && needs.release.outputs.gateway == 'true' &&
      contains(fromJSON('["success", "skipped"]'), needs.build.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.deploy.result)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: gateway-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/hosting/gateway/package-lock.json
      - name: Install deployment tooling
        run: npm ci --prefix .github/hosting/gateway --ignore-scripts --no-audit --no-fund
      - name: Deploy gateway
        run: node .github/scripts/deploy-apps.mjs --gateway-only
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'insulinapps.com' }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          GATEWAY_SECRET_KEY: ${{ secrets.GATEWAY_SECRET_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          ORG_REQUEST_EMAIL: ${{ vars.ORG_REQUEST_EMAIL }}
