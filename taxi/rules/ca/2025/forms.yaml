  # -------------------------------------------------------------------------------------------------------------------
  # Revenu Québec's forms: a resident of Quebec files the TP-1 besides the federal return (T1QC and its schedules,
  # above), so it prints after them, followed by the TP-1's schedules in Revenu Québec's order. The PDFs come from
  # revenuquebec.ca. A row is the line number printed in the frame left of its box: the TP-1's own line, or the
  # schedule's. A decimal line keeps its point ("377.1" is line TP1.377_1); a number printed again is keyed by its page
  # ("p3:199" is line 199 carried to page 3; on Schedule P's page 2, section 2's line 64 is "p2:64"), then by its order
  # on that page ("p2:64#2"). Schedule D (the solidarity tax credit) has no amounts and its dwelling and roll
  # numbers are copied by hand; Schedules A and M only carry an answer to lines 367, 398.1 and 385, so they aren't
  # printed; the work charts (TP-1.D.GR-V) are kept by the person, not sent.

  # Rows the app has nothing for stay blank: the CPP lines (96 to 96.2, form LE-35-V), the codes of lines 206, 286,
  # 296 and 461, and lines it doesn't handle (see qc.yaml). Line 350 (the basic personal amount) is printed.
  TP1:
    title: TP-1 Income Tax Return (Revenu Québec)
    url: https://www.revenuquebec.ca/documents/en/formulaires/tp/2025-12/TP-1.D-V%282025-12%29.pdf
    french: { title: "TP-1 Déclaration de revenus (Revenu Québec)", url: https://www.revenuquebec.ca/documents/fr/formulaires/tp/2025-12/TP-1.D%282025-12%29.pdf }
    applies: person.province == "QC"
    fields:
      # Information about you and your spouse: what the app knows. The SIN, address, sex, language, the first-return
      # box, the dates of a change in situation, arrival or departure, and the other questions stay for the person.
      lastName: { text: lastName }
      firstName: { text: firstName }
      birthDate: { text: birthDate }
      spouseYes: { tick: 'family.maritalStatus == "married" or family.maritalStatus == "common_law"' }
      spouseNo: { tick: 'family.maritalStatus != "married" and family.maritalStatus != "common_law"' }
      foreignPropertyYes: { tick: answer.hasForeignProperty }
      foreignPropertyNo: { tick: not answer.hasForeignProperty }
      spouseLastName: { text: spouseLastName, when: "line.HH.partner == 1" }
      spouseFirstName: { text: spouseFirstName, when: "line.HH.partner == 1" }
      spouseBirthDate: { text: spouseBirthDate, when: "line.HH.partner == 1" }
      # Known only when the spouse's return is prepared here too.
      spouseSelfEmployed: { tick: "line.SPOUSES.together == 1 and spouse.answer.hasSelfEmployment" }
      # Revenu Québec asks for the spouse's net income even when it is zero.
      "51": { value: line.QC.spouseNet, when: "line.HH.partner == 1", zero: true }
      # Contributions (not added into income)
      "97": line.TP1.97
      "98": line.TP1.98
      "98.1": line.TP1.98_1
      "98.2": line.TP1.98_2
      "100": sum(RL1.boxM)
      # Total income
      "101": line.TP1.101
      "110": line.TP1.110
      "111": line.TP1.111
      "114": line.TP1.114
      "119": line.TP1.119
      "122": line.TP1.122
      "123": line.TP1.123
      "166": line.TP1.166
      "167": line.TP1.167
      "128": line.TP1.128
      "130": line.TP1.130
      "139": line.TP1.139
      "142": line.TP1.142
      "147": line.TP1.147
      "154": line.TP1.154
      "164": line.TP1.164
      "199": line.TP1.199
      # Net income
      "p3:199": line.TP1.199
      "201": line.TP1.201
      "205": line.TP1.205
      "207": line.TP1.207
      "214": line.TP1.214
      "215": line.TP1.215
      "225": line.TP1.225
      "231": line.TP1.231
      "245": line.TP1.245
      "246": line.TP1.246
      "248": line.TP1.248
      # The social benefits repayment is the only deduction of line 250 the app enters: code 03 in box 249 (guide, line 250).
      "249": { count: "if(line.TP1.250 > 0, 3, 0)" }
      "250": line.TP1.250
      "254": line.TP1.254
      "256": line.TP1.256
      "275": line.TP1.275
      # Taxable income
      "279": line.TP1.279
      "289": line.TP1.289
      "290": line.TP1.290
      "298": line.TP1.298
      "299": line.TP1.299
      # Non-refundable tax credits
      "361": line.TP1.361
      "367": line.TP1.367
      "376": line.TP1.376
      "377": line.TP1.377
      "377.1": line.TP1.377_1
      "381": line.TP1.381
      "385": line.TP1.385
      "388": line.TP1.388
      "389": line.TP1.389
      "393": line.TP1.393
      "395": line.TP1.395
      "397.1": line.TP1.397_1
      "397": line.TP1.397
      "398": line.TP1.398
      "398.1": line.TP1.398_1
      "399": line.TP1.399
      # Income tax and contributions
      "401": line.TP1.401
      "406": line.TP1.406
      "413": line.TP1.413
      "414": line.TP1.414
      "415": line.TP1.415
      "425": line.TP1.425
      "430": line.TP1.430
      "431": line.TP1.431
      "432": line.TP1.432
      "p5:432": line.TP1.432
      "439": line.TP1.439
      "441": line.TP1.441
      "445": line.TP1.445
      "446": line.TP1.446
      # The situation that exempts you from the drug insurance premium (14, 32 or 34), instead of Schedule K.
      "449": { count: line.TP1.449 }
      "447": line.TP1.447
      "450": line.TP1.450
      # Refund or balance due
      "451": line.TP1.451
      "451.1": line.TP1.451_1
      "451.2": line.TP1.451_2
      "451.3": line.TP1.451_3
      "452": line.TP1.452
      "453": line.TP1.453
      "455": line.TP1.455
      "456": line.TP1.456
      "457": line.TP1.457
      "458": line.TP1.458
      "462": line.TP1.462
      "463": line.TP1.463
      "465": line.TP1.465
      "468": line.TP1.468
      "470": line.TP1.470
      "474": line.TP1.474
      "478": line.TP1.478
      "475": line.TP1.475
      "479": line.TP1.479

  # The age, living-alone and retirement amounts (Part B, claimed for the couple on the return of the person preparing:
  # the other spouse's Schedule B takes it off on line 33), medical expenses (Part C) and the refundable medical credit
  # (Part D). Line 21 (a single-parent family's adult student) and Part E aren't handled.
  QCB:
    title: Schedule B, Tax Relief Measures (Revenu Québec)
    url: https://www.revenuquebec.ca/documents/en/formulaires/tp/2025-12/TP-1.D.B-V%282025-12%29.pdf
    french: { title: "Annexe B, Allègements fiscaux (Revenu Québec)", url: https://www.revenuquebec.ca/documents/fr/formulaires/tp/2025-12/TP-1.D.B%282025-12%29.pdf }
    applies: 'person.province == "QC" and (line.TP1.361 > 0 or line.TP1.381 > 0 or line.QCB.50 > 0)'
    fields:
      # Part A – Family income
      "10": line.TP1.275
      "12": line.QC.spouseNet
      "14": line.QC.family
      # Part B
      "15": { value: line.QC.family, when: "line.QCB.30 > 0" }
      "18": { value: line.QCB.18, when: "line.QCB.30 > 0" }
      "20": line.QCB.20
      "22": line.QCB.22
      "23": line.QCB.23
      "27": line.QCB.27
      "28": line.QCB.28
      "30": line.QCB.30
      "31": { value: line.QCB.31, when: "line.QCB.30 > 0" }
      "32": line.QCB.32
      "33": "if(line.QC.couple == 1, spouse.line.TP1.361, 0)"
      "34": line.TP1.361
      # Work chart – amount for retirement income: your column, then your spouse's (lines 2 to 5 aren't handled).
      "1@1": { value: "line.TP1.122 + line.TP1.123", when: "line.QCB.27 > 0" }
      "6@1": { value: line.TP1.245, when: "line.QCB.27 > 0" }
      "7@1": { value: line.TP1.245, when: "line.QCB.27 > 0" }
      "8@1": { value: "line.TP1.122 + line.TP1.123 - line.TP1.245", when: "line.QCB.27 > 0" }
      "9@1": line.QCB.27
      "1@2": { value: "spouse.line.TP1.122 + spouse.line.TP1.123", when: "line.QCB.28 > 0" }
      "6@2": { value: spouse.line.TP1.245, when: "line.QCB.28 > 0" }
      "7@2": { value: spouse.line.TP1.245, when: "line.QCB.28 > 0" }
      "8@2": { value: "spouse.line.TP1.122 + spouse.line.TP1.123 - spouse.line.TP1.245", when: "line.QCB.28 > 0" }
      "9@2": line.QCB.28
      # Part C – Medical expenses, on the return of the spouse who claims them.
      "36": line.QCB.36
      "37": { value: line.QC.family, when: "line.QCB.36 > 0" }
      "39": { value: line.QCB.39, when: "line.QCB.36 > 0" }
      "40": line.TP1.381
      # Part D – Refundable tax credit for medical expenses
      "41": { value: line.TP1.381, when: "line.QCB.50 > 0" }
