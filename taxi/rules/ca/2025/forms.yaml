    url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.pdf
    applies: 'person.province == "ON"'
    fields:
      "1": line.T1.26000
      # Part B – Ontario non-refundable tax credits
      "9": line.ON428.9
      "10": line.ON428.10
      "12": "if(line.HH.partner == 1, line.HH.spouseNetIncome, 0)"
      "13": line.ON428.13
      "15": "if(line.HH.partner == 0 and household.childrenUnder18 > 0, answer.dependantNetIncome, 0)"
      "16": line.ON428.16
      "18": line.ON428.9 + line.ON428.10 + line.ON428.13 + line.ON428.16
      "19": line.T1.30800
      "20": line.T1.31000
      "21": line.T1.31200
      "24": line.ON428.24
      "25": line.ON428.9 + line.ON428.10 + line.ON428.13 + line.ON428.16 + line.ON428.24
      "26": line.ON428.9 + line.ON428.10 + line.ON428.13 + line.ON428.16 + line.ON428.24
      "27": line.ON428.27
      "28": line.ON428.9 + line.ON428.10 + line.ON428.13 + line.ON428.16 + line.ON428.24 + line.ON428.27
      "31": line.ON428.9 + line.ON428.10 + line.ON428.13 + line.ON428.16 + line.ON428.24 + line.ON428.27
      "34": line.ON428.34
      "35": line.ON428.9 + line.ON428.10 + line.ON428.13 + line.ON428.16 + line.ON428.24 + line.ON428.27 + line.ON428.34
      "36": line.ON428.36
      "37": line.T1.23600
      "39": round(line.T1.23600 * param.medicalThresholdRate, 2)
      "40": min(param.onMedicalThresholdMax, round(line.T1.23600 * param.medicalThresholdRate, 2))
      "41": line.ON428.41
      "43": line.ON428.41
      "44": line.ON428.44
      "46": line.ON428.46
      "47": round(line.S9.13 * param.onDonationLowRate, 2)
      "48": round(line.S9.14 * param.onDonationHighRate, 2)
      "49": line.ON428.49
      "50": line.ON428.50
      # Part C – Ontario tax
      "51": line.ON428.8
      "52": line.ON428.50
      "53": line.ON428.53
      "55": line.ON428.53
      "56": line.ON428.53
      "57": line.ON428.57
      "58": max(0, line.ON428.53 - line.ON428.57)
      "61": line.ON428.53
      "62": line.ON428.53
      "63": line.ON428.53
      "65": line.ON428.53
      "66": round(max(0, line.ON428.53 - param.onSurtaxThreshold1) * param.onSurtaxRate1, 2)
      "67": round(max(0, line.ON428.53 - param.onSurtaxThreshold2) * param.onSurtaxRate2, 2)
      "68": line.ON428.68
      "69": line.ON428.53 + line.ON428.68
      "70": line.ON428.57
      "71": line.ON428.73
      "73": line.ON428.73
      # The Ontario tax reduction: worked out only when there is tax to reduce (line 74, $294, is printed).
      "75": line.ON428.75
      "77": { value: "param.onTaxReductionBasic + line.ON428.75", when: "line.ON428.73 > 0" }
      "78": { value: "2 * (param.onTaxReductionBasic + line.ON428.75)", when: "line.ON428.73 > 0" }
      "79": { value: "line.ON428.73", when: "line.ON428.73 > 0" }
      "80": line.ON428.80
      "81": line.ON428.81
      "82": line.ON428.82
      "83": line.ON428.83
      "84": line.ON428.83
      "85": line.ON428.85
      "86": line.ON428.86
      "88": line.ON428.86
      "89": line.ON428.89
      "90": line.ON428.90
    tables:
      # Part A – Ontario tax on taxable income
      - brackets: onTaxBrackets
        amount: line.T1.26000
        parts:
          - { columns: "3", amount: "2", over: "4", times: "6", tax: "8" }

