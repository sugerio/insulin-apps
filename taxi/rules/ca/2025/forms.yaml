  S5:
    title: Schedule 5, Amounts for a Spouse or Common-Law Partner and Dependants
    url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s5/5000-s5-25e.pdf
    # The schedule is for lines 30300, 30400, 30425 and 30450. Line 30500 is claimed on the return itself (page 6 has
    # no boxes). The marital status change (55220, 55290) and the dependants' names, SIN and details stay blank.
    applies: "line.T1.30300 + line.T1.30400 + line.T1.30425 + line.T1.30450 > 0"
    fields:
      # Line 30300. Also worked out when only the caregiver amount (30425) is claimed: it starts from line 2 here. For a
      # part-year resident, line 1 (line 30000) and the $2,687 on line 2 are prorated, and their net income isn't.
      "1": { value: line.T1.30000, when: "line.T1.30300 + line.T1.30425 > 0" }
      "2": { value: "round(param.caregiverChildAmount * line.RES.factor, 2)", when: "line.T1.30300 + line.T1.30425 > 0 and answer.spouseInfirm" }
      "3": { value: line.S5.3, when: "line.T1.30300 + line.T1.30425 > 0" }
      "4": { value: line.HH.spouseIncomeForCredits, when: "line.T1.30300 + line.T1.30425 > 0" }
      "5": line.T1.30300
      # Line 30400: the app claims it for a child under 18 with no infirmity, so the infirmity amount (51100, line 2)
      # is zero.
      "p4:1": { value: line.T1.30000, when: "line.T1.30400 > 0" }
      "p4:3": { value: line.T1.30000, when: "line.T1.30400 > 0" }
      "p4:4": { value: answer.dependantNetIncome, when: "line.T1.30400 > 0" }
      "p4:5": line.T1.30400
      # Line 30425, for the spouse (the app's only case): worked out only when it gives an amount, as the form asks.
      # Line 1 has $28,798 printed (so does line 30450's line 1): for a part-year resident it is prorated in line 3,
      # with the $8,601 cap, as on the return.
      "p4:2.2": { value: line.HH.spouseIncomeForCredits, when: "line.T1.30425 > 0" }
      "p4:3.2":
        value: "min(round(param.caregiverMax * line.RES.factor, 2), max(0, round(param.caregiverBase * line.RES.factor, 2) - line.HH.spouseIncomeForCredits))"
        when: "line.T1.30425 > 0"
      "p4:4.2": { value: line.T1.30300, when: "line.T1.30425 > 0" }
      "p4:5.2": line.T1.30425
      # Line 30450, for one dependant (the app handles one).
      "p5:2": { value: answer.infirmDependantIncome, when: "line.T1.30450 > 0" }
      "p5:3": line.T1.30450
      "51120": { count: answer.infirmDependants, when: "line.T1.30450 > 0" }

  S6:
    title: Schedule 6, Canada Workers Benefit
    url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s6/5000-s6-25e.pdf
    # 5000-S6 is for every province and territory but Quebec, Alberta and Nunavut, whose own Schedule 6 (5005-S6,
    # 5009-S6, 5014-S6, with other amounts and rates) isn't printed here.
    applies: 'line.CWB.schedule == 1 and person.province != "QC" and person.province != "AB" and person.province != "NU"'
    fields:
      # Step 1's yes/no questions (38100 to 38105) have no tick places in the layout: the person ticks them. Column 2 is
      # the eligible spouse, filled when their return is prepared here (without it the app can't work out the benefit).
      # Part A – Family working income. No tax-exempt income (line 4).
      "1@1": line.T1.10100 + line.T1.10400
      "1@2": { value: spouse.line.T1.10100 + spouse.line.T1.10400, when: "line.CWB.spouse == 1 and family.partnerInYear" }
      "2@1": line.T1.13010
      "2@2": { value: spouse.line.T1.13010, when: "line.CWB.spouse == 1 and family.partnerInYear" }
      "3@1": max(0, line.SE.net)
      "3@2": { value: "max(0, spouse.line.SE.net)", when: "line.CWB.spouse == 1 and family.partnerInYear" }
      # "Enter the result, even if it is 0."
      "5@1": { value: line.CWB.working, zero: true }
      "5@2": { value: spouse.line.CWB.working, when: "line.CWB.spouse == 1 and family.partnerInYear", zero: true }
      "6": line.CWB.familyWorking
      # Part B – Adjusted family net income. No exempt income (line 8) or UCCB and RDSP repayments (line 9); line 11 is
      # the RDSP income.
      "7@1": line.T1.23600
      "7@2": { value: spouse.line.T1.23600, when: "line.CWB.spouse == 1 and family.partnerInYear" }
      "10@1": line.T1.23600
      "10@2": { value: spouse.line.T1.23600, when: "line.CWB.spouse == 1 and family.partnerInYear" }
      "11@1": line.T1.12500
      "11@2": { value: spouse.line.T1.12500, when: "line.CWB.spouse == 1 and family.partnerInYear" }
      "12@1": line.CWB.netIncome
      "12@2": { value: spouse.line.CWB.netIncome, when: "line.CWB.spouse == 1 and family.partnerInYear" }
      "13": "line.CWB.netIncome + if(line.CWB.spouse == 1 and family.partnerInYear, spouse.line.CWB.netIncome, 0)"
      # The secondary earner exemption: from the column of the spouse with the lower working income.
      "14":
        value: >-
          min(param.cwbSecondaryEarnerMax, if(line.CWB.working < spouse.line.CWB.working,
          min(line.CWB.working, line.CWB.netIncome), min(spouse.line.CWB.working, spouse.line.CWB.netIncome)))
        when: "line.CWB.spouse == 1 and family.partnerInYear"
      "15": line.CWB.familyIncome
      # Step 2 – Basic CWB, on the return that claims it for the couple.
      "16": { value: line.CWB.familyWorking, when: "line.CWB.claimsBasic == 1" }
      "18": { value: "max(0, line.CWB.familyWorking - param.cwbWorkingIncomeBase)", when: "line.CWB.claimsBasic == 1" }
      "20": { value: "round(max(0, line.CWB.familyWorking - param.cwbWorkingIncomeBase) * param.cwbRate, 2)", when: "line.CWB.claimsBasic == 1" }
      "21": { value: "if(line.CWB.spouse == 1 or line.CWB.dependant == 1, param.cwbMaxFamily, param.cwbMaxSingle)", when: "line.CWB.claimsBasic == 1" }
      "22":
        value: >-
          min(round(max(0, line.CWB.familyWorking - param.cwbWorkingIncomeBase) * param.cwbRate, 2),
          if(line.CWB.spouse == 1 or line.CWB.dependant == 1, param.cwbMaxFamily, param.cwbMaxSingle))
        when: "line.CWB.claimsBasic == 1"
      "23": { value: line.CWB.familyIncome, when: "line.CWB.claimsBasic == 1" }
      "24": { value: "if(line.CWB.spouse == 1 or line.CWB.dependant == 1, param.cwbIncomeBaseFamily, param.cwbIncomeBaseSingle)", when: "line.CWB.claimsBasic == 1" }
      "25":
        value: "max(0, line.CWB.familyIncome - if(line.CWB.spouse == 1 or line.CWB.dependant == 1, param.cwbIncomeBaseFamily, param.cwbIncomeBaseSingle))"
        when: "line.CWB.claimsBasic == 1"
      "27@1":
        value: >-
          round(max(0, line.CWB.familyIncome - if(line.CWB.spouse == 1 or line.CWB.dependant == 1, param.cwbIncomeBaseFamily,
          param.cwbIncomeBaseSingle)) * param.cwbReductionRate, 2)
        when: "line.CWB.claimsBasic == 1"
      "27":
        value: >-
          round(max(0, line.CWB.familyIncome - if(line.CWB.spouse == 1 or line.CWB.dependant == 1, param.cwbIncomeBaseFamily,
          param.cwbIncomeBaseSingle)) * param.cwbReductionRate, 2)
        when: "line.CWB.claimsBasic == 1"
      "28": line.CWB.basic
      # Step 3 – CWB disability supplement, for a person eligible for the disability tax credit.
      "29": { value: line.CWB.working, when: "line.CWB.eligible == 1 and answer.hasDisability" }
      "31": { value: "max(0, line.CWB.working - param.cwbDisabilityWorkingBase)", when: "line.CWB.eligible == 1 and answer.hasDisability" }
      "33": { value: "round(max(0, line.CWB.working - param.cwbDisabilityWorkingBase) * param.cwbRate, 2)", when: "line.CWB.eligible == 1 and answer.hasDisability" }
      "34":
        value: "min(round(max(0, line.CWB.working - param.cwbDisabilityWorkingBase) * param.cwbRate, 2), param.cwbDisabilityMax)"
        when: "line.CWB.eligible == 1 and answer.hasDisability"
      "35": { value: line.CWB.familyIncome, when: "line.CWB.eligible == 1 and answer.hasDisability" }
      "36":
        value: "if(line.CWB.spouse == 1 or line.CWB.dependant == 1, param.cwbDisabilityIncomeBaseFamily, param.cwbDisabilityIncomeBaseSingle)"
        when: "line.CWB.eligible == 1 and answer.hasDisability"
      "37":
        value: >-
          max(0, line.CWB.familyIncome - if(line.CWB.spouse == 1 or line.CWB.dependant == 1, param.cwbDisabilityIncomeBaseFamily,
          param.cwbDisabilityIncomeBaseSingle))
        when: "line.CWB.eligible == 1 and answer.hasDisability"
      # The rate, as a percent: 7.5 when both spouses are eligible for the disability tax credit, else 15.
      "38":
        value: >-
          100 * if(line.CWB.spouse == 1 and family.partnerInYear and spouse.answer.hasDisability,
          param.cwbReductionRateBothDisabled, param.cwbReductionRate)
        when: "line.CWB.eligible == 1 and answer.hasDisability"
      "39@1":
        value: >-
          round(max(0, line.CWB.familyIncome - if(line.CWB.spouse == 1 or line.CWB.dependant == 1, param.cwbDisabilityIncomeBaseFamily,
          param.cwbDisabilityIncomeBaseSingle)) * if(line.CWB.spouse == 1 and family.partnerInYear and spouse.answer.hasDisability,
          param.cwbReductionRateBothDisabled, param.cwbReductionRate), 2)
        when: "line.CWB.eligible == 1 and answer.hasDisability"
      "39":
        value: >-
          round(max(0, line.CWB.familyIncome - if(line.CWB.spouse == 1 or line.CWB.dependant == 1, param.cwbDisabilityIncomeBaseFamily,
          param.cwbDisabilityIncomeBaseSingle)) * if(line.CWB.spouse == 1 and family.partnerInYear and spouse.answer.hasDisability,
          param.cwbReductionRateBothDisabled, param.cwbReductionRate), 2)
        when: "line.CWB.eligible == 1 and answer.hasDisability"
      "40": { value: line.CWB.disability, when: "line.CWB.eligible == 1 and answer.hasDisability" }
      "41": { value: line.CWB.basic, when: "line.CWB.eligible == 1 and answer.hasDisability" }
      "42": { value: line.T1.45300, when: "line.CWB.eligible == 1 and answer.hasDisability" }
      # Step 4 – Advanced CWB (RC210 slips), also with no benefit. The return claiming the basic benefit reports both
      # spouses' box 10, or when neither claims it, the person preparing's (CWB.reportsAdvance).
      "43": { value: line.T1.45300, when: "line.T1.41500 > 0" }
      "44": { value: sum(RC210.box10), when: "line.CWB.reportsAdvance == 1" }
      "45": { value: sum(spouse.RC210.box10), when: "line.CWB.reportsAdvance == 1 and family.partnerInYear and line.HH.partner == 1" }
      "46": "if(line.CWB.reportsAdvance == 1, sum(RC210.box10) + if(family.partnerInYear and line.HH.partner == 1, sum(spouse.RC210.box10), 0), 0)"
      "47": sum(RC210.box11)
      "48": >-
        if(line.CWB.reportsAdvance == 1, sum(RC210.box10) + if(family.partnerInYear and line.HH.partner == 1, sum(spouse.RC210.box10), 0), 0)
        + sum(RC210.box11)
      "49": line.T1.41500

  S8:
    title: Schedule 8, Canada Pension Plan Contributions and Overpayment
    url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.pdf
    # For self-employment earnings: Part 4 when there is no employment income, else Part 3 and then Part 5. Part 1 (an
    # election) doesn't apply. Part 2 prorates the maximums by the months CPP applied.
    applies: "line.T1.42100 > 0"
    fields:
      # Part 2 – the maximums for the months CPP applied (line A, page 3, isn't in the layout: the key A is Part 5's amount
      # A on page 10).
      B: line.CPP.ympe
      C: line.CPP.secondMax
      D: line.CPP.yampe
      E: line.CPP.exemption
      # Part 3 – contributions on employment income, from the T4 slips, as the form works them out.
      "1": line.CPP.employed
      "2@1": min(line.CPP.yampe, line.CPP.employed)
      "2": min(line.CPP.yampe, line.CPP.employed)
      "3": { value: line.CPP.ympe, when: "line.CPP.employed > 0" }
      "4@1": line.CPP.employedSecondEarnings
      "4": line.CPP.employedSecondEarnings
      "5": min(line.CPP.ympe, line.CPP.employed)
      "6": { value: line.CPP.exemption, when: "line.CPP.employed > 0" }
      "7": line.CPP.employedBaseEarnings
      "8": line.CPP.deducted
      "9@1": line.CPP.deducted
      "9": line.CPP.actualBase
      "10": line.CPP.actualFirst
      "11@1": line.CPP.employedBaseEarnings
      "11": line.CPP.requiredBase
      "12@1": line.CPP.employedBaseEarnings
      "12": line.CPP.requiredFirst
      "13": line.CPP.requiredBase + line.CPP.requiredFirst
      "14": line.CPP.actualBase
      "15": line.CPP.requiredBase
      "16": line.CPP.baseDiff
      "17": line.CPP.actualFirst
      "18": line.CPP.requiredFirst
      "19@1": line.CPP.firstDiff
      "19": line.CPP.firstDiff
      "20": line.CPP.baseFirstDiff
      "21": line.CPP.secondDeducted
      "22@1": line.CPP.employedSecondEarnings
      "22": line.CPP.requiredSecond
      "23@1": line.CPP.secondDiff
      "23": line.CPP.secondDiff
      "24": line.CPP.employmentDiff
      # Parts 3a and 3b (lines 25 to 48) are for employment income only: with self-employment earnings, Part 5 takes
      # their place.

      # Part 4 – self-employment earnings only.
      "p6:1": { value: line.CPP.seEarnings, when: "line.CPP.employed == 0" }
      "p6:3": { value: line.CPP.seEarnings, when: "line.CPP.employed == 0" }
      "p6:4@1": { value: "min(line.CPP.yampe, line.CPP.seEarnings)", when: "line.CPP.employed == 0" }
      "p6:4": { value: "min(line.CPP.yampe, line.CPP.seEarnings)", when: "line.CPP.employed == 0" }
      "p6:5": { value: line.CPP.ympe, when: "line.CPP.employed == 0" }
      "p6:6@1": { value: line.CPP.secondEarnings, when: "line.CPP.employed == 0" }
      "p6:6": { value: line.CPP.secondEarnings, when: "line.CPP.employed == 0" }
      "p6:7": { value: "min(line.CPP.ympe, line.CPP.seEarnings)", when: "line.CPP.employed == 0" }
      "p6:8": { value: line.CPP.exemption, when: "line.CPP.employed == 0" }
      "p6:9": { value: line.CPP.baseEarnings, when: "line.CPP.employed == 0" }
      "p7:10@1": { value: line.CPP.baseEarnings, when: "line.CPP.employed == 0" }
      "p7:10": { value: line.CPP.base, when: "line.CPP.employed == 0" }
      "p7:11@1": { value: line.CPP.baseEarnings, when: "line.CPP.employed == 0" }
      "p7:11": { value: line.CPP.first, when: "line.CPP.employed == 0" }
      "p7:12@1": { value: line.CPP.secondEarnings, when: "line.CPP.employed == 0" }
      "p7:12": { value: line.CPP.second, when: "line.CPP.employed == 0" }
      "p7:13@1": { value: line.CPP.first + line.CPP.second, when: "line.CPP.employed == 0" }
      "p7:13": { value: line.CPP.first + line.CPP.second, when: "line.CPP.employed == 0" }
      "p7:14": { value: line.T1.42100, when: "line.CPP.employed == 0" }
      "p7:15@1": { value: line.CPP.base, when: "line.CPP.employed == 0" }
      "p7:15": { value: line.T1.31000, when: "line.CPP.employed == 0" }
      "p7:16": { value: line.CPP.first + line.CPP.second, when: "line.CPP.employed == 0" }
      "p7:17": { value: line.T1.22200, when: "line.CPP.employed == 0" }

      # Part 5 – self-employment earnings with employment income. As its CPP lines do, the app takes the contributions on
      # the T4 slips as the ones required (Part 3, lines 20 and 23 are zero), so the adjustments for an over- or
      # under-payment (lines 6, 8, 9, 12, 14, 15, 48, 50, 52 to 56, 59 to 63, 66, 67, 73 and 75 to 79, 82 and 86) are
      # left blank. No elections on Form CPT20 (lines 2 and 3).
      "p7:1": { value: line.CPP.seEarnings, when: "line.CPP.employed > 0" }
      "p7:4": { value: line.CPP.seEarnings, when: "line.CPP.employed > 0" }
      "p7:5": { value: line.CPP.employedPaid, when: "line.CPP.employed > 0" }
      "p7:7": { value: line.CPP.employedPaid, when: "line.CPP.employed > 0" }
      "p7:10.2": { value: line.CPP.employedPaid, when: "line.CPP.employed > 0" }
      "p8:11": { value: line.CPP.employedSecondPaid, when: "line.CPP.employed > 0" }
      "p8:13": { value: line.CPP.employedSecondPaid, when: "line.CPP.employed > 0" }
      "p8:16": { value: line.CPP.employedSecondPaid, when: "line.CPP.employed > 0" }
      "p8:17": { value: line.CPP.ympe, when: "line.CPP.employed > 0" }
      "p8:18": { value: line.CPP.exemption, when: "line.CPP.employed > 0" }
      "p8:19": { value: (line.CPP.ympe - line.CPP.exemption), when: "line.CPP.employed > 0" }
      "p8:20@1": { value: line.CPP.employedPaid, when: "line.CPP.employed > 0" }
      "p8:20": { value: line.CPP.covered, when: "line.CPP.employed > 0" }
      "p8:21": { value: "max(0, (line.CPP.ympe - line.CPP.exemption) - line.CPP.covered)", when: "line.CPP.employed > 0" }
      "p8:22": { value: "min(line.CPP.seEarnings, max(0, (line.CPP.ympe - line.CPP.exemption) - line.CPP.covered))", when: "line.CPP.employed > 0" }
      # Lines 23 to 29: only when employment earnings are under the basic exemption.
      "p8:23": { value: line.CPP.exemption, when: "line.CPP.employed > 0 and line.CPP.employed < line.CPP.exemption" }
      "p8:24": { value: line.CPP.employed, when: "line.CPP.employed > 0 and line.CPP.employed < line.CPP.exemption" }
      "p8:25": { value: line.CPP.exemptionLeft, when: "line.CPP.employed > 0" }
      "p8:26": { value: line.CPP.seEarnings, when: "line.CPP.employed > 0 and line.CPP.employed < line.CPP.exemption" }
      "p8:27": { value: (line.CPP.ympe - line.CPP.exemption), when: "line.CPP.employed > 0 and line.CPP.employed < line.CPP.exemption" }
      "p8:28@1":
        value: "max(0, line.CPP.seEarnings - (line.CPP.ympe - line.CPP.exemption))"
        when: "line.CPP.employed > 0 and line.CPP.employed < line.CPP.exemption"
      "p8:28":
        value: "max(0, line.CPP.seEarnings - (line.CPP.ympe - line.CPP.exemption))"
        when: "line.CPP.employed > 0 and line.CPP.employed < line.CPP.exemption"
      "p8:29@1":
        value: "max(0, line.CPP.exemptionLeft - max(0, line.CPP.seEarnings - (line.CPP.ympe - line.CPP.exemption)))"
        when: "line.CPP.employed > 0"
      "p8:29":
        value: "max(0, line.CPP.exemptionLeft - max(0, line.CPP.seEarnings - (line.CPP.ympe - line.CPP.exemption)))"
        when: "line.CPP.employed > 0"
      "p8:30": { value: line.CPP.baseEarnings, when: "line.CPP.employed > 0" }
      "p8:31": { value: line.CPP.seEarnings, when: "line.CPP.employed > 0" }
      "p8:32": { value: "min(line.CPP.yampe, line.CPP.employed)", when: "line.CPP.employed > 0" }
      "p8:33": { value: "line.CPP.seEarnings + min(line.CPP.yampe, line.CPP.employed)", when: "line.CPP.employed > 0" }
      # Lines 34 to 41: only when those earnings are over the maximum pensionable earnings.
      "p8:34":
        value: line.CPP.secondMax
        when: "line.CPP.employed > 0 and line.CPP.seEarnings + min(line.CPP.yampe, line.CPP.employed) > line.CPP.ympe"
      "p8:35@1":
        value: line.CPP.employedSecondPaid
        when: "line.CPP.employed > 0 and line.CPP.seEarnings + min(line.CPP.yampe, line.CPP.employed) > line.CPP.ympe"
      "p8:35":
        value: round(line.CPP.employedSecondPaid / param.cpp2EmployeeRate, 2)
        when: "line.CPP.employed > 0 and line.CPP.seEarnings + min(line.CPP.yampe, line.CPP.employed) > line.CPP.ympe"
      "p8:36":
        value: line.CPP.secondMax - round(line.CPP.employedSecondPaid / param.cpp2EmployeeRate, 2)
        when: "line.CPP.employed > 0 and line.CPP.seEarnings + min(line.CPP.yampe, line.CPP.employed) > line.CPP.ympe"
      "p8:37":
        value: line.CPP.seEarnings
        when: "line.CPP.employed > 0 and line.CPP.seEarnings + min(line.CPP.yampe, line.CPP.employed) > line.CPP.ympe"
      "p8:38":
        value: line.CPP.exemptionLeft
        when: "line.CPP.employed > 0 and line.CPP.seEarnings + min(line.CPP.yampe, line.CPP.employed) > line.CPP.ympe"
      "p8:39":
        value: line.CPP.seEarnings - line.CPP.exemptionLeft
        when: "line.CPP.employed > 0 and line.CPP.seEarnings + min(line.CPP.yampe, line.CPP.employed) > line.CPP.ympe"
      "p8:40":
        value: line.CPP.baseEarnings
        when: "line.CPP.employed > 0 and line.CPP.seEarnings + min(line.CPP.yampe, line.CPP.employed) > line.CPP.ympe"
      "p8:41":
        value: line.CPP.seEarnings - line.CPP.exemptionLeft - line.CPP.baseEarnings
        when: "line.CPP.employed > 0 and line.CPP.seEarnings + min(line.CPP.yampe, line.CPP.employed) > line.CPP.ympe"
      "p9:42": { value: line.CPP.secondEarnings, when: "line.CPP.employed > 0" }
      "p9:43@1": { value: line.CPP.baseEarnings, when: "line.CPP.employed > 0" }
      "p9:43": { value: line.CPP.base, when: "line.CPP.employed > 0" }
      "p9:44@1": { value: line.CPP.baseEarnings, when: "line.CPP.employed > 0" }
      "p9:44": { value: line.CPP.first, when: "line.CPP.employed > 0" }
      "p9:45@1": { value: line.CPP.secondEarnings, when: "line.CPP.employed > 0" }
      "p9:45": { value: line.CPP.second, when: "line.CPP.employed > 0" }
      "p9:46@1": { value: line.CPP.first + line.CPP.second, when: "line.CPP.employed > 0" }
      "p9:46": { value: line.CPP.first + line.CPP.second, when: "line.CPP.employed > 0" }
      "p9:47": { value: line.CPP.base + line.CPP.first + line.CPP.second, when: "line.CPP.employed > 0" }
      "49": { value: line.T1.42100, when: "line.CPP.employed > 0" }
      # Lines 51 to 69: the credit and deduction for the contributions through employment, with line 16 and line 19 of
      # Part 3 taken as zero (lines 51 and 57 are the same amount, as are 58 and 64, and 65 and 68).
      "51": { value: line.T1.30800, when: "line.CPP.employed > 0" }
      "57": { value: line.T1.30800, when: "line.CPP.employed > 0" }
      "58": { value: line.T1.22215 - line.CPP.employedSecondPaid, when: "line.CPP.employed > 0" }
      "64": { value: line.T1.22215 - line.CPP.employedSecondPaid, when: "line.CPP.employed > 0" }
      "65": { value: line.CPP.employedSecondPaid, when: "line.CPP.employed > 0" }
      "68": { value: line.CPP.employedSecondPaid, when: "line.CPP.employed > 0" }
      "69": { value: line.T1.22215, when: "line.CPP.employed > 0" }
      # Lines 70 to 88: the credit and deduction for the self-employment contributions.
      "70@1": { value: line.CPP.base, when: "line.CPP.employed > 0" }
      "70": { value: line.T1.31000, when: "line.CPP.employed > 0" }
      "71@1": { value: line.CPP.first, when: "line.CPP.employed > 0" }
      "71": { value: "round(line.CPP.first * 0.5, 2)", when: "line.CPP.employed > 0" }
      "72": { value: "line.T1.31000 + round(line.CPP.first * 0.5, 2)", when: "line.CPP.employed > 0" }
      "74": { value: "line.T1.31000 + round(line.CPP.first * 0.5, 2)", when: "line.CPP.employed > 0" }
      "78": { value: line.T1.31000, when: "line.CPP.employed > 0" }
      "80@1": { value: line.T1.31000, when: "line.CPP.employed > 0" }
      "80": { value: line.T1.31000, when: "line.CPP.employed > 0" }
      "81@1": { value: "round(line.CPP.first * 0.5, 2)", when: "line.CPP.employed > 0" }
      "81": { value: "round(line.CPP.first * 0.5, 2)", when: "line.CPP.employed > 0" }
      "83@1": { value: "round(line.CPP.first * 0.5, 2)", when: "line.CPP.employed > 0" }
      "83": { value: "round(line.CPP.first * 0.5, 2)", when: "line.CPP.employed > 0" }
      "84@1": { value: line.CPP.second, when: "line.CPP.employed > 0" }
      "84": { value: "round(line.CPP.second * 0.5, 2)", when: "line.CPP.employed > 0" }
      "85": { value: "round(line.CPP.second * 0.5, 2)", when: "line.CPP.employed > 0" }
      "87@1": { value: "round(line.CPP.second * 0.5, 2)", when: "line.CPP.employed > 0" }
