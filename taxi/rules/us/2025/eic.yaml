    value: 7.65%
  eicMaxNoChild:
    label: Largest earned income credit, no qualifying child
    source: "The 2025 EIC Table: $649, reached at $8,490 of earned income"
    value: 649
  eicEarnedAmountNoChild:
    label: Earned income at which the credit is largest, no qualifying child
    source: "The 2025 EIC Table: the row with $8,490 in it already gives $649"
    value: 8490
  eicRateOutNoChild:
    label: Earned income credit phase-out rate, no qualifying child
    source: "The 2025 EIC Table: 7.65% of the row's middle over the phase-out start"
    value: 7.65%
  eicStartNoChild:
    label: Income from which the earned income credit goes down, no qualifying child
    source: "Instructions, EIC Worksheet A, line 4: $10,620 ($17,730 if married filing jointly)"
    value: 10620
  eicStartNoChildJoint:
