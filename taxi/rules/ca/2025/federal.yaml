lines:
  # The household: whether you have a spouse or partner, and their net income
  HH.partner:
    label: Spouse or common-law partner on December 31 (1 for yes)
    formula: 'if(household.maritalStatus == "married" or household.maritalStatus == "common_law", 1, 0)'
  # Read by hints: a claim moves between the returns only when both are prepared here. The lines that move a claim read
  # the marital status only once a claim was moved, so a return's numbers don't wait for it.
  SPOUSES.together:
    label: Both spouses' returns are prepared here (1 for yes)
    formula: "if(household.partnerInYear and line.HH.partner == 1, 1, 0)"
  HH.spouseNetIncome:
    label: Your spouse's or partner's net income
    formula: "if(line.HH.partner == 1, if(household.partnerInYear, spouse.line.T1.23600, answer.spouseNetIncome), 0)"
    source: "From their return when both returns are prepared here; otherwise from your answer"

  # Step 2 – Total income
  T1.10100:
    label: Employment income
    formula: "sum(T4.box14)"
  T1.10120:
    label: Commissions included on line 10100
    formula: "sum(T4.box42)"
  T1.10400:
    label: Other employment income
    formula: "if(answer.hasForeignIncome, answer.foreignEmploymentIncome, 0)"
    source: "Employment income earned outside Canada, in Canadian dollars"
  T1.11300:
    label: Old age security pension
    formula: "sum(T4AOAS.box18)"
    source: "Box 18 of the T4A(OAS) slip"
  T1.11400:
    label: CPP or QPP benefits
    formula: "sum(T4AP.box20)"
    source: "Box 20 of the T4A(P) slip"
  T1.11410:
    label: Disability benefits included on line 11400
    formula: "sum(T4AP.box16)"
    source: "Box 16 of the T4A(P) slip"
  T1.11500:
    label: Other pensions and superannuation
    formula: "sum(T4A.box016) + if(person.age >= 65, sum(T4A.box024) + sum(T4RIF.box16), 0)"
    source: "T4A box 016; annuities (T4A box 024) and RRIF payments (T4RIF box 16) at 65 or older, else on line 13000"
  T1.11900:
    label: Employment insurance and other benefits
    formula: "sum(T4E.box14)"
    source: "Box 14 of the T4E slip"
  T1.12000:
    label: Taxable amount of dividends (eligible and other than eligible)
    formula: "sum(T5.box11) + sum(T5.box25) + sum(T3.box32) + sum(T3.box50)"
    source: "Federal Worksheet, line 12000: boxes 11 and 25 of T5 slips, boxes 32 and 50 of T3 slips"
  T1.12010:
    label: Taxable amount of dividends other than eligible
    formula: "sum(T5.box11) + sum(T3.box32)"
    source: "Federal Worksheet, line 12010"
  T1.12100:
    label: Interest and other investment income
    formula: "sum(T5.box13) + sum(T3.box25) + if(answer.hasForeignIncome, answer.foreignInvestmentIncome, 0)"
    source: "Federal Worksheet, line 12100: box 13 of T5 slips, box 25 of T3 slips, and foreign interest and dividends"
  T1.12500:
    label: Registered disability savings plan (RDSP) income
    formula: "sum(T4A.box131)"
    source: "Box 131 of the T4A slip"
  T1.12599:
    label: Gross rental income
    formula: "if(answer.hasRentalIncome, answer.rentalGross, 0)"
    source: "Form T776, line 8299"
  T1.12600:
    label: Net rental income
    formula: "if(answer.hasRentalIncome, answer.rentalGross - answer.rentalExpenses, 0)"
    source: "Form T776, line 9369: rents less expenses. Capital cost allowance isn't claimed"
  T1.12700:
    label: Taxable capital gains
    formula: "max(0, line.S3.19900)"
    source: "Schedule 3. A net capital loss isn't entered here; it carries forward"
  T1.12799:
    label: Support payments received
    formula: "if(answer.hasSupportReceived, answer.supportReceived, 0)"
  T1.12800:
    label: Taxable support payments received
    formula: "if(answer.hasSupportReceived, max(0, answer.supportReceived - answer.childSupportReceived), 0)"
    source: "canada.ca/taxes-support-payments: spousal support is taxable; child support under an order or agreement made after April 1997 isn't"
  T1.12900:
    label: RRSP income
    formula: "sum(T4RSP.box16) + sum(T4RSP.box18) + sum(T4RSP.box20) + sum(T4RSP.box22) + sum(T4RSP.box26) + sum(T4RSP.box28) + sum(T4RSP.box34)"
    source: "T4RSP slips: every box of income. Home Buyers' Plan and Lifelong Learning Plan withdrawals (boxes 25 and 27) aren't income"
  T1.13000:
    label: Other income
    formula: "sum(T3.box26) + if(person.age < 65, sum(T4A.box024) + sum(T4RIF.box16), 0) + sum(T4A.box018) + sum(T4A.box028)"
    source: "Box 26 of T3 slips; annuities and RRIF payments before 65; lump-sum payments and other income on T4A slips"
  T1.13010:
    label: Taxable scholarships, fellowships, bursaries and artists' project grants
    formula: >-
      if(sum(T2202.box25) > 0, 0, if(sum(T2202.box24) > 0, max(0, sum(T4A.box105) - max(param.scholarshipExemption, sum(T2202.box26))),
      max(0, sum(T4A.box105) - param.scholarshipExemption)))
    source: "canada.ca/line-13010: not taxable for a full-time student; for a part-time student, taxable above the tuition paid; otherwise above $500"
  SE.net:
    label: Net self-employment income
    formula: "if(answer.hasSelfEmployment, answer.selfEmploymentGross - answer.selfEmploymentExpenses, 0)"
    source: "Form T2125, line 9369: gross income less expenses. Capital cost allowance isn't claimed"
  T1.13499:
    label: Gross business income
    formula: 'if(answer.hasSelfEmployment, if(answer.selfEmploymentKind == "business", answer.selfEmploymentGross, 0), 0)'
  T1.13500:
    label: Net business income
    formula: 'if(answer.hasSelfEmployment, if(answer.selfEmploymentKind == "business", line.SE.net, 0), 0)'
  T1.13699:
    label: Gross professional income
    formula: 'if(answer.hasSelfEmployment, if(answer.selfEmploymentKind == "professional", answer.selfEmploymentGross, 0), 0)'
  T1.13700:
    label: Net professional income
    formula: 'if(answer.hasSelfEmployment, if(answer.selfEmploymentKind == "professional", line.SE.net, 0), 0)'
  T1.13899:
    label: Gross commission income
    formula: 'if(answer.hasSelfEmployment, if(answer.selfEmploymentKind == "commission", answer.selfEmploymentGross, 0), 0)'
  T1.13900:
    label: Net commission income
    formula: 'if(answer.hasSelfEmployment, if(answer.selfEmploymentKind == "commission", line.SE.net, 0), 0)'
  T1.14400:
    label: Workers' compensation benefits
    formula: "sum(T5007.box10)"
  T1.14500:
    label: Social assistance payments
    formula: "sum(T5007.box11)"
  T1.14600:
    label: Net federal supplements paid
    formula: "sum(T4AOAS.box21)"
    source: "Box 21 of the T4A(OAS) slip: the guaranteed income supplement and allowances"
  T1.14700:
    label: Income that is deducted again on line 25000
    formula: "line.T1.14400 + line.T1.14500 + line.T1.14600"
  T1.15000:
    label: Total income
    formula: >-
      line.T1.10100 + line.T1.10400 + line.T1.11300 + line.T1.11400 + line.T1.11500 + line.T1.11900 + line.T1.12000
      + line.T1.12100 + line.T1.12500 + line.T1.12600 + line.T1.12700 + line.T1.12800 + line.T1.12900 + line.T1.13000
      + line.T1.13010 + line.T1.13500 + line.T1.13700 + line.T1.13900 + line.T1.14700 + line.SCOPE.income

  # Cases this app doesn't handle. Answering so makes the return say so.
  SCOPE.income:
    label: Income this app doesn't handle
    formula: >-
      if(answer.soldProperty, if(answer.propertyUse == "principal_residence_some_years",
      unsupported("A home that was your principal residence for only some of the years you owned it (Form T2091) isn't handled by this app yet"),
      if(answer.propertyUse == "flipped", unsupported("A home owned less than 12 months (a flipped property) is business income, which this app doesn't handle yet"), 0)), 0)

  # Step 3 – Net income
  T1.20700:
    label: Registered pension plan (RPP) deduction
    module: deductions
    formula: "sum(T4.box20)"
  T1.20800:
    label: RRSP deduction
    formula: "answer.rrspDeduction"
  T1.20805:
    label: FHSA deduction
    formula: "answer.fhsaDeduction"
  T1.21200:
    label: Annual union, professional, or like dues
    module: deductions
    formula: "sum(T4.box44)"
  # Form T778: the spouse or partner with the lower net income (without this deduction) claims it.
  CC.expenses:
    label: Child care expenses paid
    formula: "answer.childCareExpenses + sum(CHILDCARE.box1)"
    source: "Form T778, line 67950: receipts, and the amount entered that isn't on one"
  CC.limit:
    label: Basic limit for child care expenses
    formula: "param.childCareUnder7 * household.childrenUnder7 + param.childCare7to16 * (household.childrenUnder17 - household.childrenUnder7)"
    source: "Form T778, Part B, lines 1 to 4. Children with a disability ($11,000) aren't handled"
  CC.earned:
    label: Earned income
    formula: "line.T1.10100 + line.T1.10400 + max(0, line.SE.net)"
    source: "Form T778, line 6: employment income and net self-employment income"
  CC.netIncome:
    label: Net income without the child care deduction
    formula: "line.T1.15000 - line.DED.other"
  CC.spouseNetIncome:
    label: Your spouse's or partner's net income without it
    formula: "if(household.partnerInYear, spouse.line.CC.netIncome, answer.spouseNetIncome)"
  T1.21400:
    label: Child care expenses
    formula: >-
      if(answer.hasChildCare, if(line.HH.partner == 1 and line.CC.netIncome > line.CC.spouseNetIncome,
      unsupported("Only the spouse or partner with the lower net income claims child care expenses, except in the cases of Form T778, Part C. Enter them on the other return"),
      min(line.CC.expenses, line.CC.limit, round(line.CC.earned * 2 / 3, 2))), 0)
    source: "Form T778, Part B, line 7: whichever is least, the basic limit, the expenses, or 2/3 of earned income"
  T1.21500:
    label: Disability supports deduction
    formula: >-
      if(answer.hasDisabilitySupports, min(answer.disabilitySupportsExpenses,
      max(0, line.T1.10100 + line.T1.10400 + max(0, line.SE.net) + line.T1.13010)), 0)
    source: "Form T929: the expenses, up to earned income (employment, self-employment and taxable scholarships)"
  T1.21900:
    label: Moving expenses
    formula: "if(answer.hasMovingExpenses, min(answer.movingExpenses, answer.movingIncome), 0)"
    source: "Form T1-M, line 29: net moving expenses up to the net eligible income at the new location"
  T1.21999:
    label: Support payments made
    formula: "if(answer.hasSupportPaid, answer.supportPaid, 0)"
  T1.22000:
    label: Deductible support payments made
    formula: "if(answer.hasSupportPaid, max(0, answer.supportPaid - answer.childSupportPaid), 0)"
    source: "canada.ca/taxes-support-payments: spousal support is deductible; child support isn't"
  T1.22100:
    label: Carrying charges, interest expenses, and other expenses
    formula: "answer.carryingCharges"
    source: "Federal Worksheet, line 22100"
  T1.22200:
    label: Deduction for CPP contributions on self-employment income
    formula: >-
      if(line.CPP.employed > 0,
      round(line.CPP.base * 0.5, 2) + 2 * round(line.CPP.first * 0.5, 2) + 2 * round(line.CPP.second * 0.5, 2),
      round(line.CPP.base * 0.5, 2) + line.CPP.first + line.CPP.second)
    source: "Schedule 8, Part 4 line 17 or Part 5 line 88: half the base contributions, and the additional contributions"
  T1.22215:
    label: Deduction for CPP enhanced contributions on employment income
    module: deductions
    formula: "min(param.enhancedCppDeductionMax, round(sum(T4.box16) * (param.cppTotalRate - param.cppBaseRate) / param.cppTotalRate, 2) + sum(T4.box16A))"
    source: "Schedule 8 for employees: the first enhancement (1% of 5.95%) and all second CPP contributions are deducted"
  T1.22900:
    label: Other employment expenses
    formula: >-
      if(answer.hasWorkFromHome, min(round(answer.homeOfficeExpenses * answer.homeOfficeShare / 100, 2),
      max(0, line.T1.10100 + line.T1.10400 - line.T1.20700 - line.T1.21200)), 0)
    source: "Form T777, lines 48 to 54: home expenses times the employment-use share, up to employment income"
  T1.23200:
    label: Other deductions
    formula: "if(answer.hasForeignIncome, max(0, answer.foreignInvestmentTax - round(answer.foreignInvestmentIncome * param.foreignPropertyTaxRate, 2)), 0)"
    source: "Foreign tax on foreign interest and dividends above 15% of them (Income Tax Act 20(11))"
  DED.other:
    label: Deductions other than child care
    formula: >-
      line.T1.20700 + line.T1.20800 + line.T1.20805 + line.T1.21200 + line.T1.21500 + line.T1.21900 + line.T1.22000
      + line.T1.22100 + line.T1.22200 + line.T1.22215 + line.T1.22900 + line.T1.23200
  T1.23300:
    label: Total deductions
    formula: "line.DED.other + line.T1.21400"
  T1.23400:
    label: Net income before adjustments
    formula: "line.T1.15000 - line.T1.23300"
  T1.23500:
    label: Social benefits repayment
    formula: >-
      if(line.T1.11900 > 0 and sum(T4E.box15) > 0 and line.T1.23400 > param.eiRepaymentThreshold,
      unsupported("Repaying EI benefits (the chart on your T4E) isn't handled by this app yet"),
      min(max(0, line.T1.11300 + line.T1.14600 - sum(T4AOAS.box20)),
      round(max(0, line.T1.23400 - line.T1.12500 - param.oasRecoveryThreshold) * param.oasRecoveryRate, 2)))
    source: "Federal Worksheet, line 23500: 15% of net income (less RDSP income) over $93,454, up to the OAS and net federal supplements received"
  T1.23600:
    label: Net income
    formula: "max(0, line.T1.23400 - line.T1.23500)"

  # Schedule 8 – CPP contributions on self-employment income (Part 5; with no employment it gives Part 4). Twelve
  # months, and the employment contributions on the T4 slips are the ones required (Part 3, line 24 is zero).
  CPP.seEarnings:
    label: Pensionable net self-employment earnings
    formula: >-
      if(line.SE.net > 0, if(person.age <= 17 or person.age > 70, 0, if(person.age == 18 or person.age == 70,
      unsupported("CPP contributions for part of the year (the year you turned 18 or 70) aren't handled by this app yet"), line.SE.net)), 0)
    source: "Schedule 8, Part 5, line 4"
  CPP.employed:
    label: CPP pensionable earnings from employment
    formula: "if(sum(T4.box26) > 0, sum(T4.box26), sum(T4.box14))"
    source: "Schedule 8, Part 3, line 1: box 26 of T4 slips (box 14 if blank)"
  CPP.covered:
    label: Earnings already covered by employment contributions
    formula: "round(sum(T4.box16) * param.cppEarningsPerContribution, 2)"
    source: "Schedule 8, Part 5, line 20"
  CPP.exemptionLeft:
    label: Basic exemption not used by employment
    formula: "max(0, param.cppBasicExemption - line.CPP.employed)"
    source: "Schedule 8, Part 5, line 25"
  CPP.baseEarnings:
    label: Self-employment earnings subject to base and first additional contributions
    formula: >-
      max(0, min(line.CPP.seEarnings, max(0, param.cppMaxContributoryEarnings - line.CPP.covered))
      - max(0, line.CPP.exemptionLeft - max(0, line.CPP.seEarnings - param.cppMaxContributoryEarnings)))
    source: "Schedule 8, Part 5, lines 19 to 30"
  CPP.secondEarnings:
    label: Self-employment earnings subject to second additional contributions
    formula: >-
      if(line.CPP.seEarnings + min(param.cppAdditionalMaxPensionableEarnings, line.CPP.employed) > param.cppMaxPensionableEarnings,
      max(0, min(param.cpp2MaxEarnings - round(sum(T4.box16A) / param.cpp2EmployeeRate, 2),
      line.CPP.seEarnings - line.CPP.exemptionLeft - line.CPP.baseEarnings)), 0)
    source: "Schedule 8, Part 5, lines 31 to 42"
  CPP.base:
    label: Base CPP contributions on self-employment earnings
    formula: "round(line.CPP.baseEarnings * param.cppSelfEmployedBaseRate, 2)"
    source: "Schedule 8, Part 5, line 43: 9.9%"
  CPP.first:
    label: First additional CPP contributions on self-employment earnings
    formula: "round(line.CPP.baseEarnings * param.cppSelfEmployedFirstRate, 2)"
    source: "Schedule 8, Part 5, line 44: 2%"
  CPP.second:
    label: Second additional CPP contributions on self-employment earnings
    formula: "round(line.CPP.secondEarnings * param.cppSelfEmployedSecondRate, 2)"
    source: "Schedule 8, Part 5, line 45: 8%"

  # Step 4 – Taxable income
  T1.24400:
    label: Canadian Armed Forces personnel and police deduction
    formula: "sum(T4.box43)"
  T1.24900:
    label: Security options deductions
    formula: "sum(T4.box39) + sum(T4.box41)"
  T1.25000:
    label: Other payments deduction
    formula: >-
      if(line.T1.14600 > 0 and max(0, line.T1.23400) - line.T1.12500 > param.oasRecoveryThreshold,
      unsupported("Net federal supplements with net income over $93,454 (line 25000) aren't handled by this app yet"), line.T1.14700)
    source: "Federal Worksheet, line 25000: the amount on line 14700"
  T1.25200:
    label: Non-capital losses of other years
    formula: "answer.nonCapitalLosses"
  T1.25300:
    label: Net capital losses of other years
    formula: "min(answer.netCapitalLosses, line.T1.12700)"
    source: "canada.ca/line-25300: up to the taxable capital gains of the year"
  T1.25700:
    label: Deductions from net income
    formula: "line.T1.24400 + line.T1.24900 + line.T1.25000 + line.T1.25200 + line.T1.25300"
  T1.26000:
    label: Taxable income
    formula: "max(0, line.T1.23600 - line.T1.25700)"

  # Step 5 Part B – Federal non-refundable tax credits
  T1.30000:
    label: Basic personal amount
    formula: >-
      round(param.basicPersonalAmountMax
        - (param.basicPersonalAmountMax - param.basicPersonalAmountMin)
        * clamp(line.T1.23600 - param.basicPersonalAmountPhaseStart, 0, param.basicPersonalAmountPhaseEnd - param.basicPersonalAmountPhaseStart)
        / (param.basicPersonalAmountPhaseEnd - param.basicPersonalAmountPhaseStart), 2)
    source: "Federal Worksheet, line 30000: the full amount up to the 26% bracket, going down to the minimum at the 33% bracket"
  T1.30100:
    label: Age amount
    formula: "if(person.age >= 65, max(0, param.ageAmountMax - round(max(0, line.T1.23600 - param.ageAmountThreshold) * param.ageAmountRate, 2)), 0)"
    source: "Federal Worksheet, line 30100: for people born in 1960 or earlier"
  T1.30300:
    label: Spouse or common-law partner amount
    formula: "if(line.HH.partner == 1, max(0, line.T1.30000 + if(answer.spouseInfirm, param.caregiverChildAmount, 0) - line.HH.spouseNetIncome), 0)"
    source: "Schedule 5 line 30300: your basic personal amount (plus $2,687 for a spouse with an infirmity) minus their net income"
  T1.30400:
    label: Amount for an eligible dependant
    formula: "if(line.HH.partner == 0 and household.childrenUnder18 > 0, line.T1.30000, 0)"
    source: "Schedule 5 line 30400: for a single parent, one child under 18 who lived with you. The app assumes the child had no income"
  T1.30425:
    label: Canada caregiver amount for spouse or common-law partner
    formula: "if(line.HH.partner == 1 and answer.spouseInfirm, max(0, min(param.caregiverMax, max(0, param.caregiverBase - line.HH.spouseNetIncome)) - line.T1.30300), 0)"
    source: "Schedule 5 line 30425: $28,798 less their net income (up to $8,601), less the spouse amount"
  T1.30450:
    label: Canada caregiver amount for other infirm dependants age 18 or older
    formula: >-
      if(answer.hasInfirmDependant, if(answer.infirmDependants > 1,
      unsupported("The Canada caregiver amount for more than one adult dependant isn't handled by this app yet"),
      if(answer.infirmDependants == 0, 0, min(param.caregiverMax, max(0, param.caregiverBase - answer.infirmDependantIncome)))), 0)
    source: "Schedule 5 line 30450: $28,798 less the dependant's net income, up to $8,601"
  T1.30500:
    label: Canada caregiver amount for infirm children under 18 years of age
    formula: "if(answer.hasInfirmChildren, answer.infirmChildren * param.caregiverChildAmount, 0)"
    source: "T1 lines 30499 and 30500: $2,687 for each child"
  T1.T84:
    label: Credit amounts for you and your dependants (T1 line 84)
    formula: "line.T1.30000 + line.T1.30100 + line.T1.30300 + line.T1.30400 + line.T1.30425 + line.T1.30450 + line.T1.30500"
  T1.30800:
    label: Base CPP contributions through employment
    module: credits
    formula: "min(param.cppBaseMax, round(sum(T4.box16) * param.cppBaseRate / param.cppTotalRate, 2))"
    source: "Schedule 8 for employees: the base part (4.95% of 5.95%) is a credit"
  T1.31000:
    label: CPP contributions on self-employment income
    formula: "round(line.CPP.base * 0.5, 2)"
    source: "Schedule 8, Part 5, line 70: half the base contributions"
  T1.31200:
    label: Employment insurance premiums through employment
    module: credits
    formula: "min(param.eiPremiumMax, sum(T4.box18))"
  T1.31260:
    label: Canada employment amount
    module: credits
    formula: "min(param.canadaEmploymentAmount, line.T1.10100 + line.T1.10400)"
  T1.31220:
    label: Volunteer firefighters' amount
    formula: 'if(answer.hasVolunteerService, if(answer.volunteerKind == "firefighter", param.volunteerAmount, 0), 0)'
  T1.31240:
    label: Search and rescue volunteers' amount
    formula: 'if(answer.hasVolunteerService, if(answer.volunteerKind == "search_rescue", param.volunteerAmount, 0), 0)'
    source: "T1 lines 31220 and 31240: one or the other"
  T1.31270:
    label: Home buyers' amount
    formula: >-
      if(household.partnerInYear and line.HH.partner == 1 and answer.homeBuyers + spouse.answer.homeBuyers > param.homeBuyersMax,
      unsupported("You and your spouse or partner can claim at most $10,000 together for the home buyers' amount. Lower one of the claims"),
      min(answer.homeBuyers, param.homeBuyersMax))
  T1.31285:
    label: Home accessibility expenses
    formula: "min(answer.homeAccessibility, param.homeAccessibilityMax)"
  T1.31300:
    label: Adoption expenses
    formula: >-
      if(answer.hasAdoption, if(answer.adoptedChildren > 1 and answer.adoptionExpenses > param.adoptionMax,
      unsupported("Adoption expenses over $19,580 for more than one child are claimed child by child, which this app doesn't handle yet"),
      min(answer.adoptionExpenses, param.adoptionMax)), 0)
    source: "canada.ca/line-31300: up to $19,580 for each child"
  T1.T96:
    label: CPP, EI, volunteer, employment, home and adoption amounts (T1 line 96)
    formula: >-
      line.T1.30800 + line.T1.31000 + line.T1.31200 + line.T1.31220 + line.T1.31240 + line.T1.31260 + line.T1.31270
      + line.T1.31285 + line.T1.31300
  T1.31400:
    label: Pension income amount
    formula: "min(param.pensionIncomeAmountMax, line.T1.11500)"
    source: "Federal Worksheet, line 31400: eligible pension income on line 11500, up to $2,000"
  T1.31600:
    label: Disability amount for self
    formula: "if(answer.hasDisability, param.disabilityAmount, 0)"
    source: "T1 line 31600: $10,138 at 18 or older, with an approved Form T2201"
  T1.31800:
    label: Disability amount transferred from a dependant
    formula: >-
      if(answer.hasDisabledDependant, if(answer.disabledChildren > 1 and answer.disabledChildCare > 0,
      unsupported("Child care for more than one child with a disability is worked out child by child, which this app doesn't handle yet"),
      answer.disabledChildren * (param.disabilityAmount + param.disabilitySupplementMax)
      - min(answer.disabledChildren * param.disabilitySupplementMax, max(0, answer.disabledChildCare - param.disabilityCareThreshold))
      + answer.disabledAdults * param.disabilityAmount), 0)
    source: "Federal Worksheet, line 31800: $10,138, plus up to $5,914 for a child under 18, less care over $3,464. The app assumes the dependant had no income"
  T1.T101:
    label: Credit amounts before tuition (T1 line 101)
    formula: "line.T1.T84 + line.T1.T96 + line.T1.31400 + line.T1.31600 + line.T1.31800"
  T1.31900:
    label: Interest paid on your student loans
    formula: "answer.studentLoanInterest"
  T1.32300:
    label: Federal tuition amount
    formula: "line.S11.17"
  T1.32400:
    label: Tuition amount transferred from a child or grandchild
    formula: "answer.childTuitionTransfer"
  T1.32600:
    label: Amounts transferred from your spouse or common-law partner
    formula: "if(line.HH.partner == 1 and household.partnerInYear, line.S2.13, 0)"
    source: "Schedule 2: their unused age amount and the tuition they designate to you"
  T1.33099:
    label: Medical expenses for you, your spouse and your children
    formula: "if(household.partnerInYear and spouse.answer.claimSpouseMedical and line.HH.partner == 1, 0, line.OWN.medical) + if(household.partnerInYear and answer.claimSpouseMedical and line.HH.partner == 1, spouse.line.OWN.medical, 0)"
    source: "Either spouse can claim the family's medical expenses: this return's own, unless the spouse claims them, and the spouse's when this return claims them"
  OWN.medical:
    label: Medical expenses on this return's receipts and entered here
    formula: "answer.medicalExpenses + sum(MEDICAL.box1)"
    source: "Medical expense receipts, and the amount entered that isn't on one"
  T1.33199:
    label: Allowable amount of medical expenses for other dependants
    formula: >-
      if(answer.hasOtherDependantMedical, max(0, answer.otherDependantMedical
      - min(param.medicalThresholdMax, round(answer.otherDependantIncome * param.medicalThresholdRate, 2))), 0)
    source: "Federal Worksheet, line 33199: their expenses over whichever is less, $2,834 or 3% of their net income"
  T1.33200:
    label: Allowable medical expenses
    formula: "max(0, line.T1.33099 - min(param.medicalThresholdMax, round(line.T1.23600 * param.medicalThresholdRate, 2))) + line.T1.33199"
    source: "T1 lines 107 to 112: expenses over whichever is less, $2,834 or 3% of net income, and those for other dependants"
  T1.33500:
    label: Federal non-refundable credit amounts
    formula: "line.T1.T101 + line.T1.31900 + line.T1.32300 + line.T1.32400 + line.T1.32600 + line.T1.33200"
  T1.33800:
    label: Credit amounts at the credit rate
    formula: "round(line.T1.33500 * param.creditRate, 2)"
  T1.34900:
    label: Donations and gifts
    formula: "line.S9.23"
  T1.34990:
    label: Top-up tax credit
    formula: "round(max(0, line.T1.33800 + line.S9.22 - param.topUpThreshold) * param.topUpRate, 2)"
    source: "Federal Worksheet, line 34990: keeps credit amounts above the first bracket at 15%"
  T1.35000:
    label: Total federal non-refundable tax credits
    formula: "line.T1.33800 + line.T1.34900 + line.T1.34990"

  # Step 5 Part C – Net federal tax
  T1.40400:
    label: Federal tax on taxable income
    formula: "round(bracket(param.taxBrackets, line.T1.26000), 2)"
  T1.40425:
    label: Federal dividend tax credit
    formula: "sum(T5.box12) + sum(T5.box26) + sum(T3.box39) + sum(T3.box51)"
    source: "Federal Worksheet, line 40425: the credit as shown on the slips"
  T1.42900:
    label: Basic federal tax
    formula: "max(0, line.T1.40400 - line.T1.35000 - line.T1.40425)"
  # Form T2209 – federal foreign tax credit on non-business income
  FTC.netForeign:
    label: Net foreign non-business income
    formula: "if(answer.hasForeignIncome, answer.foreignInvestmentIncome + answer.foreignEmploymentIncome - line.T1.23200, 0)"
    source: "Form T2209, note 2: the foreign income less the foreign tax deducted under 20(11) (line 23200)"
  FTC.eligibleTax:
    label: Non-business income tax paid to a foreign country
    formula: >-
      if(answer.hasForeignIncome, min(answer.foreignInvestmentTax, round(answer.foreignInvestmentIncome * param.foreignPropertyTaxRate, 2))
      + answer.foreignEmploymentTax, 0)
    source: "Form T2209, line 1: foreign tax on interest and dividends counts up to 15% of them"
  FTC.basicFederalTax:
    label: Basic federal tax, for the foreign tax credit
    formula: "line.T1.42900 + line.T1.40425"
    source: "Form T2209, note 4: line 42900 plus the federal dividend tax credit"
  T1.40500:
    label: Federal foreign tax credit
    formula: >-
      if(line.FTC.eligibleTax > 0 and line.T1.23600 > 0, min(line.FTC.eligibleTax,
      round(min(line.FTC.netForeign, line.T1.23600) * line.FTC.basicFederalTax / line.T1.23600, 2), line.T1.42900), 0)
    source: "Form T2209, line 3: the foreign tax, up to the share of basic federal tax on the foreign income"
  FTC.left:
    label: Foreign tax left for the provincial credit
    formula: "line.FTC.eligibleTax - line.T1.40500"
    source: "Form T2036, line 3"
  T1.40600:
    label: Federal tax
    formula: "line.T1.42900 - line.T1.40500"
  T1.40900:
    label: Total federal political contributions
    formula: "answer.politicalContributions"
  T1.41000:
    label: Federal political contribution tax credit
    formula: "if(line.T1.40900 >= param.politicalCreditMaxContributions, param.politicalCreditMax, round(bracket(param.politicalCreditRates, line.T1.40900), 2))"
    source: "Federal Worksheet, line 41000"
  T1.41600:
    label: Federal political contribution, investment and labour-sponsored funds credits
    formula: "line.T1.41000"
  T1.41700:
    label: Federal tax after those credits
    formula: "max(0, line.T1.40600 - line.T1.41600)"
  T1.42000:
    label: Net federal tax
    formula: "line.T1.41700 + line.T1.41500"

  # Step 6 – Refund or balance owing
  T1.42800:
    label: Provincial tax
    formula: 'if(person.province == "ON", line.ON428.90, if(person.province == "BC", line.BC428.91, if(person.province == "AB", line.AB428.75, unsupported("Provincial tax for this province isn''t handled by this app"))))'
  T1.42100:
    label: CPP contributions payable on self-employment income
    formula: "line.CPP.base + line.CPP.first + line.CPP.second"
    source: "Schedule 8, Part 5, line 49"
  T1.42200:
    label: Social benefits repayment
    formula: "line.T1.23500"
  T1.43500:
    label: Total payable
    formula: "line.T1.42000 + line.T1.42100 + line.T1.42200 + line.T1.42800"
  T1.43700:
    label: Total income tax deducted
    formula: "sum(T4.box22) + sum(T4A.box022) + sum(T4AP.box22) + sum(T4AOAS.box22) + sum(T4E.box22) + sum(T4RIF.box28)"
    source: "The income tax deducted on all slips"
  T1.44800:
    label: CPP overpayment
    formula: 'if(sum(T4.box16) > param.cppEmployeeMax or sum(T4.box16A) > param.cpp2EmployeeMax, unsupported("More CPP was deducted than the 2025 maximum. The overpayment (Schedule 8) isn''t handled by this app yet"), 0)'
  T1.45000:
    label: Employment insurance overpayment
    formula: 'if(sum(T4.box18) > param.eiPremiumMax, unsupported("More EI was deducted than the 2025 maximum. The overpayment isn''t handled by this app yet"), 0)'
  # Federal Worksheet, line 45200 – the refundable medical expense supplement
  MED.earned:
    label: Earnings for the refundable medical expense supplement
    formula: "max(0, line.T1.10100 + line.T1.10400 - line.T1.20700 - line.T1.21200 - line.T1.22900) + max(0, line.SE.net)"
    source: "Federal Worksheet, line 45200: employment income less lines 20700, 21200 and 22900, and net self-employment income"
  MED.familyIncome:
    label: Adjusted family net income for the refundable medical expense supplement
    formula: >-
      max(0, line.T1.23600 - line.T1.12500) + if(line.HH.partner == 1,
      if(household.partnerInYear, max(0, spouse.line.T1.23600 - spouse.line.T1.12500), line.HH.spouseNetIncome), 0)
    source: "Federal Worksheet, line 45200, lines 1 to 6"
  T1.45200:
    label: Refundable medical expense supplement
    formula: >-
      if(person.age >= 18 and line.MED.earned >= param.medicalSupplementMinEarnings,
      max(0, min(round((line.T1.21500 + line.T1.33200) * param.medicalSupplementRate, 2), param.medicalSupplementMax)
      - round(max(0, line.MED.familyIncome - param.medicalSupplementThreshold) * param.medicalSupplementReductionRate, 2)), 0)
    source: "Federal Worksheet, line 45200: 25% of lines 21500 and 33200, up to $1,504, less 5% of family net income over $33,294"

  # Schedule 6 – Canada workers benefit. A couple's basic benefit is claimed once: on the return of the spouse with the
  # higher working income (the person preparing when equal); each spouse claims their own disability supplement.
  CWB.working:
    label: Working income
    formula: "line.T1.10100 + line.T1.10400 + line.T1.13010 + max(0, line.SE.net)"
    source: "Schedule 6, Part A, lines 1 to 5"
  CWB.netIncome:
    label: Net income for the Canada workers benefit
    formula: "max(0, line.T1.23600 - line.T1.12500)"
    source: "Schedule 6, Part B, lines 7 to 12"
  CWB.dependant:
    label: An eligible dependant (1 for yes)
    formula: "if(household.childrenUnder19 > 0, 1, 0)"
    source: "Schedule 6: a child under 19 who lived with you on December 31"
  CWB.student:
    label: A full-time student for more than 13 weeks without an eligible dependant (1 for yes)
    formula: "if(sum(T2202.box25) > param.cwbStudentMonths and line.CWB.dependant == 0, 1, 0)"
  CWB.spouse:
    label: An eligible spouse (1 for yes)
    formula: "if(line.HH.partner == 1, if(household.partnerInYear, if(spouse.line.CWB.student == 1, 0, 1), 1), 0)"
  CWB.eligible:
    label: Eligible for the Canada workers benefit (1 for yes)
    formula: "if(line.CWB.student == 0 and (person.age >= 19 or line.CWB.spouse == 1 or line.CWB.dependant == 1), 1, 0)"
    source: "Schedule 6: 19 or older (or with a spouse or a child) and not a full-time student for more than 13 weeks"
  CWB.familyWorking:
    label: Family working income
    formula: "line.CWB.working + if(line.CWB.spouse == 1 and household.partnerInYear, spouse.line.CWB.working, 0)"
    source: "Schedule 6, line 6"
  CWB.familyIncome:
    label: Adjusted family net income
    formula: >-
      if(line.CWB.spouse == 1, if(household.partnerInYear, line.CWB.netIncome + spouse.line.CWB.netIncome
      - min(param.cwbSecondaryEarnerMax, if(line.CWB.working < spouse.line.CWB.working, min(line.CWB.working, line.CWB.netIncome),
      min(spouse.line.CWB.working, spouse.line.CWB.netIncome))),
      if(line.CWB.netIncome + line.HH.spouseNetIncome - min(param.cwbSecondaryEarnerMax, line.CWB.netIncome, line.HH.spouseNetIncome) < param.cwbFamilyLimit and line.CWB.working > 0,
      unsupported("The Canada workers benefit for a couple needs your spouse's or partner's working income: prepare their return here too"), param.cwbFamilyLimit)),
      line.CWB.netIncome)
    source: "Schedule 6, lines 13 to 15: with the secondary earner exemption (up to $16,386). With a spouse whose return isn't prepared here, a family that might get the benefit is asked to prepare it; one that can't is put at the limit"
  CWB.claimsBasic:
    label: This return claims the couple's basic benefit (1 for yes)
    formula: >-
      if(line.CWB.eligible == 0, 0, if(line.CWB.spouse == 0 or not household.partnerInYear, 1,
      if(spouse.line.CWB.eligible == 0 or line.CWB.working > spouse.line.CWB.working
      or (line.CWB.working == spouse.line.CWB.working and person.role == "self"), 1, 0)))
  CWB.basic:
    label: Basic Canada workers benefit
    formula: >-
      if(line.CWB.claimsBasic == 1, max(0, min(round(max(0, line.CWB.familyWorking - param.cwbWorkingIncomeBase) * param.cwbRate, 2),
      if(line.CWB.spouse == 1 or line.CWB.dependant == 1, param.cwbMaxFamily, param.cwbMaxSingle))
      - round(max(0, line.CWB.familyIncome - if(line.CWB.spouse == 1 or line.CWB.dependant == 1, param.cwbIncomeBaseFamily, param.cwbIncomeBaseSingle))
      * param.cwbReductionRate, 2)), 0)
    source: "Schedule 6, Step 2: 27% of family working income over $3,000, up to the maximum, less 15% of adjusted family net income over the base"
  CWB.disability:
    label: Canada workers benefit disability supplement
    formula: >-
      if(line.CWB.eligible == 1 and answer.hasDisability, max(0, min(round(max(0, line.CWB.working - param.cwbDisabilityWorkingBase) * param.cwbRate, 2),
      param.cwbDisabilityMax) - round(max(0, line.CWB.familyIncome - if(line.CWB.spouse == 1 or line.CWB.dependant == 1,
      param.cwbDisabilityIncomeBaseFamily, param.cwbDisabilityIncomeBaseSingle))
      * if(line.CWB.spouse == 1 and household.partnerInYear and spouse.answer.hasDisability, param.cwbReductionRateBothDisabled, param.cwbReductionRate), 2)), 0)
    source: "Schedule 6, Step 3: 27% of working income over $1,150, up to $843, less 15% (7.5% when both spouses have the disability tax credit) of adjusted family net income over the base"
  T1.45300:
    label: Canada workers benefit
    formula: "line.CWB.basic + line.CWB.disability"
    source: "Schedule 6, line 42"
  T1.41500:
    label: Advanced Canada workers benefit
    formula: >-
      min(max(line.CWB.basic, line.T1.45300), if(line.CWB.claimsBasic == 1, sum(RC210.box10)
      + if(household.partnerInYear and line.HH.partner == 1, sum(spouse.RC210.box10), 0), 0) + sum(RC210.box11))
    source: "Schedule 6, Step 4: the advance payments (RC210 box 10 of both spouses, on the return claiming the basic benefit, and box 11), up to the benefit"

  # Schedule 11 – the Canada training credit: half the tuition, up to the limit on the notice of assessment.
  T1.45350:
    label: Canada training credit
    formula: "min(round(sum(T2202.box26) * param.trainingCreditRate, 2), answer.trainingCreditLimit)"
    source: "Schedule 11, lines 1 to 5"
  T1.45355:
    label: Multigenerational home renovation tax credit
    formula: "round(min(answer.multigenerationalRenovation, param.renovationMax) * param.renovationRate, 2)"
    source: "Schedule 12: 14.5% of qualifying expenditures, up to $50,000"
  T1.45600:
    label: Part XII.2 tax credit
    formula: "sum(T3.box38)"
  T1.46800:
    label: Eligible school supplies expenses
    formula: "min(answer.teacherSupplies, param.educatorMax)"
  T1.46900:
    label: Eligible educator school supply tax credit
    formula: "round(line.T1.46800 * param.educatorRate, 2)"
  T1.47600:
    label: Tax paid by instalments
    formula: "answer.instalmentsPaid"
  T1.48200:
    label: Total credits
    formula: >-
      line.T1.43700 + line.T1.44800 + line.T1.45000 + line.T1.45200 + line.T1.45300 + line.T1.45350 + line.T1.45355
      + line.T1.45600 + line.T1.46900 + line.T1.47600
  T1.48400:
    label: Refund
    formula: "max(0, line.T1.48200 - line.T1.43500)"
  T1.48500:
    label: Balance owing
    formula: "max(0, line.T1.43500 - line.T1.48200)"

  # Schedule 2 – Federal amounts transferred from your spouse or common-law partner (read from their return)
  S2.6:
    label: Their age amount, pension income amount, and the tuition they designate to you
    formula: "spouse.line.T1.30100 + spouse.line.T1.30500 + spouse.line.T1.31400 + spouse.line.T1.31600 + spouse.line.S11.24"
    source: "Schedule 2 lines 1 to 5"
  S2.7:
    label: Their taxable income, for the transfer
    formula: "if(spouse.line.T1.26000 <= param.tuitionIncomeThreshold, spouse.line.T1.26000, round(spouse.line.T1.40400 / param.creditRate, 2))"
    source: "Schedule 2 line 7"
  S2.11:
    label: Their basic personal amount, CPP, EI and employment amounts, and tuition
    formula: "spouse.line.T1.30000 + spouse.line.T1.T96 + spouse.line.T1.32300"
    source: "Schedule 2 lines 8 to 11: their lines 30000, 96 and 32300"
  S2.12:
    label: Their adjusted taxable income
    formula: "max(0, line.S2.7 - line.S2.11)"
  S2.13:
    label: Federal amounts transferred from your spouse or common-law partner
    formula: "max(0, line.S2.6 - line.S2.12)"

  # Schedule 3 – Capital gains or losses
  S3.13200:
    label: Gain or loss on publicly traded shares and mutual fund units
    formula: "sum(T5008.box20) - sum(T5008.box21)"
    source: "Schedule 3 line 4: proceeds (T5008 box 20) minus cost (box 21)"
  S3.17400:
    label: Capital gains from T5 slips
    formula: "sum(T5.box18)"
  S3.17600:
    label: Capital gains from T3 slips
    formula: "sum(T3.box21)"
  S3.13599:
    label: Real estate sold, proceeds
    formula: 'if(answer.soldProperty, if(answer.propertyUse == "rental_or_investment", answer.propertyProceeds, 0), 0)'
  S3.13800:
    label: Gain or loss on real estate
    formula: 'if(answer.soldProperty, if(answer.propertyUse == "rental_or_investment", answer.propertyProceeds - answer.propertyCost - answer.propertyOutlays, 0), 0)'
    source: "Schedule 3 line 5: proceeds less the adjusted cost base and selling costs. A home that was your principal residence every year has no gain (Form T2091)"
  S3.15800:
    label: Gain on personal-use property
    formula: 'if(answer.soldProperty, if(answer.propertyUse == "personal_use", max(0, answer.propertyProceeds - answer.propertyCost - answer.propertyOutlays), 0), 0)'
    source: "Schedule 3 line 8: a cottage or other property for your own use. A loss on it isn't allowed"
  S3.19700:
    label: Total capital gains or losses
    formula: "line.S3.13200 + line.S3.13800 + line.S3.15800 + line.S3.17400 + line.S3.17600"
  S3.19900:
    label: Taxable capital gains or net capital loss
    formula: "round(line.S3.19700 * param.capitalGainsInclusionRate, 2)"

  # Schedule 9 – Donations and gifts
  S9.5:
    label: Total eligible amount of charitable donations
    formula: "if(household.partnerInYear and spouse.answer.claimSpouseDonations and line.HH.partner == 1, 0, line.OWN.donations) + if(household.partnerInYear and answer.claimSpouseDonations and line.HH.partner == 1, spouse.line.OWN.donations, 0)"
    source: "Schedule 9 line 5: either spouse can claim both spouses' donations"
  OWN.donations:
    label: Donations on this return's receipts and entered here
    formula: "answer.donations + sum(DONATION.box1) + sum(T4.box46)"
    source: "Official receipts (uploaded, or entered), and box 46 of T4 slips"
  S9.10:
    label: Donations claimed (within the limit)
    formula: "min(line.S9.5, round(line.T1.23600 * param.donationIncomeLimit, 2))"
    source: "Schedule 9 lines 6 to 10: up to 75% of net income"
  S9.13:
    label: Donations at the low rate
    formula: "min(line.S9.10, param.donationLowLimit)"
  S9.14:
    label: Donations above the first $200
    formula: "line.S9.10 - line.S9.13"
  S9.19:
    label: Taxable income in the top bracket
    formula: "max(0, line.T1.26000 - param.donationTopThreshold)"
  S9.F:
    label: Donations at the top rate
    formula: "min(line.S9.14, line.S9.19)"
  S9.20:
    label: Credit at the top rate
    formula: "round(line.S9.F * param.donationTopRate, 2)"
  S9.21:
    label: Credit at the high rate
    formula: "round((line.S9.14 - line.S9.F) * param.donationHighRate, 2)"
  S9.22:
    label: Credit on the first $200
    formula: "round(line.S9.13 * param.donationLowRate, 2)"
  S9.23:
    label: Allowable donations credit
    formula: "line.S9.20 + line.S9.21 + line.S9.22"

  # Schedule 11 – Federal tuition amount (the student's own; transfers come with couples)
  S11.8:
    label: Tuition fees for 2025
    formula: "sum(T2202.box26) - line.T1.45350"
    source: "Schedule 11 lines 1 to 8: eligible fees from T2202 box 26, less the Canada training credit claimed"
  S11.9:
    label: Unused federal tuition from your 2024 notice of assessment
    formula: "answer.unusedTuition"
  S11.11:
    label: Income the tuition amount can reduce to zero tax
    formula: "if(line.T1.26000 <= param.tuitionIncomeThreshold, line.T1.26000, round(line.T1.40400 / param.creditRate, 2))"
    source: "Schedule 11 line 11: taxable income, or above $57,375, federal tax on taxable income ÷ 14.5%"
  S11.13:
    label: Room left after other credits
    formula: "max(0, line.S11.11 - line.T1.T101)"
  S11.14:
    label: Unused tuition claimed for 2025
    formula: "min(line.S11.9, line.S11.13)"
  S11.16:
    label: 2025 tuition claimed
    formula: "min(line.S11.8, line.S11.13 - line.S11.14)"
  S11.17:
    label: Federal tuition amount
    formula: "line.S11.14 + line.S11.16"
  S11.23:
    label: Tuition you can transfer
    formula: "max(0, min(param.tuitionTransferMax, line.S11.8) - line.S11.16)"
    source: "Schedule 11 lines 21 to 23: this year's tuition up to $5,000, less what you used"
  S11.24:
    label: Tuition transferred to your spouse or common-law partner
    formula: "if(line.HH.partner == 1 and household.partnerInYear and line.S11.8 > 0, min(answer.tuitionTransfer, line.S11.23), 0)"
    source: "Schedule 11 line 24: the amount you designate on your T2202, up to line 23"

  # The household's outcome, which hints compare with and without their change.
  RESULT.net:
    label: Refund, less balance owing
    formula: "line.T1.48400 - line.T1.48500"

  # Starting amounts worked out from receipts and last year's notice of assessment, for the person to check: not lines
  # of the return. The RRSP deduction is the contributions (with unused ones from earlier years) up to the limit.
  SUGGEST.rrspDeduction:
    label: RRSP contributions you can deduct for 2025
    formula: "if(sum(NOA.box1) > 0, min(sum(RRSP.box1) + sum(RRSP.box2) + sum(NOA.box2), sum(NOA.box1)), sum(RRSP.box1) + sum(RRSP.box2) + sum(NOA.box2))"
    source: "RRSP receipts, and the unused contributions and deduction limit on your 2024 notice of assessment"
  SUGGEST.trainingCreditLimit:
    label: Canada training credit limit
    formula: "sum(NOA.box4)"
    source: "Your 2024 notice of assessment"
  SUGGEST.unusedTuition:
    label: Unused federal tuition carried forward
    formula: "sum(NOA.box3)"
    source: "Your 2024 notice of assessment"
