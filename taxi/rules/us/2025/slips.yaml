# Information returns: what each one is, for the screens, and its boxes as printed (a box with a letter in capitals: 1a
# is 1A). `informational` boxes never change a return; `codes` boxes hold a code from a list, not an amount. Any other
# box no formula reads is kept and, unless it holds 0, shown as not handled by this app (on the W-2: allocated tips in
# box 8; on the 1099-INT: an early withdrawal penalty, market discount and bond premium). The other forms are with the
# rules that read them: 1099-NEC (self-employment.yaml), 1098-T and 1098-E (education.yaml), 1099-DIV and 1099-B
# (investments.yaml), 1099-R and SSA-1099 (retirement.yaml), and 1098 (itemized.yaml).

slips:
  W2:
    title: Form W-2 Wage and Tax Statement
    name: W-2
    about: Wages an employer paid, and the federal income, social security and Medicare tax it withheld
    boxes:
      1: Wages, tips, other compensation
      2: Federal income tax withheld
      3: Social security wages
      4: Social security tax withheld
      5: Medicare wages and tips
      6: Medicare tax withheld
      7: Social security tips
      8: Allocated tips
      10: Dependent care benefits
      11: Nonqualified plans
      12W: "Box 12, code W: employer contributions to your health savings account"
      15: State
      16: State wages, tips, etc.
      17: State income tax
      18: Local wages, tips, etc.
      19: Local income tax
      20: Locality name
    # Box 15 holds the state's two-letter code (the employer's state ID number after it isn't read); box 20 the locality
    # when it is New York City or Yonkers, the two whose tax this app works out (new-york.yaml).
    codes:
      20: [NYC, YONKERS]
      15: &states [AL, AK, AZ, AR, CA, CO, CT, DE, DC, FL, GA, HI, ID, IL, IN, IA, KS, KY, LA, ME, MD, MA, MI, MN, MS, MO, MT, NE, NV, NH, NJ, NM, NY, NC, ND, OH, OK, OR, PA, RI, SC, SD, TN, TX, UT, VT, VA, WA, WV, WI, WY]
    # Box 3 caps box 4, which is read; box 11 is already in box 1. Box 7, the tips reported to the employer (already in
    # box 1), starts the qualified tips (schedule1a.yaml); box 17, the state income tax withheld, is a tax itemized on
    # Schedule A (itemized.yaml) and, with box 15, California's or New York's withholding; box 16 with box 15 is
    # California earned income (california.yaml); box 19 with box 20 is New York City's or Yonkers' withholding, box 18
    # only says which wages it was withheld from (new-york.yaml); box 12 code W limits the HSA deduction
    # (adjustments.yaml).
    informational: [3, 11, 18]

  INT:
    title: Form 1099-INT Interest Income
    name: 1099-INT
    about: Interest a bank, credit union, broker or the U.S. Treasury paid, and any federal income tax withheld
    boxes:
      1: Interest income
      2: Early withdrawal penalty
      3: Interest on U.S. Savings Bonds and Treasury obligations
      4: Federal income tax withheld
      6: Foreign tax paid
      8: Tax-exempt interest
      9: Specified private activity bond interest
      10: Market discount
      11: Bond premium
      15: State
      17: State tax withheld
    # Box 15 is the state's code; box 17, with it, is California's withholding (california.yaml).
    codes:
      15: *states
