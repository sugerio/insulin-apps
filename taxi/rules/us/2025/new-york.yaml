# The New York State resident return for 2025: Form IT-201, with Form IT-196 (New York itemized deductions) and the
# credit forms IT-213 (Empire State child credit), IT-215 (earned income credits), IT-216 (child and dependent care),
# IT-270 (New York City income tax elimination credit) and IT-272 (college tuition credit), for a person whose state on
# December 31 is New York (person.province "NY") and who lived there all year; the New York City resident tax and its
# credits, the Yonkers resident surcharge and the MCTMT are on the same return. Each number names its source:
# "Instructions" is the 2025 Instructions for Form IT-201 (IT-201-I), "IT-196-I", "IT-213-I", "IT-215-I", "IT-216-I",
# "IT-270-I" and "IT-272" the 2025 instructions or form named, and "Tax Table" the 2025 New York State and New York City
# Tax Tables (tax.ny.gov, search: table); check it there before changing it.
#
# The return starts from the federal one: lines 1 to 19 are the federal amounts (federal AGI is line 19), changed by
# New York's additions and subtractions to New York AGI (line 33), then New York's deductions, tax, credits and
# payments. Form IT-201 is in whole dollars, so each amount carried from the federal return is rounded to the dollar. A
# joint return is one Form IT-201, the person preparing's, like the federal one. What New York needs that this app
# doesn't work out is said on the New York return only (NYSCOPE.return): the federal return stays complete.

