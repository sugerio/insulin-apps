      "117.9": { value: "max(0, line.TP1.98_1 + line.QCU.33 - param.qppMaxPensionable)", when: "line.QCU.33 > 0" }
      "118": { value: param.qppAdditionalMaxPensionable, when: "line.QCU.33 > 0" }
