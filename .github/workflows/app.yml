name: App pipeline

# An app's checks, which its own workflow (<app>.yml) runs on pull requests and pushes to main. Nothing deploys here:
# once every workflow a push started has passed, release.yml tags it as a release and deploy-release.yml deploys it.
# An app with an engine (`insulin.engine`, .github/hosting/DESIGN.md §12.1) also has its engine installed, built and
# bundled as a release bundles it, typechecked and tested; check-insulin-app.mjs checks it with its own rules.
on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      workerd-smoke:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: ${{ inputs.app }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The platform previews and publishes on Node 22.
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ inputs.app }}/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Insulin compatibility (source)
        working-directory: .
        run: node .github/scripts/check-insulin-app.mjs ${{ inputs.app }}
      - name: Find the engine
        id: engine
        working-directory: .
        env:
          APP: ${{ inputs.app }}
        run: echo "dir=$(node .github/scripts/list-apps.mjs --engine "$APP")" >> "$GITHUB_OUTPUT"
      - name: Install, build and bundle the engine
        if: steps.engine.outputs.dir != ''
        working-directory: .
        env:
          APP: ${{ inputs.app }}
        # As a release builds it: its exact lockfile without scripts, its build if any, and its Worker bundled.
        run: node .github/scripts/deploy-apps.mjs --build-engine --only "$APP"
      - name: Typecheck the engine
        if: steps.engine.outputs.dir != ''
        working-directory: ${{ steps.engine.outputs.dir }}
        run: npm run typecheck
      - name: Test the engine
        if: steps.engine.outputs.dir != ''
        working-directory: ${{ steps.engine.outputs.dir }}
        run: npm test
      - name: Check the engine's Wrangler config
        if: steps.engine.outputs.dir != ''
        working-directory: ${{ steps.engine.outputs.dir }}
        # Its own `check`, a dry run with --config: Wrangler would otherwise follow the app's generated
        # .wrangler/deploy/config.json.
        run: npm run check
      - name: Test the engine's Python
        if: steps.engine.outputs.dir != ''
        working-directory: ${{ steps.engine.outputs.dir }}
        # In a virtual environment, with pypdf pinned by the hashes of the image's own lockfile, so the PDF tests run
        # rather than being skipped.
        run: |
          venv="$RUNNER_TEMP/engine-venv"
          python3 -m venv "$venv"
          awk '/^pypdf==/ { on = 1 } on { print; if ($0 !~ /\\$/) exit }' container/requirements.lock > "$RUNNER_TEMP/engine-test-requirements.txt"
          "$venv/bin/pip" install --require-hashes --no-deps -r "$RUNNER_TEMP/engine-test-requirements.txt"
          PATH="$venv/bin:$PATH" python3 -c 'import pypdf'
          PATH="$venv/bin:$PATH" npm run test:python
      - name: Test the engine's container
        if: steps.engine.outputs.dir != ''
        working-directory: ${{ steps.engine.outputs.dir }}
        # Its control server in the image's base image, with Docker; the full image only runs on Cloudflare.
        run: npm run test:container
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Migrations match the schema
        # The same drizzle-kit and drizzle-orm the publish pipeline pins: publishing
        # refuses an app whose `drizzle-kit generate` would write anything.
        run: |
          tools="$RUNNER_TEMP/drizzle-tools"
          mkdir -p "$tools" && echo '{"private":true}' > "$tools/package.json"
          npm install --prefix "$tools" --ignore-scripts --no-audit --no-fund drizzle-kit@0.31.11 drizzle-orm@0.45.3
          "$tools/node_modules/.bin/drizzle-kit" generate
          if [ -n "$(git status --porcelain -- src/app/db/migrations)" ]; then
            git status --porcelain -- src/app/db/migrations
            echo "::error::src/app/db/schema.ts and its migrations are out of step: run npm run db:generate and commit the result."
            exit 1
          fi
      - name: Build for Cloudflare Workers
        run: npm run build
        env:
          NODE_ENV: production
          NITRO_PRESET: cloudflare_module
      - name: Insulin compatibility (build output)
        working-directory: .
        run: node .github/scripts/check-insulin-app.mjs ${{ inputs.app }} --built

  workerd-smoke:
    if: inputs['workerd-smoke']
    name: ${{ inputs.app }} workerd smoke
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ${{ inputs.app }}/package-lock.json
            .github/scripts/workerd-smoke/package-lock.json
      - name: Install app
        working-directory: ${{ inputs.app }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install smoke harness
        working-directory: .github/scripts/workerd-smoke
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build, migrate, and run in workerd
        working-directory: .github/scripts/workerd-smoke
        env:
          APP: ${{ inputs.app }}
        # An app with an engine runs with its in-memory stub engine bound as SUGER_ENGINE.
        run: node smoke.mjs --app "$APP"
