      spouseLastName: { text: spouseLastName, when: "line.US.joint == 1" }
      names3: { text: returnNames }
      single: { tick: "line.US.single == 1" }
      joint: { tick: "line.US.joint == 1" }
      separate: { tick: "line.US.separate == 1" }
      hoh: { tick: "line.US.hoh == 1" }
      qss: { tick: "line.US.qss == 1" }
      # Item B: whether the federal return itemizes; item C: whether someone can claim you.
      itemizedYes: { tick: "line.US.itemizes == 1" }
      itemizedNo: { tick: "line.US.itemizes == 0" }
      claimableYes: { tick: "line.US.claimable == 1" }
      claimableNo: { tick: "line.US.claimable == 0" }
      # Items D2 and F: the months a full-year Yonkers or New York City resident lived there (item E, the days in New York
