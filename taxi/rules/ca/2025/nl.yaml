# Newfoundland and Labrador tax: Form NL428, Schedule NL(S11) (tuition and education), Schedule NL(S2) and Form NL479
# (credits). Line ids are the line numbers in the forms' right margin. Every number below was checked against the 2025
# NL428 (5001-C), Worksheet NL428 (5001-D), NL(S2) (5001-S2), NL(S11) (5001-S11), NL479 (5001-TC) and the
# Newfoundland and Labrador information page of the 2025 package (5001-PC).

params:
  nlTaxBrackets:
    label: Newfoundland and Labrador tax brackets
    source: "NL428 Part A, bases as printed on the form"
    value:
      - { upTo: 44192, rate: 8.7%, base: 0 }
      - { upTo: 88382, rate: 14.5%, base: 3844.70 }
      - { upTo: 157792, rate: 15.8%, base: 10252.25 }
      - { upTo: 220910, rate: 17.8%, base: 21219.03 }
      - { upTo: 282214, rate: 19.8%, base: 32454.04 }
      - { upTo: 564429, rate: 20.8%, base: 44592.23 }
      - { upTo: 1128858, rate: 21.3%, base: 103292.95 }
      - { rate: 21.8%, base: 223516.33 }
  nlFirstBracketTop:
    label: Top of the first Newfoundland and Labrador bracket
    source: "NL428 Part A, NL(S2) line 6 and NL(S11) line 7: $44,192"
    value: 44192
  nlCreditRate:
    label: Newfoundland and Labrador credit rate
    source: "NL428 line 57: 8.7%"
    value: 8.7%
  nlBasicPersonalAmount:
    label: Newfoundland and Labrador basic personal amount
    source: "NL428 line 58040: claim $11,067"
    value: 11067
  nlAgeAmountMax:
    label: Newfoundland and Labrador age amount, full
    source: "Worksheet NL428, line 58080: $7,064"
    value: 7064
  nlAgeAmountThreshold:
    label: Net income where the Newfoundland and Labrador age amount starts to go down
    source: "Worksheet NL428, line 58080: income threshold"
    value: 38712
  nlAgeAmountRate:
    label: Newfoundland and Labrador age amount reduction rate
    source: "Worksheet NL428, line 58080: applicable rate"
    value: 15%
  nlSpouseBase:
    label: Newfoundland and Labrador spouse and eligible dependant amount, base
    source: "NL428 lines 18 and 21: $9,948"
    value: 9948
  nlSpouseMax:
    label: Newfoundland and Labrador spouse and eligible dependant amount, most
    source: "NL428 lines 20 and 23: maximum $9,043"
    value: 9043
  nlInfirmBase:
    label: Newfoundland and Labrador amount for an infirm dependant, base
    source: "Worksheet NL428, line 58200, line 1: $11,067"
    value: 11067
  nlInfirmMax:
    label: Most Newfoundland and Labrador amount for an infirm dependant
    source: "Worksheet NL428, line 58200, line 3: maximum $3,515 per dependant"
    value: 3515
  nlCaregiverBase:
    label: Newfoundland and Labrador caregiver amount, base
    source: "Worksheet NL428, line 58400, line 1: $20,689"
    value: 20689
  nlCaregiverMax:
    label: Most Newfoundland and Labrador caregiver amount
    source: "Worksheet NL428, line 58400, line 3: maximum $3,514 per dependant"
    value: 3514
  nlVolunteerAmount:
    label: Newfoundland and Labrador volunteer firefighters' or search and rescue volunteers' amount
    source: "5001-PC, lines 58315 and 58316: enter $3,000"
    value: 3000
  nlAdoptionMax:
    label: Most Newfoundland and Labrador adoption expenses for each child
    source: "5001-PC, line 58330: up to $14,935 of eligible expenses for each child"
    value: 14935
  nlDisabilityAmount:
    label: Newfoundland and Labrador disability amount
    source: "NL428 line 40 (58440): claim $7,467; Worksheet NL428, line 58480, line 1"
    value: 7467
  nlDisabilitySupplementMax:
    label: Newfoundland and Labrador disability supplement for a person under 18, most
    source: "Worksheet NL428, lines 58440 and 58480, line 2: $3,514"
    value: 3514
  nlDisabilityCareThreshold:
    label: Child care and attendant care that the Newfoundland and Labrador disability supplement allows
    source: "Worksheet NL428, lines 58440 and 58480, line 4: $2,987"
    value: 2987
  nlPensionAmountMax:
    label: Most Newfoundland and Labrador pension income amount
    source: "NL428 line 37 (58360): maximum $1,000"
    value: 1000
  nlMedicalThresholdMax:
    label: Newfoundland and Labrador medical expense threshold, most
    source: "NL428 line 52: whichever is less, $2,410 or 3% of net income"
    value: 2410
  nlDonationLowRate:
    label: Newfoundland and Labrador donation credit rate on the first $200
    source: "NL428 line 59: 8.7%"
    value: 8.7%
  nlDonationHighRate:
    label: Newfoundland and Labrador donation credit rate above $200
    source: "NL428 line 60: 21.8%"
    value: 21.8%
  nlDividendEligibleRate:
    label: Newfoundland and Labrador dividend tax credit rate, eligible dividends
    source: "Worksheet NL428, line 61520: 6.3% of the taxable amount of eligible dividends"
    value: 6.3%
  nlDividendOtherRate:
    label: Newfoundland and Labrador dividend tax credit rate, other dividends
