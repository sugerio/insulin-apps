# Questions a formula reads as answer.<id>. A question with a default gives an estimate until it is answered. `module`
# is the part of the return that asks it (about the person, income, deductions, credits); the screens build their forms
# from these entries, in this order. In a module:
# - a yes/no question with a `slip` is a kind of income or expense shown by that slip: finding the slip adds it to the
#   return, and a yes without the slip is missing;
# - a yes/no question without one is a group: its parts (questions with `parent`) are asked in its card once it applies,
#   or, with a `note`, something to know (a form to file separately);
# - a money question is an amount to enter. Its `receipts` are shown with it; a line that adds them makes the amount
#   what isn't on an uploaded receipt, and a `suggest` line works out the amount from the receipts to start from.
# A question without a module and with `decision: true` is a choice the app makes (its default) until a hint, accepted,
# changes it: the result stays complete without an answer.

questions:
  # Income
  hasEmploymentIncome:
    type: boolean
    module: income
    slip: T4
    ask: Employment income
    help: A T4 from each employer you worked for in 2025.
  hasInvestmentIncome:
    type: boolean
    module: income
    slip: T5
    ask: Interest or dividends
    help: A T5 from each bank, credit union or broker that paid you $50 or more.
  hasTrustIncome:
    type: boolean
    module: income
    slip: T3
    ask: Mutual fund or trust income
    help: A T3 from each mutual fund or trust held outside an RRSP or TFSA.
  hasSoldInvestments:
    type: boolean
    module: income
    slip: T5008
    ask: Sold shares, bonds or fund units
    help: A T5008 from each broker, for sales outside an RRSP or TFSA.
  hasOasPension:
    type: boolean
    module: income
    slip: T4AOAS
    ask: Old Age Security pension
    help: A T4A(OAS) from Service Canada.
  hasCppBenefits:
    type: boolean
    module: income
    slip: T4AP
    ask: Canada Pension Plan benefits
    help: A T4A(P) from Service Canada, for a CPP retirement, survivor or disability pension.
  hasPensionIncome:
    type: boolean
    module: income
    slip: T4A
    ask: A pension, annuity, scholarship or other T4A income
    help: A T4A from each pension plan, school or other payer.
  hasRrifIncome:
    type: boolean
    module: income
    slip: T4RIF
    ask: RRIF payments
    help: A T4RIF from each registered retirement income fund you were paid from.
  hasEiBenefits:
    type: boolean
    module: income
    slip: T4E
    ask: Employment insurance benefits
    help: A T4E from Service Canada, for EI regular, sickness, maternity or parental benefits.
  hasSelfEmployment:
    type: boolean
    module: income
    ask: Self-employment or business income
    help: Income from your own business, freelancing or gig work (Form T2125). Attach a T2125 to a paper return.
    default: false
  selfEmploymentKind:
    type: choice
    module: income
    parent: hasSelfEmployment
    ask: Kind of income
    options: [business, professional, commission]
    optionLabels:
      business: Business (a shop, trade or gig work)
      professional: Professional (a consultant, accountant, designer…)
      commission: Commission sales
  selfEmploymentGross:
    type: money
    module: income
    parent: hasSelfEmployment
    ask: Gross income
    help: What you were paid in 2025, without GST/HST you collected.
  selfEmploymentExpenses:
    type: money
    module: income
    parent: hasSelfEmployment
    ask: Business expenses
    help: Supplies, rent, phone, travel, fees and other costs of earning it. Capital cost allowance isn't claimed.
  hasRentalIncome:
    type: boolean
    module: income
    ask: Rental income
    help: Rent from a property you own (Form T776). If you own it with someone, enter your share.
    default: false
  rentalGross:
    type: money
    module: income
    parent: hasRentalIncome
    ask: Rents received
  rentalExpenses:
    type: money
    module: income
    parent: hasRentalIncome
    ask: Rental expenses
    help: Mortgage interest, property tax, insurance, repairs, utilities you paid, and fees. Capital cost allowance isn't claimed.
  hasForeignIncome:
    type: boolean
    module: income
    ask: Income from outside Canada
    help: Interest, dividends or employment income earned abroad, in Canadian dollars. Foreign tax paid on it gives a foreign tax credit (Form T2209).
    default: false
  foreignInvestmentIncome:
    type: money
    module: income
    parent: hasForeignIncome
    ask: Foreign interest and dividends
  foreignInvestmentTax:
    type: money
    module: income
    parent: hasForeignIncome
    ask: Foreign tax withheld on them
  foreignEmploymentIncome:
    type: money
    module: income
    parent: hasForeignIncome
    ask: Employment income earned abroad
  foreignEmploymentTax:
    type: money
    module: income
    parent: hasForeignIncome
    ask: Foreign tax paid on it
  hasForeignProperty:
    type: boolean
    module: income
    ask: Property outside Canada that cost more than $100,000
    help: Foreign bank accounts, shares or real estate (not a home you use) that cost more than $100,000 in total at any time in 2025.
    note: File Form T1135, Foreign Income Verification Statement, with your return. It reports the property; it doesn't change your tax. This app doesn't prepare it.
    default: false
  soldProperty:
    type: boolean
    module: income
    ask: Sold your home or other real estate
    help: The sale of a home, cottage or rental property in 2025 (Schedule 3; Form T2091 for a home).
    default: false
  propertyUse:
    type: choice
    module: income
    parent: soldProperty
    ask: What the property was
    options: [principal_residence, principal_residence_some_years, rental_or_investment, personal_use, flipped]
    optionLabels:
      principal_residence: Your home, every year you owned it
      principal_residence_some_years: Your home, but only some of the years
      rental_or_investment: A rental or investment property
      personal_use: A cottage or other property for your own use
      flipped: Owned less than 12 months
  propertyProceeds:
    type: money
    module: income
    parent: soldProperty
    ask: Selling price
  propertyCost:
    type: money
    module: income
    parent: soldProperty
    ask: What you paid for it, with improvements
    help: "The adjusted cost base: the purchase price, the costs of buying, and the cost of improvements."
  propertyOutlays:
    type: money
    module: income
    parent: soldProperty
    ask: Selling costs
    help: Real estate commission, legal fees and other costs of selling.

  hasRrspIncome:
    type: boolean
    module: income
    slip: T4RSP
    ask: RRSP withdrawals
    help: A T4RSP from each plan you took money out of in 2025.
  hasBenefitsStatement:
    type: boolean
    module: income
    slip: T5007
    ask: Workers' compensation or social assistance
    help: A T5007 from the board or the government that paid you.
  hasSupportReceived:
    type: boolean
    module: income
    ask: Support payments received
    help: Payments from a former spouse or partner under a court order or written agreement.
    default: false
  supportReceived:
    type: money
    module: income
    parent: hasSupportReceived
    ask: Total support received in 2025
  childSupportReceived:
    type: money
    module: income
    parent: hasSupportReceived
    ask: The part that is child support
    help: Child support under an order or agreement made after April 1997 isn't taxable.

  # Deductions
  rrspDeduction:
    type: money
    module: deductions
    receipts: RRSP
    suggest: SUGGEST.rrspDeduction
    ask: RRSP contributions to deduct for 2025
    help: Contributions from March 4, 2025 to March 2, 2026, up to your limit on last year's notice of assessment.
    default: 0
  fhsaDeduction:
    type: money
    module: deductions
    ask: FHSA contributions to deduct for 2025
    default: 0
  hasWorkFromHome:
    type: boolean
    module: deductions
    ask: Working from home
    help: Home-office expenses as an employee who worked from home more than half the time for at least 4 weeks in a row (Form T777). Your employer must sign Form T2200; keep it.
    default: false
  homeOfficeExpenses:
    type: money
    module: deductions
    parent: hasWorkFromHome
    ask: Home expenses for 2025
    help: Electricity, heat, water, home internet, maintenance and rent for your whole home. Mortgage interest and property tax don't count.
  homeOfficeShare:
    type: percent
    module: deductions
    parent: hasWorkFromHome
    ask: Share used for work
    help: The workspace's share of your home's area, times its share of the week's hours used for work. 12% of the area for 40 of 168 hours is 2.86%.
  hasChildCare:
    type: boolean
    module: deductions
    ask: Child care expenses
    help: Daycare, before- and after-school programs or day camps, so you could work (Form T778). For a couple, the one with the lower net income claims it.
    default: false
  childCareExpenses:
    type: money
    module: deductions
    parent: hasChildCare
    receipts: CHILDCARE
    ask: Child care paid
    help: Uploaded receipts are added; enter what isn't on one.
  hasMovingExpenses:
    type: boolean
    module: deductions
    ask: Moving expenses
    help: A move at least 40 km closer to a new job or business (Form T1-M).
    default: false
  movingExpenses:
    type: money
    module: deductions
    parent: hasMovingExpenses
    ask: Moving expenses
    help: Movers, travel, up to 15 days of temporary living, and the costs of selling your old home and buying the new one, less what your employer paid back.
  movingIncome:
    type: money
    module: deductions
    parent: hasMovingExpenses
    ask: Income earned at the new location
    help: Employment or self-employment income from the new job or business in 2025, less its deductions (union dues, CPP).

  hasSupportPaid:
    type: boolean
    module: deductions
    ask: Support payments made
    help: Payments to a former spouse or partner under a court order or written agreement.
    default: false
  supportPaid:
    type: money
    module: deductions
    parent: hasSupportPaid
    ask: Total support paid in 2025
  childSupportPaid:
    type: money
    module: deductions
    parent: hasSupportPaid
    ask: The part that is child support
    help: Child support under an order or agreement made after April 1997 isn't deductible.
  carryingCharges:
    type: money
    module: deductions
    ask: Interest and fees to earn investment income
    help: Interest on money borrowed to invest (outside an RRSP or TFSA) and investment counsel fees.
    default: 0
  hasDisabilitySupports:
    type: boolean
    module: deductions
    ask: Disability supports
    help: Attendant care, sign-language interpretation, devices and other supports paid so you could work or go to school (Form T929).
    default: false
  disabilitySupportsExpenses:
    type: money
    module: deductions
    parent: hasDisabilitySupports
    ask: Disability supports paid
    help: Less what was paid back to you.
  nonCapitalLosses:
    type: money
    module: deductions
    ask: Non-capital losses of earlier years to apply
    help: Losses from a business or employment in earlier years that you haven't used yet.
    default: 0
  netCapitalLosses:
    type: money
    module: deductions
    ask: Net capital losses of earlier years to apply
    help: From your notice of assessment. They can only reduce this year's taxable capital gains.
    default: 0

  # Credits
  hasDisability:
    type: boolean
    module: credits
    ask: Disability tax credit
    help: The CRA approved your Form T2201, Disability Tax Credit Certificate.
    default: false
  spouseInfirm:
    type: boolean
    module: credits
    ask: Your spouse or partner depends on you because of an impairment
    help: An impairment in physical or mental functions that makes them dependent on others for personal needs (Canada caregiver amount).
    default: false
  hasInfirmChildren:
    type: boolean
    module: credits
    ask: A child under 18 with an impairment
    help: A child who, because of an impairment, depends on others for personal needs much more than children of the same age.
    default: false
  infirmChildren:
    type: count
    module: credits
    parent: hasInfirmChildren
    ask: Number of children
  hasInfirmDependant:
    type: boolean
    module: credits
    ask: An adult relative with an impairment depends on you
    help: A parent, grandparent, adult child, brother, sister, aunt, uncle, niece or nephew, 18 or older, with a net income under $28,798.
    default: false
  infirmDependants:
    type: count
    module: credits
    parent: hasInfirmDependant
    ask: Number of dependants
  infirmDependantIncome:
    type: money
    module: credits
    parent: hasInfirmDependant
    ask: Their net income
    help: Line 23600 of their return, or what it would be.
  hasDisabledDependant:
    type: boolean
    module: credits
    ask: A dependant with the disability tax credit
    help: A child or another relative who depends on you, has no income and has an approved Form T2201.
    default: false
  disabledChildren:
    type: count
    module: credits
    parent: hasDisabledDependant
    ask: Children under 18
  disabledChildCare:
    type: money
    module: credits
    parent: hasDisabledDependant
    ask: Child care and attendant care claimed for them
    help: By you or anyone else, as child care or medical expenses.
  disabledAdults:
    type: count
    module: credits
    parent: hasDisabledDependant
    ask: Dependants 18 or older
  hasVolunteerService:
    type: boolean
    module: credits
    ask: Volunteer firefighter or search and rescue
    help: At least 200 hours of eligible volunteer service in 2025.
    default: false
  volunteerKind:
    type: choice
    module: credits
    parent: hasVolunteerService
    ask: Service
    options: [firefighter, search_rescue]
    optionLabels:
      firefighter: Volunteer firefighter
      search_rescue: Search and rescue volunteer
  homeBuyers:
    type: money
    module: credits
    ask: Home buyers' amount
    help: Up to $10,000 when you or your spouse bought a first home in 2025, or a home for a person with a disability. A couple shares the $10,000.
    default: 0
  homeAccessibility:
    type: money
    module: credits
    ask: Home accessibility renovations
    help: Up to $20,000 to make a home safer or easier to use for someone 65 or older or with the disability tax credit.
    default: 0
  hasAdoption:
    type: boolean
    module: credits
    ask: Adoption expenses
    help: For an adoption completed in 2025.
    default: false
  adoptionExpenses:
    type: money
    module: credits
    parent: hasAdoption
    ask: Eligible adoption expenses
    help: Less any reimbursement or assistance.
  adoptedChildren:
    type: count
    module: credits
    parent: hasAdoption
    ask: Children adopted
  studentLoanInterest:
    type: money
    module: credits
    ask: Interest paid on student loans
    help: On loans under the Canada Student Loans Act or a provincial student loan program, for 2025 and up to five earlier years not claimed.
    default: 0
  childTuitionTransfer:
    type: money
    module: credits
    ask: Tuition transferred from a child or grandchild
    help: The amount they designated to you on their T2202, up to $5,000 each.
    default: 0
  hasOtherDependantMedical:
    type: boolean
    module: credits
    ask: Medical expenses for another dependant
    help: An adult child or grandchild, a parent, grandparent, brother, sister, aunt, uncle, niece or nephew who depended on you.
    default: false
  otherDependantMedical:
    type: money
    module: credits
    parent: hasOtherDependantMedical
    ask: Their medical expenses you paid
  otherDependantIncome:
    type: money
    module: credits
    parent: hasOtherDependantMedical
    ask: Their net income
  politicalContributions:
    type: money
    module: credits
    ask: Federal political contributions
    help: To a registered federal party, association or candidate, on official receipts.
    default: 0
  teacherSupplies:
    type: money
    module: credits
    ask: School supplies you paid as a teacher or early childhood educator
    help: Up to $1,000 of supplies for your teaching, not paid back to you.
    default: 0
  multigenerationalRenovation:
    type: money
    module: credits
    ask: Multigenerational home renovation
    help: Up to $50,000 to build a secondary unit for a senior or an adult with a disability to live with a relative (Schedule 12).
    default: 0
  hasCwbAdvance:
    type: boolean
    module: credits
    slip: RC210
    ask: Canada workers benefit paid in advance
    help: An RC210 from the CRA.
  trainingCreditLimit:
    type: money
    module: credits
    receipts: NOA
    suggest: SUGGEST.trainingCreditLimit
    ask: Canada training credit limit from your 2024 notice of assessment
    help: Half your 2025 tuition is refunded, up to this limit.
    default: 0
  instalmentsPaid:
    type: money
    module: credits
    ask: Tax paid by instalments
    help: Instalments you paid to the CRA for 2025.
    default: 0
  hasTuition:
    type: boolean
    module: credits
    slip: T2202
    ask: Tuition at a college or university
    help: A T2202 from each school, for 2025.
  unusedTuition:
    type: money
    module: credits
    receipts: NOA
    suggest: SUGGEST.unusedTuition
    ask: Unused federal tuition from your 2024 notice of assessment
    default: 0
  tuitionTransfer:
    type: money
    module: credits
    ask: Tuition to transfer to your spouse or partner
    help: Up to $5,000 of this year's tuition, as designated on the back of your T2202.
    default: 0
  medicalExpenses:
    type: money
    module: credits
    receipts: MEDICAL
    ask: Medical expenses
    help: For you, your spouse or your children. Uploaded receipts are added; enter what isn't on one. Either spouse can claim the family's medical expenses; it usually saves more on the lower income.
    default: 0
  donations:
    type: money
    module: credits
    receipts: DONATION
    ask: Donations
    help: On official receipts. Uploaded receipts and box 46 of your T4 are added; enter what isn't on one. Either spouse can claim both spouses' donations; claiming them together usually saves more.
    default: 0

  # About the person (Personal info)
  spouseNetIncome:
    type: money
    module: about
    ask: Your spouse's or partner's 2025 net income
    help: Line 23600 of their return. Their return isn't prepared here, but some of your credits depend on it.

  # Decisions between spouses: which return claims what either spouse may claim. Changed by accepting a hint
  # (hints.yaml); each spouse claims their own until then.
  claimSpouseDonations:
    type: boolean
    ask: Claim your spouse's or partner's donations on this return
    default: false
    decision: true
  claimSpouseMedical:
    type: boolean
    ask: Claim your spouse's or partner's medical expenses on this return
    default: false
    decision: true
