# The California resident return for 2025: Form 540, with Schedule CA (540), Schedule P (540) and forms FTB 3506 and
# FTB 3514, for a person whose state on December 31 is California (person.province "CA") and who lived there all year.
# Each number names its source: "Booklet" is the 2025 California Form 540 Personal Income Tax Booklet, "Schedule CA
# instructions" its instructions for Schedule CA (540), "Schedule P instructions" the 2025 Instructions for Schedule
# P (540), "3506 instructions" the 2025 Instructions for Form FTB 3506, and "3514 Booklet" the 2025 FTB 3514 California
# Earned Income Tax Credit Booklet; check it there before changing it.
#
# The return starts from the federal one: federal AGI (Form 1040, line 11b, here F1040.11a), changed by Schedule CA for
# what California taxes differently, then California's own deductions, tax, credits and payments. Form 540 is in whole
# dollars, so each amount carried from the federal return is rounded to the dollar. A joint return is one Form 540, the
# person preparing's, like the federal one; married filing separately in California is a community property return
# (federal.yaml, SCOPE.communityProperty), which this app doesn't prepare. What California needs that this app doesn't
# work out is said on the California return only (CALSCOPE.return): the federal return stays complete.

