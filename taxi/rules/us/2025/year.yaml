# The 2025 United States federal rules (Form 1040): wages and interest, filing Single, Married filing jointly, Married
# filing separately, Head of household or Qualifying surviving spouse; dependants and their credits (Schedule 8812); the earned income credit; child and dependent care (Form 2441); the education credits (Form 8863) and the student loan interest deduction; the standard deduction, the enhanced deduction for seniors, and the tax. Each number names its source in
# the 2025 Instructions for Form 1040 (i1040gi, February 25, 2026) or on the 2025 form; check it there before changing it.
country: us
year: 2025
filingUnit: person   # one return per adult, except a joint return: the person preparing's, with the spouse's income on it
extends: null

# The lines a summary shows, in order.
result:
  - F1040.9
  - F1040.10
  - F1040.11a
  - F1040.12e
  - F1040.13a
  - F1040.13b
  - F1040.15
  - F1040.16
  - F1040.19
  - S3.2
  - S3.3
  - F1040.23
  - F1040.24
  - F1040.27a
  - F1040.28
  - F1040.29
  - F1040.33
  - F1040.34
  - F1040.37

# On a joint return the spouse has no result of their own: their income is on the person preparing's return.
resultWhen:
  F1040.9: &ownReturn 'person.role == "self" or line.US.joint == 0'
  F1040.10: *ownReturn
  F1040.11a: *ownReturn
  F1040.12e: *ownReturn
  F1040.13a: *ownReturn
  F1040.13b: *ownReturn
  F1040.15: *ownReturn
  F1040.16: *ownReturn
  F1040.19: *ownReturn
  S3.2: *ownReturn
  S3.3: *ownReturn
  F1040.23: *ownReturn
  F1040.24: *ownReturn
  F1040.27a: *ownReturn
  F1040.28: *ownReturn
  F1040.29: *ownReturn
  F1040.33: *ownReturn
  F1040.34: *ownReturn
  F1040.37: *ownReturn

# The line hints compare with and without their change.
outcome: RESULT.net

# The refund or amount owed a return shows.
balances:
  - { name: Federal, refund: F1040.34, owing: F1040.37 }

# What person.residentAllYear means: a nonresident or dual-status alien files Form 1040-NR, not this return.
residency: A U.S. citizen or resident alien all year

# What AI reading is told about US documents (server/lib/reader.ts adds the slip types of slips.yaml). {year} is the
# tax year.
reading:
  documents: United States information returns (Forms W-2, 1099 and 1098)
  notes:
    - "A W-2 prints boxes 1 to 20; box 12 holds codes, and boxes 13 and 14 are not amounts this app reads: leave them out. The 'a' to 'f' boxes hold numbers, names and addresses, never amounts: leave them out too."
    - "On a 1099 or 1098, report the payer's or lender's or school's name as issuer. A form can print a box that is a checkbox (such as boxes 7, 8 and 9 of a 1098-T): leave checkboxes out."
    - "For a Form 1098-T, person is the student, and issuer the school. For a Form 1098-E, person is the borrower, and issuer the lender."
    - "A corrected form (marked CORRECTED) replaces the first one: read it like any other."
