# The CRA forms a return is printed on, and what goes in each row. A row is the number printed at the right of its box
# (or the line code of a box without one); form-layout.yaml says where it is on the CRA's print PDF. A resident of
# Quebec's return also prints on Revenu Québec's TP-1 and schedules, at the end: their rows are the line numbers
# printed left of their boxes (see "Revenu Québec's forms" below). Each amount is a formula from the return's side,
# like a line's. A zero or a missing amount is left blank, as the CRA asks ("complete only the lines that apply to
# you"), unless the field says `zero: true`. Rows the app has nothing for (a pension, a foreign tax credit) are left
# out. `<row>@<n>` is the row's n-th box from the left (the "you" column of a "you / your spouse" table is @1, an
# amount carried in on the row's line). A field is an amount unless it says otherwise:
#   { count: <formula> }   a whole number (a number of children or months), with no cents
#   { tick: <formula> }    a tick in a box, when the formula is yes from the person's answers (not from a usual answer)
#   { text: <fact> }       the person's firstName, lastName, birthDate or province, or their spouseFirstName,
#                          spouseLastName or spouseBirthDate
# A form applies to the returns whose `applies` is yes; the forms are printed in this order, as the CRA asks them
# attached: the T1, its schedules and forms, then the provincial or territorial ones; for a resident of Quebec, the
# TP-1 and its schedules after them.
#
# A bracket table fills, in the column of the bracket the amount falls in, the amount, the amount over the column's
# floor, that times the rate, and that plus the printed base; its parts are the printed tables, in bracket order.
#
# The PDFs come from canada.ca (or revenuquebec.ca) on first use (url) and must match the layout's SHA-256: a form the
# CRA or Revenu Québec changes is measured again with npm run form-layout before it is filled.
#
# Revenu Québec publishes each form in French too: `french` gives that version's title and url. It has the same rows
# and fields, placed by its own layout (<FORM>-fr in form-layout.yaml); a return is printed on it when its forms are
# asked for in French.

forms:
  T1:
    title: T1 Income Tax and Benefit Return
    url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.pdf
    applies: person.province != "QC"
    fields:
      # Step 1 – Identification and other information: what the app knows. The SIN, address, email, language, the
      # dates of entry or departure (the app knows the days in Canada, not the dates), the spouse's SIN and the other
      # questions stay for the person to fill in.
      firstName: { text: firstName }
      lastName: { text: lastName }
      birthDate: { text: birthDate }
      married: { tick: 'family.maritalStatus == "married"' }
      commonLaw: { tick: 'family.maritalStatus == "common_law"' }
      widowed: { tick: 'family.maritalStatus == "widowed"' }
      divorced: { tick: 'family.maritalStatus == "divorced"' }
      separated: { tick: 'family.maritalStatus == "separated"' }
      single: { tick: 'family.maritalStatus == "single"' }
      province: { text: province }
      spouseFirstName: { text: spouseFirstName, when: "line.HH.partner == 1" }
      # Known only when the spouse's return is prepared here too.
      spouseSelfEmployed: { tick: "line.SPOUSES.together == 1 and spouse.answer.hasSelfEmployment" }
      # The CRA asks for the spouse's net income even when it is zero: their net world income for 2025, whatever their
