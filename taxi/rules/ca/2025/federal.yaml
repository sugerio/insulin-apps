# Federal tax: the T1 (5006-R) and Schedules 3, 9 and 11, for the income, deductions and credits in scope. Line ids
# are the form's own: T1 lines by their five-digit number, a schedule's lines by the number in its right margin.
# Every number below was checked against the 2025 forms: T1 5006-R, Federal Worksheet 5000-D1, Schedules 2, 3, 5, 9
# and 11, and the CRA's 2025 payroll tables for CPP and EI.

params:
  taxBrackets:
    label: Federal tax brackets
    source: "T1 Step 5 Part A. The lowest rate went from 15% to 14% on July 1, 2025, so 14.5% applies for the year. Bases as printed on the form."
    value:
      - { upTo: 57375, rate: 14.5%, base: 0 }
      - { upTo: 114750, rate: 20.5%, base: 8319.38 }
      - { upTo: 177882, rate: 26%, base: 20081.25 }
      - { upTo: 253414, rate: 29%, base: 36495.57 }
      - { rate: 33%, base: 58399.85 }
  creditRate:
    label: Federal credit rate
    source: "T1 line 114: federal non-refundable tax credit rate for 2025"
    value: 14.5%
  basicPersonalAmountMax:
