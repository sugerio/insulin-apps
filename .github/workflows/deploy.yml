name: Deploy

# Deploys a release by hand (Actions → Deploy → Run workflow, on main): to retry a deploy that failed, to go back to an
# earlier release, or to send changed settings out. It waits for any Release run, and a Release run for it, since both
# hold the `release` concurrency group, so a deploy by hand never overlaps a release's. See deploy-release.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The release to deploy, such as v0.1.2
        required: true
        type: string
      apps:
        description: The apps to deploy, separated by spaces, or all
        type: string
        default: all
      gateway:
        description: Deploy the gateway too
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-release.yml
    with:
      version: ${{ inputs.version }}
      apps: ${{ inputs.apps }}
      gateway: ${{ inputs.gateway }}
    secrets: inherit
