# Quebec: the Revenu Québec income tax return TP-1 (TP-1.D-V, 2025-12), which a Quebec resident files besides the
# federal T1. Line ids are the TP-1's own line numbers, a decimal line written with an underscore (line 377.1 is
# TP1.377_1); the schedules' lines are in qc-credits.yaml (QCA … QCU). Every number was checked against the 2025
# documents: the TP-1, its guide (TP-1.G-V), the schedules and work charts (TP-1.D.<X>-V, TP-1.D.GR-V), Revenu Québec's
# guide for employers (TP-1015.G-V) and the RL slips' courtesy translations.
#
# Only a Quebec return reads these lines: the result lines TP1.478 and TP1.479 are 0 for anyone else, and read nothing.
# The TP-1 reads the RL slips (slips.yaml), never the matching T-slips: a payer in Quebec issues both, and their
# amounts can differ. It reads the federal return only where the guide says the two are equal (RRSP, FHSA, RPP limit,
# support, carrying charges, the T1032 split, self-employment, the social benefits repayment) and for the federal slips
# that have no RL slip (T4E, T4A(OAS), T4A(P), and a T5007 when no RL-5 came).
#
# Left out (said not handled, or not entered): a year you moved to or from Canada; employment outside Quebec (a T4
# without an RL-1, Schedule R Part B, line 454); any other T-slip without the RL slip issued with it (a T5 without an
# RL-3, a T3 without an RL-16, a pension, annuity, RRSP or RRIF slip without an RL-2, a T2202 from a school outside
# Quebec, which issues no RL-8, some T5007 slips with an RL-5 and some without); a slip box whose amount belongs on a
# TP-1 line or an RL box this app doesn't handle (security options and the Canadian Forces deduction on a T4, a T4A's
# other income, scholarships and RDSP income, a T4FHSA's taxable amounts, workers' compensation on a T5007, RRSP
# amounts other than annuity payments and withdrawals); CPP contributions on an RL-1 (lines 96 to 96.2, form
# LE-35-V); QPP in the year you turned 18 or 73, an election to stop paying QPP (Schedule U Part A); rental and foreign
# income (TP-128-V, Schedule E); net federal supplements (lines 148 and 295); an OAS overpayment recovered; moving
# expenses (line 228); line 246 other than EI benefits repaid; line 250 other than point 3 (the social benefits
# repayment); lines 105, 107, 136, 153, 169, 236, 241, 252, 260, 276, 278, 287, 291 to 297, 358, 378, 390 to 392, 396,
# 422, 424, 438, 443, 454, 459, 460, 466; the refund transferred between spouses (lines 476 and 477); Schedule A Parts A
# and C, Schedule B line 21, Schedule H, the adapted work premium (Schedule P column 2) and the supplement to the work
# premium (Part D).

