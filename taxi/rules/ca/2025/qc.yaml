lines:
  # Who the TP-1 is for, and the couple. A spouse's return is read only when both returns are prepared here and the
  # spouse is a Quebec resident too; otherwise their net income is the federal one, or the answer about them.
  QC.couple:
    label: Both spouses file a Quebec return prepared here (1 for yes)
    formula: 'if(line.HH.partner == 1 and family.partnerInYear, if(spouse.person.province == "QC", 1, 0), 0)'
  QC.spouseNet:
    label: Your spouse's net income, for the Quebec family income
    formula: >-
      if(line.HH.partner == 1, if(family.partnerInYear, if(spouse.person.province == "QC", spouse.line.TP1.275,
      spouse.line.T1.23600), answer.spouseNetIncome), 0)
    source: "TP-1 line 51: your spouse's net income (line 275 of their TP-1); for a spouse who doesn't file one, their federal net income"
  QC.family:
    label: Family income
    formula: "line.TP1.275 + line.QC.spouseNet"
    source: "Schedules B, C, J, K and P, Part A or C: line 275 of your return plus line 275 of your spouse's return"
  QC.work:
    label: Work income
    formula: "max(0, line.TP1.101 - sum(RL1.box211)) + max(0, line.SE.net)"
    source: "Work Chart 201, lines 1 to 8, and Schedule P, line 29: line 101 less box 211 of the RL-1, plus net business income (no losses)"
  # Cases the TP-1 here doesn't handle: the return waits instead of guessing.
  #
  # The TP-1 reads RL slips, so what a T-slip's box holds reaches it only through the RL slip issued with that T-slip.
  # Where Quebec counts the same amount as the federal return (interest, capital gains, dividends, a trust's other and
  # foreign income, pensions, annuities, RRSP and RRIF payments, social assistance), the T-slips' box is compared with
  # the RL boxes that carry it, since one RL slip can cover several T-slips (a bank's T5s on one RL-3): a blank box
  # entered as 0, or two T-slips under one RL slip, pass; a T-slip without its RL slip doesn't. Box B of the RL-3 and
  # box I of the RL-16 gross up both kinds of dividend at once, so each can round a cent under the T-slip's two boxes:
  # a cent a slip is allowed. An RL-2 puts a payment in box A, B or C as the payer chooses (box C holds an RPP's lump
  # sums, T4A box 018), and an RL-16 foreign income in box E or F, so those are compared together.
  # T4s and RL-1s. For employment in Quebec, RL-1 box A and T4 box 14 are the same pay, each with benefits the other
  # leaves out. Box A adds those taxed only in Quebec: an employer's contribution to a private health services plan,
  # also shown in box J (RL-1.G-V, 5.3.1 and 5.12), tips the employer allocated (box T, 5.3.2 and 5.22), a
  # multi-employer group insurance contribution (box P, 5.18) and benefits in box L (5.14). Box 14 adds those taxed only
  # federally: an eligible public transit pass, valid for at least a month (or an eligible paratransit pass), that the
  # employer provides mainly for commuting or reimburses against supporting documents (Quebec exempts it, IN-253-V 5.8,
  # while a transit allowance stays taxable; the CRA taxes it, T4130, "Transportation passes", code 40), and the
  # employer's intermunicipal shared transportation meeting the conditions of IN-253-V 5.9, which keep it out of box A.
  # (Computer or office equipment reimbursed for working from home isn't one: Quebec taxes it, in boxes A, G, I and L,
  # IN-253-V 7.13.) Neither slip shows box 14's on its own, so the answer qcExemptBenefits (questions.yaml) gives
  # their total. With S, the shortfall, box 14 less box A less box J: the answer is asked only when S is more than 0, so
  # a return whose slips agree never sees it, and it must be S exactly. An employer reports such a benefit to the cent,
  # so an honest answer is S, and an answer left from an earlier gap counts only if a new gap is the same to the cent
  # (the employer moving the benefit to a T4 of its own, which is the same case). Boxes T, P and L aren't read. The
  # guide also moves out of box A income situated on a reserve or premises (box R) and wage loss replacement benefits
  # and top-up disability payments (box O, code RN, 5.17.16), which this TP-1 doesn't read either. Amounts are exact
  # decimals: no tolerance. Three tests, any one refusing, each with its message:
  # - more employers with a T4 showing employment income than with an RL-1 showing box A, since boxes T, P and L can
  #   still hide a whole T4 from another employer in the amounts. A T4 and its RL-1 can name the employer differently
  #   (in English and in French), so the counts are compared rather than the names matched; one employer spelled two
  #   ways on two T4s counts as two, and is refused;
  # - S more than 0 and the answer not S (an answer above box 14 among them): benefits Quebec doesn't tax not entered,
  #   or entered wrong, which the message sends back to the Income step for first, then an RL-1 left out (one employer
  #   can issue one for each payroll account, or for the Quebec part of a year it moved you to another province),
  #   employment outside Quebec (an Ottawa employer's RL-1 for the health plan benefit alone), or income in box O or R.
  #   One employer's two T4s under one RL-1 (two EI categories) carry the same total and pass. Transit benefits beside
  #   tips, box P or box L in box A can't be S exactly and are refused, the cost below;
  # - more T4s with employment income than RL-1s with box A, and box A less box J more than box 14 (S below 0; once the
  #   answer, S, is taken off a shortfall, the amounts match). More T4s than RL-1s is what every RL-1 left out of one
  #   employer looks like (a second payroll account, a move out of Quebec), and boxes T, P and L can hide one in the
  #   amounts, so there one RL-1 covering several T4s must carry the same pay. One employer's two T4s under one RL-1
  #   with only box J beside its pay pass; such an RL-1 that also carries tips, box P or a Quebec-only box L benefit, or
  #   another employer's RL-1 carrying them beside it, is refused: rare on rare, and the safer failure, which the
  #   message says.
  # What none sees: as many RL-1s as T4s, one of them for a benefit alone (box J, an Ottawa employer's health plan, or
  # the same employer's for the months it moved you out of Quebec) beside a T4 from outside Quebec, and that T4 smaller
  # than the amounts in box A outside box J (box T, P or L) on another RL-1.
  # T2202s and RL-8s: Quebec's eligible tuition (RL-8 box B, which a CEGEP can leave blank, and which leaves out fees
  # for medical services the CRA allows, RL-8.G-V 3.5) isn't the federal one (T2202 box 26), so amounts aren't
  # compared: more schools with a T2202 showing tuition than RL-8 slips, whatever boxes they show, are refused. A
  # school issues one RL-8 for the year (box A takes one amount for all the terms begun in it, RL-8.G-V 3.4), so its
  # two T2202s under one RL-8 pass; a second RL-8 from one school, if one were left out, would only lower the Quebec
  # tuition credit, never leave out income.
  #
  # A slip box the federal return reads whose amount no TP-1 line reads is refused, naming the TP-1 line it belongs on.
  QC.scope:
    label: Quebec return cases this app doesn't handle
    formula: >-
      if(not person.residentAllYear,
      unsupported("A Quebec return for a year you moved to or from Canada isn't handled by this app yet"),
      if(countIssuers(T4.box14) > countIssuers(RL1.boxA),
      unsupported("More employers gave you a T4 with employment income (box 14) than gave you an RL-1 with box A. A Quebec resident's employer in Quebec issues an RL-1 with each T4: upload it. Employment outside Quebec (a T4 with no RL-1, Schedule R Part B) isn't handled by this app yet"),
      if(sum(T4.box14) > sum(RL1.boxA) - sum(RL1.boxJ)
      and answer.qcExemptBenefits != sum(T4.box14) - (sum(RL1.boxA) - sum(RL1.boxJ)),
      unsupported("Your RL-1 slips don't cover the employment income on your T4 slips: box 14 is more than box A of the RL-1s less the health plan benefit in box J. First check “Benefits on your T4 slips that Quebec doesn't tax” on the Income step: if all of the difference is such benefits (an eligible transit pass, say), enter exactly the difference there. Otherwise upload the RL-1 an employer in Quebec issues with each T4. If every RL-1 is here, the difference is employment outside Quebec (a T4 with no RL-1, or with an RL-1 for a health plan benefit only, Schedule R Part B) or employment income an RL-1 shows outside box A (box O or R), which this app doesn't handle yet"),
      if(countNonZero(T4.box14) > countNonZero(RL1.boxA) and sum(RL1.boxA) - sum(RL1.boxJ) > sum(T4.box14),
      unsupported("You have more T4 slips than RL-1 slips, and box A of the RL-1s, less the health plan benefit in box J, is more than box 14 of the T4s: one RL-1 covers several T4s from one employer only when it carries the same pay. Upload the RL-1 an employer in Quebec issues with each T4. If every RL-1 is here, an RL-1 adds amounts to box A that a T4 doesn't have (allocated tips in box T, box P or L), which this app doesn't handle yet"),
      if(sum(T5.box13) > sum(RL3.boxD),
      unsupported("The interest on your T5 slips (box 13) is more than box D of your RL-3 slips: upload the RL-3 issued with each T5, with its box D. A T5 without its RL-3 isn't handled on the Quebec return by this app yet"),
      if(sum(T5.box11) + sum(T5.box25) > sum(RL3.boxB) + 0.01 * count(RL3.boxB),
      unsupported("The taxable dividends on your T5 slips (boxes 11 and 25) are more than box B of your RL-3 slips: upload the RL-3 issued with each T5, with its box B. A T5 without its RL-3 isn't handled on the Quebec return by this app yet"),
      if(sum(T5.box18) > sum(RL3.boxI),
      unsupported("The capital gains dividends on your T5 slips (box 18) are more than box I of your RL-3 slips: upload the RL-3 issued with each T5, with its box I. A T5 without its RL-3 isn't handled on the Quebec return by this app yet"),
      if(sum(T3.box21) > sum(RL16.boxA),
      unsupported("The capital gains on your T3 slips (box 21) are more than box A of your RL-16 slips: upload the RL-16 issued with each T3, with its box A. A T3 without its RL-16 isn't handled on the Quebec return by this app yet"),
      if(sum(T3.box32) + sum(T3.box50) > sum(RL16.boxI) + 0.01 * count(RL16.boxI),
      unsupported("The taxable dividends on your T3 slips (boxes 32 and 50) are more than box I of your RL-16 slips: upload the RL-16 issued with each T3, with its box I. A T3 without its RL-16 isn't handled on the Quebec return by this app yet"),
      if(sum(T3.box26) > sum(RL16.boxG),
      unsupported("The other income on your T3 slips (box 26) is more than box G of your RL-16 slips: upload the RL-16 issued with each T3, with its box G. A T3 without its RL-16, or an RL-16 that reports this income in a box this app doesn't read, isn't handled on the Quebec return yet"),
      if(sum(T3.box25) > sum(RL16.boxE) + sum(RL16.boxF),
      unsupported("The foreign non-business income on your T3 slips (box 25) is more than boxes E and F of your RL-16 slips: upload the RL-16 issued with each T3, with its box E or F. A T3 without its RL-16 isn't handled on the Quebec return by this app yet"),
      if(sum(T4RSP.box18) + sum(T4RSP.box20) + sum(T4RSP.box26) + sum(T4RSP.box28) + sum(T4RSP.box34) > 0,
      unsupported("RRSP amounts other than annuity payments and withdrawals (boxes 18, 20, 26, 28 and 34 of the T4RSP) go on the Quebec return from boxes of the RL-2 this app doesn't read (line 154, points 4 and 7): they aren't handled by this app yet"),
      if(sum(T4A.box016) + sum(T4A.box018) + sum(T4A.box024) + sum(T4RIF.box16) + sum(T4RSP.box16) + sum(T4RSP.box22)
      > sum(RL2.boxA) + sum(RL2.boxB) + sum(RL2.boxC),
      unsupported("Your T4A, T4RSP and T4RIF slips show more pension, annuity, RRSP and RRIF payments (T4A boxes 016, 018 and 024, T4RSP boxes 16 and 22, T4RIF box 16) than boxes A, B and C of your RL-2 slips: upload the RL-2 issued with each of them. A payment without its RL-2 isn't handled on the Quebec return by this app yet"),
      if(countIssuers(T2202.box26) > RL8.slips,
      unsupported("More schools gave you a T2202 with tuition (box 26) than gave you an RL-8. A college or university in Quebec issues an RL-8 with each T2202: upload it. Tuition paid to a school outside Quebec (a T2202 without an RL-8, Schedule T) isn't handled on the Quebec return by this app yet"),
      if(sum(RL5.boxA) + sum(RL5.boxB) > 0 and sum(T5007.box11) > sum(RL5.boxA) + sum(RL5.boxB),
      unsupported("The social assistance on your T5007 slips (box 11) is more than boxes A and B of your RL-5 slips: upload the RL-5 issued with each T5007. The Quebec return takes the T5007 only when there is no RL-5 at all"),
      if(sum(T4.box39) + sum(T4.box41) > 0,
      unsupported("The security option deduction (boxes 39 and 41 of the T4) on the Quebec return (line 297, point 2, from boxes L-9 to L-13 of the RL-1) isn't handled by this app yet"),
      if(sum(T4.box43) > 0,
      unsupported("The Canadian Forces personnel and police deduction (box 43 of the T4) on the Quebec return (line 297, point 23) isn't handled by this app yet"),
      if(sum(T4A.box028) > 0,
      unsupported("Other income on a T4A (box 028) on the Quebec return (line 154, point 3, from box O of the RL-1) isn't handled by this app yet"),
      if(sum(T4A.box105) > 0,
      unsupported("Scholarships and bursaries (box 105 of the T4A) on the Quebec return (line 154, point 1, from box O of the RL-1, and their deduction on line 295) aren't handled by this app yet"),
      if(sum(T4A.box131) > 0,
      unsupported("Income from an RDSP (box 131 of the T4A) on the Quebec return (line 278, from box O of the RL-1) isn't handled by this app yet"),
      if(sum(T4FHSA.box22) + sum(T4FHSA.box24) + sum(T4FHSA.box26) > 0,
      unsupported("Taxable FHSA amounts (boxes 22, 24 and 26 of the T4FHSA) on the Quebec return (line 154, point 19, from the RL-32) aren't handled by this app yet"),
      if(sum(T5007.box10) > 0,
      unsupported("Workers' compensation (box 10 of the T5007) on the Quebec return (line 148, and its deduction on line 295) isn't handled by this app yet"),
      if(answer.hasRentalIncome, unsupported("Rental income on the Quebec return (form TP-128-V) isn't handled by this app yet"),
      if(answer.hasForeignIncome, unsupported("Foreign income on the Quebec return (the foreign tax credit, Schedule E) isn't handled by this app yet"),
      if(sum(T4AOAS.box21) > 0, unsupported("Net federal supplements on the Quebec return (lines 148 and 295) aren't handled by this app yet"),
      if(sum(T4AOAS.box20) > 0, unsupported("An Old Age Security overpayment recovered (box 20 of the T4A(OAS)) on the Quebec return isn't handled by this app yet"),
      if(answer.hasMovingExpenses, unsupported("Moving expenses on the Quebec return (form TP-348-V) aren't handled by this app yet"), 0)))))))))))))))))))))))))))

  # Page 2 – contributions (not added into income)
  TP1.97:
    label: QPIP premium
    formula: "sum(RL1.boxH)"
    source: "TP-1 line 97: box H of your RL-1 slips"
  TP1.98:
    label: QPP contribution
    formula: "sum(RL1.boxB_A)"
    source: "TP-1 line 98: box B.A of your RL-1 slips"
  TP1.98_1:
    label: Pensionable salary or wages (QPP)
    formula: "sum(RL1.boxG)"
    source: "TP-1 line 98.1: box G of your RL-1 slips"
  TP1.98_2:
    label: Additional contribution to the QPP
    formula: "sum(RL1.boxB_B)"
    source: "TP-1 line 98.2: box B.B of your RL-1 slips"

  # Total income
  TP1.101:
    label: Employment income
    formula: "sum(RL1.boxA)"
    source: "TP-1 line 101: box A of your RL-1 slips"
  TP1.110:
    label: Parental insurance benefits
    formula: "sum(RL6.boxA)"
    source: "TP-1 line 110: box A of the RL-6 slip"
  TP1.111:
    label: Employment Insurance benefits
    formula: "sum(T4E.box14)"
    source: "TP-1 line 111: the T4E slip (box 14). Parental insurance benefits (RL-6) go on line 110 only"
  TP1.114:
    label: Old Age Security pension
    formula: "line.T1.11300"
    source: "TP-1 line 114: the T4A(OAS) slip (box 18)"
  TP1.119:
    label: QPP or CPP benefits
    formula: "if(sum(RL2.boxC_QPP) > 0, sum(RL2.boxC_QPP), sum(T4AP.box20))"
    source: "TP-1 line 119: box C of the RL-2 slip for QPP benefits; a CPP pension (Service Canada issues no RL-2) from box 20 of the T4A(P)"
  TP1.122:
    label: Payments from a pension plan, an RRSP or a RRIF, or annuities
    formula: "sum(RL2.boxA) + sum(RL2.boxB)"
    source: "TP-1 line 122: boxes A and B of the RL-2 slip"
  TP1.123:
    label: Retirement income transferred by your spouse
    formula: "if(line.QC.couple == 1, spouse.line.TP1.245, 0)"
    source: "TP-1 line 123 and Schedule Q, line 22: the amount your spouse transfers to you"
  TP1.166:
    label: Actual amount of eligible dividends
    formula: "sum(RL3.boxA1) + sum(RL16.boxC1)"
    source: "TP-1 line 166: box A1 of the RL-3 slip and box C1 of the RL-16 slip"
  TP1.167:
    label: Actual amount of ordinary dividends
    formula: "sum(RL3.boxA2) + sum(RL16.boxC2)"
    source: "TP-1 line 167: box A2 of the RL-3 slip and box C2 of the RL-16 slip"
  TP1.128:
    label: Taxable amount of dividends
    formula: "sum(RL3.boxB) + sum(RL16.boxI)"
    source: "TP-1 line 128: box B of the RL-3 slip and box I of the RL-16 slip"
  TP1.130:
    label: Interest and other investment income
    formula: "sum(RL3.boxD) + sum(RL3.boxE) + sum(RL3.boxF) + sum(RL16.boxE) + sum(RL16.boxF) + sum(RL16.boxG)"
    source: "TP-1 line 130: boxes D, E and F of the RL-3 slip; boxes E, F and G of the RL-16 slip"
  QCG.gains:
    label: Capital gains or losses
    formula: "line.S3.13200 + line.S3.13800 + line.S3.15800 + sum(RL3.boxI) + sum(RL16.boxA)"
    source: "Schedule G: shares and fund units sold (as on federal Schedule 3, line 13200), real estate and personal-use property (lines 13800 and 15800), capital gains dividends (RL-3 box I) and trust capital gains (RL-16 box A)"
  TP1.139:
    label: Taxable capital gains
    formula: "max(0, round(line.QCG.gains * param.qcCapitalGainsInclusionRate, 2))"
    source: "TP-1 line 139: Schedule G, line 108, at 50%. A net capital loss isn't entered here; it carries forward"
  TP1.142:
    label: Support payments received (taxable amount)
    formula: "line.T1.12800"
    source: "Work Chart 142: support received less the non-taxable child support, as on the federal return"
  TP1.147:
    label: Social assistance payments
    formula: "if(sum(RL5.boxA) + sum(RL5.boxB) > 0, sum(RL5.boxA) + sum(RL5.boxB), sum(T5007.box11))"
    source: "Guide, line 147: boxes A and B of the RL-5 slip, or the amount on the T5007 slip (box 11) if you did not receive an RL-5 (one with no amount in box A or B, such as a childcare allowance's, doesn't count)"
  TP1.154:
    label: Other income
    formula: "sum(RL2.boxC)"
    source: "TP-1 line 154 and the RL-2 slip, box C: payments from a pension plan, an RRSP, a DPSP or an annuity other than QPP benefits"
  TP1.164:
    label: Net business income
    formula: "line.SE.net"
    source: "Schedule L, lines 22 to 27 and 34: the net income of your business, as on the federal return"
  TP1.199:
    label: Total income
    formula: >-
      line.TP1.101 + line.TP1.110 + line.TP1.111 + line.TP1.114 + line.TP1.119 + line.TP1.122 + line.TP1.123 + line.TP1.128
      + line.TP1.130 + line.TP1.139 + line.TP1.142 + line.TP1.147 + line.TP1.154 + line.TP1.164 + line.QC.scope
    source: "TP-1 line 199: lines 101 and 105 through 164"

  # Net income
  TP1.201:
    label: Deduction for workers
    formula: "min(param.qcWorkerDeductionMax, round(line.QC.work * param.qcWorkerDeductionRate, 2))"
    source: "Work Chart 201: 6% of eligible work income, maximum $1,420"
  TP1.205:
    label: Registered pension plan (RPP) deduction
    formula: "min(sum(RL1.boxD), line.T1.20700)"
    source: "TP-1 line 205: box D of the RL-1 slip; guide, line 205: not more than the federal deduction (line 20700)"
  TP1.207:
    label: Employment expenses and deductions
    formula: "line.T1.22900"
    source: "TP-1 line 207 (code 07, form TP-59-V): the work-from-home expenses, as on federal line 22900"
  TP1.214:
    label: RRSP or PRPP/VRSP deduction
    formula: "line.T1.20800"
    source: "Guide, line 214: the amount deducted on federal line 20800"
  TP1.215:
    label: FHSA deduction
    formula: "line.T1.20805"
    source: "Guide, line 215: the amount deducted on federal line 20805"
  TP1.225:
    label: Support payments made (deductible amount)
    formula: "line.T1.22000"
    source: "Work Chart 225: support paid less the non-deductible child support, as on the federal return"
  TP1.231:
    label: Carrying charges and interest expenses
    formula: "line.T1.22100"
    source: "TP-1 line 231: the same carrying charges as on federal line 22100"
  TP1.245:
    label: Deduction for retirement income transferred to your spouse
    formula: >-
      if(line.QC.couple == 1 and person.age >= 65, min(line.T1.21000, round(line.QCQ.20 * 50%, 2)), 0)
    source: "Schedule Q, line 22: up to 50% of line 20, for a person born before 1961. The app transfers what the federal T1032 splits (line 21000)"
  TP1.246:
    label: Deduction for a repayment of amounts overpaid to you
    formula: "sum(T4E.box30)"
    source: "Guide, line 246: Employment Insurance benefits repaid (box 30 of the T4E), other than the repayment of line 250, point 3. Revenu Québec can instead give the credit of line 462, point 8, for benefits of an earlier year, on request; no other repayment of line 246 is handled"
  TP1.248:
    label: Deduction for QPP and CPP contributions and QPIP premiums
    formula: >-
      if((line.TP1.98 > 0 and (person.age <= 18 or person.age >= 73)) or (line.QCU.33 > 0 and person.age == 18),
      unsupported("QPP in the year you turned 18 is prorated by month, and none is due before 18 or from the year you turn 73 (Schedule U): this app doesn't handle QPP contributions at those ages yet"),
      if(line.QCU.33 > 0, line.QCU.124, line.QCU.23) + line.QCR.26)
    source: "TP-1 line 248: Schedule U, Part B line 23 (employees) or Part C line 124 (self-employed), plus Schedule R line 26"
  TP1.250:
    label: Other deductions
    formula: "line.T1.23500"
    source: "Guide, line 250, point 3 (code 03): the EI benefits, OAS pension and net federal supplements to repay, the amount on line 23500 of the federal return. No other deduction of line 250 is handled"
  TP1.254:
    label: Total deductions
    formula: >-
      line.TP1.201 + line.TP1.205 + line.TP1.207 + line.TP1.214 + line.TP1.215 + line.TP1.225 + line.TP1.231 + line.TP1.245
      + line.TP1.246 + line.TP1.248 + line.TP1.250
    source: "TP-1 line 254: lines 201 through 207, 214 through 231 and 234 through 252"
  TP1.256:
    label: Net income before adjustment
    formula: "line.TP1.199 - line.TP1.254"
    source: "TP-1 line 256: line 199 minus line 254"
  TP1.275:
    label: Net income
    formula: "max(0, line.TP1.256)"
    source: "TP-1 line 275: lines 256 and 260 (Schedule N isn't handled); 0 if negative"

  # Taxable income
  TP1.279:
    label: Net income and adjustments
    formula: "line.TP1.275"
    source: "TP-1 line 279: lines 275 through 278 (276 and 278 aren't handled)"
  TP1.289:
    label: Non-capital losses from other years
    formula: "line.T1.25200"
    source: "TP-1 line 289: the non-capital losses carried forward, as entered for the federal return"
  TP1.290:
    label: Net capital losses from other years
    formula: "min(answer.netCapitalLosses, line.TP1.139)"
    source: "TP-1 line 290: up to the taxable capital gains of the year"
  TP1.298:
    label: Total deductions from net income
    formula: "line.TP1.289 + line.TP1.290"
    source: "TP-1 line 298: lines 287 through 297"
  TP1.299:
    label: Taxable income
    formula: "max(0, line.TP1.279 - line.TP1.298)"
    source: "TP-1 line 299: line 279 minus line 298; 0 if negative"

  # Non-refundable tax credits
  TP1.350:
    label: Basic personal amount
    formula: "param.qcBasicPersonalAmount"
  TP1.361:
    label: Age amount, amount for a person living alone and amount for retirement income
    formula: 'if(line.QC.couple == 1 and person.role == "spouse", 0, line.QCB.32)'
    source: "Schedule B, lines 32 to 34: the couple's amount, claimed here on the return of the person preparing (line 33 takes off what the spouse claims). Credits one spouse can't use go to the other on line 431"
  TP1.367:
    label: Amount transferred by a child 18 or over enrolled in post-secondary studies
    formula: "answer.qcChildTransfer"
    source: "Schedule A, Part B, line 29: the amounts on line 28, from lines 20.1 and 20.2 of the child's Schedule S"
  TP1.376:
    label: Amount for a severe and prolonged impairment
    formula: "if(answer.hasDisability and person.age >= 18, param.qcImpairmentAmount, 0)"
    source: "TP-1 line 376: $4,123 at 18 or older (the same certificate as the federal disability amount)"
  TP1.377:
    label: Total of the basic and other amounts
    formula: "line.TP1.350 + line.TP1.361 + line.TP1.367 + line.TP1.376"
    source: "TP-1 line 377: lines 359 through 376 (no adjustment on line 358)"
  TP1.377_1:
    label: Credits for the basic and other amounts
    formula: "round(line.TP1.377 * param.qcCreditRate, 2)"
    source: "TP-1 line 377.1: line 377 × 14%"
  TP1.381:
    label: Medical expenses
    formula: "max(0, line.QCB.36 - line.QCB.39)"
    source: "Schedule B, Part C, line 40: medical expenses less 3% of family income"
  TP1.385:
    label: Interest paid on a student loan
    formula: "answer.studentLoanInterest"
    source: "Schedule M, line 52: interest paid in 2025 (the same amount as on federal line 31900)"
  TP1.388:
    label: Medical expenses and student loan interest
    formula: "line.TP1.381 + line.TP1.385"
    source: "TP-1 line 388: lines 378 through 385"
  TP1.389:
    label: Credits for medical expenses and student loan interest
    formula: "round(line.TP1.388 * param.qcSecondCreditRate, 2)"
    source: "TP-1 line 389: line 388 × 20%"
  QC.ownDonations:
    label: Donations on this return's receipts and Quebec slips
    formula: "answer.donations + sum(DONATION.box1) + sum(RL1.boxN) + sum(RL2.box210) + sum(RL8.boxC)"
    source: "Official receipts (uploaded, or entered), box N of the RL-1, box 210 of the RL-2 and box C of the RL-8"
  TP1.393:
    label: Donations and gifts
    formula: >-
      if(line.QC.couple == 1 and spouse.answer.claimSpouseDonations, 0, line.QC.ownDonations)
      + if(family.partnerInYear and answer.claimSpouseDonations and line.HH.partner == 1,
      if(line.QC.couple == 1, spouse.line.QC.ownDonations, spouse.line.OWN.donations), 0)
    source: >-
      Work Chart 395, line 1: monetary donations made in 2025. Whoever claims both spouses' donations on the federal
      return claims them here too. A spouse outside Quebec has no TP-1 to claim on: their receipts are the ones on
      their federal return, and yours stay on yours
  TP1.395:
    label: Tax credits for donations and gifts
    formula: >-
      round(min(line.TP1.393, param.qcDonationLowLimit) * param.qcDonationLowRate, 2)
      + round(min(max(0, line.TP1.393 - param.qcDonationLowLimit), max(0, line.TP1.299 - param.qcDonationTopThreshold)) * param.qcDonationTopRate, 2)
      + round(max(0, max(0, line.TP1.393 - param.qcDonationLowLimit) - max(0, line.TP1.299 - param.qcDonationTopThreshold)) * param.qcDonationHighRate, 2)
    source: "Work Chart 395, lines 2 to 12: 20% of the first $200; 25.75% of the rest up to taxable income over $129,590; 24% of what remains"
  TP1.397_1:
    label: Union, professional or other dues
    formula: "sum(RL1.boxF)"
    source: "TP-1 line 397.1: box F of the RL-1 slip"
  TP1.397:
    label: Tax credit for union, professional or other dues
    formula: "round(line.TP1.397_1 * param.qcDuesRate, 2)"
    source: "TP-1 line 397: line 397.1 × 10%"
  TP1.398:
    label: Tax credit for tuition or examination fees
    formula: "min(line.QCT.45, max(0, line.TP1.401 - line.TP1.377_1 - line.TP1.389 - line.TP1.395 - line.TP1.397))"
    source: "Schedule T, line 46: the credit, claimed up to the tax the other credits leave (the rest is carried forward, line 48)"
  TP1.398_1:
    label: Tax credit for tuition or examination fees transferred by a child
    formula: "answer.qcChildTuitionTransfer"
    source: "Schedule A, Part D, line 70: line 68 of the child's Schedule T"
  TP1.399:
    label: Non-refundable tax credits
    formula: "line.TP1.377_1 + line.TP1.389 + line.TP1.395 + line.TP1.397 + line.TP1.398 + line.TP1.398_1"
    source: "TP-1 line 399: lines 377.1, 389 through 392, 395 through 397, 398 and 398.1"

  # Income tax
  TP1.401:
    label: Income tax on taxable income
    formula: "round(bracket(param.qcTaxBrackets, line.TP1.299), 2)"
    source: "Work Chart 401"
  TP1.406:
    label: Non-refundable tax credits
    formula: "line.TP1.399"
  TP1.413:
    label: Tax after non-refundable credits
    formula: "line.TP1.401 - line.TP1.406"
    source: "TP-1 line 413: line 401 minus line 406 (negative when the credits are more than the tax)"
  TP1.414:
    label: Tax credit for contributions to authorized Quebec municipal political parties
    formula: >-
      round(min(answer.qcMunicipalPoliticalContributions, param.qcPoliticalFirst) * param.qcPoliticalFirstRate, 2)
      + round(max(0, min(answer.qcMunicipalPoliticalContributions, param.qcPoliticalMax) - param.qcPoliticalFirst) * param.qcPoliticalRate, 2)
    source: "Work Chart 414: contributions to authorized Quebec municipal parties and candidates, 85% of the first $50 and 75% of the rest, of up to $200 (at most $155). A contribution to a provincial party gets no credit"
  TP1.415:
    label: Dividend tax credit
    formula: "sum(RL3.boxC) + sum(RL16.boxJ)"
    source: "TP-1 line 415: box C of the RL-3 slip and box J of the RL-16 slip"
  TP1.425:
    label: Political contribution and dividend credits
    formula: "line.TP1.414 + line.TP1.415"
    source: "TP-1 line 425: lines 414 through 424"
  TP1.430:
    label: Tax after credits
    formula: "line.TP1.413 - line.TP1.425"
    source: "TP-1 line 430: line 413 minus line 425; a negative amount can go to your spouse (line 431)"
  TP1.431:
    label: Credits transferred from one spouse to the other
    formula: >-
      if(line.QC.couple == 1, if(line.TP1.430 < 0, line.TP1.430,
      if(spouse.line.TP1.430 < 0, min(line.TP1.430, -spouse.line.TP1.430), 0)), 0)
    source: "Guide, line 431: a spouse with a negative line 430 carries it to line 431 (432 is then 0); the other spouse takes it off their tax, here as a positive amount, up to their line 430"
  TP1.432:
    label: Income tax
    formula: "max(0, line.TP1.430 - line.TP1.431)"
    source: "TP-1 line 432: line 430 minus line 431; 0 if negative"

  # Income tax and contributions
  TP1.439:
    label: QPIP premium on income from self-employment
    formula: "line.QCR.24"
    source: "Schedule R, line 24"
  TP1.441:
    label: Advance payments of tax credits
    formula: "sum(RL19.boxA) + sum(RL19.boxB) + sum(RL19.boxC) + sum(RL19.boxD) + sum(RL19.boxG) + sum(RL19.boxH)"
    source: "TP-1 line 441: boxes A, B, C, D, G and H of the RL-19 slip"
  TP1.445:
    label: QPP contribution on income from self-employment
    formula: "if(line.QCU.33 > 0, line.QCU.99, 0)"
    source: "Schedule U, line 99"
  TP1.446:
    label: Contribution to the health services fund
    formula: >-
      if(line.QCF.70 <= param.hsfThreshold, 0, if(line.QCF.70 <= param.hsfSecondThreshold,
      min(param.hsfFirstMax, round((line.QCF.70 - param.hsfThreshold) * param.hsfRate, 2)),
      min(param.hsfMax, param.hsfFirstMax + round((line.QCF.70 - param.hsfSecondThreshold) * param.hsfRate, 2))))
    source: "Schedule F, Part B: 1% of income over $18,130 (at most $150), or $150 plus 1% over $63,060 (at most $1,000)"
  TP1.449:
    label: Prescription drug insurance exemption code (box 449)
    formula: >-
      if(line.QCK.62 >= 12, 14, if(line.HH.partner == 0 and line.TP1.275 <= param.drugIncomeSingle, 32,
      if(line.HH.partner == 1 and line.QC.family <= param.drugIncomeCouple, 34, 0)))
    source: "Schedule K, situations 14 (a group plan all year), 32 (no spouse and line 275 of $19,890 or less) and 34 (family income of $32,240 or less); 0 when the premium is payable"
  TP1.447:
    label: Premium payable under the Quebec prescription drug insurance plan
    formula: "if(line.TP1.449 > 0, 0, line.QCK.90)"
    source: "Schedule K, line 98 (lines 91 to 97, paying your spouse's premium, aren't used: each spouse pays their own)"
  TP1.450:
    label: Income tax and contributions
    formula: "line.TP1.432 + line.TP1.439 + line.TP1.441 + line.TP1.445 + line.TP1.446 + line.TP1.447"
    source: "TP-1 line 450: lines 432 through 447"

  # Refund or balance due
  TP1.451:
    label: Quebec income tax withheld at source
    formula: "sum(RL1.boxE) + sum(RL2.boxJ) + sum(RL6.boxG)"
    source: "Guide, line 451: box E of the RL-1, box J of the RL-2 and box G of the RL-6"
  TP1.451_1:
    label: Withholding transferred to your spouse with retirement income
    formula: "line.QCQ.58"
    source: "Schedule Q, line 58"
  TP1.451_2:
    label: Quebec income tax withheld, less the part transferred
    formula: "line.TP1.451 - line.TP1.451_1"
    source: "TP-1 line 451.2: line 451 minus line 451.1"
  TP1.451_3:
    label: Quebec income tax withholding transferred by your spouse
    formula: "if(line.QC.couple == 1, spouse.line.TP1.451_1, 0)"
    source: "TP-1 line 451.3: line 58 of your spouse's Schedule Q"
  TP1.452:
    label: QPP overpayment
    formula: >-
      if(line.QCU.33 > 0, max(0, line.TP1.98 + line.TP1.98_2 - param.qppMaxEmployeeTotal),
      max(0, line.TP1.98 + line.TP1.98_2 - round(line.QCU.14_4 * param.qppEmployeeRate, 2) - line.QCU.21))
    source: "Guide, line 452: the contributions deducted (lines 98 and 98.2 together) less all those required on the pensionable salary (Schedule U lines 17.2 and 21), so an over-deducted base contribution pays a second additional contribution no employer deducted; with self-employment, the part over $4,735.20"
  TP1.453:
    label: Income tax paid in instalments
    formula: "answer.qcInstalmentsPaid"
  TP1.455:
    label: Tax credit for childcare expenses
    formula: "if(line.QCC.claims == 1, line.QCC.94, 0)"
    source: "Schedule C, line 98: the couple's credit, claimed here on the return of the spouse who paid more of the expenses (line 96 is then the other's 0)"
  TP1.456:
    label: Tax credits respecting the work premium
    formula: "line.QCP.90"
    source: "Schedule P, line 90"
  TP1.457:
    label: QPIP overpayment
    formula: >-
      if(line.QCR.14 + line.QCR.12 < param.qpipMinimum, line.TP1.97,
      max(0, line.TP1.97 - min(param.qpipMaxEmployee, round(min(line.QCR.14, param.qpipMaxInsurable) * param.qpipEmployeeRate, 2))))
    source: "Guide, line 457: the premiums deducted (line 97) less 0.494% of the insurable salary up to $98,000; all of line 97 when employment and business income are less than $2,000"
  TP1.458:
    label: Tax credit for home-support services for seniors
    formula: "line.QCJ.90"
    source: "Schedule J, line 90"
  TP1.462:
    label: Other credits
    formula: "line.QCB.50 + line.QC.childActivities"
    source: "TP-1 line 462: point 1, the refundable tax credit for medical expenses (Schedule B, Part D), and point 25, the tax credit for children's activities"
  TP1.463:
    label: Senior assistance tax credit
    formula: "line.QC.seniorAssistance"
    source: "Guide, line 463"
  TP1.465:
    label: Income tax paid and other credits
    formula: >-
      line.TP1.451_2 + line.TP1.451_3 + line.TP1.452 + line.TP1.453 + line.TP1.455 + line.TP1.456 + line.TP1.457 + line.TP1.458
      + line.TP1.462 + line.TP1.463
    source: "TP-1 line 465: lines 451.2 through 463"
  TP1.468:
    label: Total payments and credits
    formula: "line.TP1.465"
    source: "TP-1 line 468: lines 465 and 466 (line 466 isn't handled)"
  TP1.470:
    label: Income tax and contributions less payments and credits
    formula: "line.TP1.450 - line.TP1.468 + line.QCD.check"
    source: "TP-1 line 470: line 450 minus line 468"
  TP1.474:
    label: Refund
    formula: "max(0, -line.TP1.470)"
    source: "TP-1 line 474: line 470 if negative"
  TP1.475:
    label: Balance due
    formula: "max(0, line.TP1.470)"
    source: "TP-1 line 475: line 470 if positive"
  TP1.478:
    label: Quebec refund
    formula: 'if(person.province == "QC", if(line.TP1.474 < param.qcRefundMinimum, 0, line.TP1.474), 0)'
    source: "TP-1 line 478: line 474 (no refund is transferred to your spouse here, line 476). Only a Quebec resident files a TP-1"
  TP1.479:
    label: Quebec balance due
    formula: 'if(person.province == "QC", if(line.TP1.475 < param.qcRefundMinimum, 0, line.TP1.475), 0)'
    source: "TP-1 line 479: line 475 (no amount is transferred by your spouse here, line 477). Only a Quebec resident files a TP-1"
