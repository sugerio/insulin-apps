name: Release

# Every green push to main is a release of the whole repository: the next version,
# v0.1.1 then v0.1.2 and so on, is tagged on that push's commit and published as a
# GitHub Release listing what was merged. All apps share the one version (see the
# README's Releases).
#
# A push is green when every workflow run it started passed: CI, the workflow of each
# app it touched and Gateway. Those workflows only check a push; nothing deploys until
# it is a release. Then the `deploy` job deploys it (deploy-release.yml): what changed,
# then the gateway, built from its tag, so production always runs a release. .github/scripts/plan-release.sh
# numbers every push to main since the latest release, oldest first: a green push
# gets the next version, one with a failed or cancelled run gets none, and one with a
# run still going stops the plan, so a later run numbers it and what follows. So no
# push is skipped or numbered out of order, even when GitHub drops a queued run of
# this workflow (it keeps one at a time) or the runs finish out of order. An hourly
# run picks up after one that failed. When one run numbers several pushes, it deploys
# the newest with everything their pushes changed. A deploy that fails leaves its
# release in place: re-run the failed jobs, or run Deploy by hand with the version
# (deploy.yml, which shares this workflow's concurrency group).
#
# This workflow starts whenever one of the workflows a push to main runs completes,
# so `workflows` below must name every workflow with a push trigger;
# check-app-workflows.mjs checks that it does.
#
# To move to a new minor or major version, an org admin runs this workflow by hand
# with it, such as v0.2.0. It first numbers any pushes still waiting, then releases
# main's latest release again as that version, and the next pushes count on from it.
#
# Only this workflow creates v* tags. The "Release tags" ruleset lets nobody else
# create, move or delete one (org admins can bypass it), except the deploy key the
# `publish` job tags with. That key is a secret of the `release` environment, which
# only main can use, so a workflow changed on a branch can't read it, and a v* tag is
# always a commit this workflow numbered on main. `plan` works out what to release
# without the key; `publish` runs only when there's something to release.
# .github/scripts/configure-release-tags.sh sets up the environment, key and ruleset.
on:
  workflow_run:
    workflows: [CI, Gateway, captable, esign]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: A new minor or major version, such as v0.2.0
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
      deploy-version: ${{ steps.plan.outputs.deploy-version }}
      deploy-apps: ${{ steps.plan.outputs.deploy-apps }}
      deploy-gateway: ${{ steps.plan.outputs.deploy-gateway }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Number each green push to main since the latest release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: bash .github/scripts/plan-release.sh

  publish:
    needs: plan
    if: needs.plan.outputs.releases != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      # Without the key, checkout would fall back to this job's token, which mustn't tag.
      - name: Check for the deploy key
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ]; then
            echo "::error::The release environment has no RELEASE_DEPLOY_KEY. An org admin runs .github/scripts/configure-release-tags.sh once (see the hosting runbook); the next run then tags every waiting version."
            exit 1
          fi
      # Checks out with the deploy key, which then pushes the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          sparse-checkout: .github
      - name: Tag and publish each planned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASES: ${{ needs.plan.outputs.releases }}
        run: |
          set -euo pipefail
          while read -r version sha previous workflows <&3; do
            [ -n "$version" ] || continue
            # A tag already on the same commit counts, so a retried run never tags twice.
            git fetch -q --depth=1 origin "$sha"
            if ! git push -q origin "$sha:refs/tags/$version"; then
              # The commit the tag names, through the tag object for an annotated tag.
              tagged=$(git ls-remote origin "refs/tags/$version" "refs/tags/$version^{}" \
                | awk '{ sha = $1 } $2 ~ /\^\{\}$/ { peeled = $1 } END { print peeled ? peeled : sha }')
              if [ "$tagged" != "$sha" ]; then
                echo "::error::Couldn't tag $sha as $version."
                exit 1
              fi
            fi
            # The release must be this workflow's, so one another author published is
            # replaced. (gh api prints an error's body, so read the release only when
            # the call succeeds.)
            id="" author=""
            if release=$(gh api "repos/$GH_REPO/releases/tags/$version" --jq '"\(.id) \(.author.login)"' 2>/dev/null); then
              read -r id author <<<"$release"
            fi
            if [ "$author" != "github-actions[bot]" ]; then
              if [ -n "$id" ]; then
                echo "::warning::Replacing $version's release, which ${author} published."
                gh api --method DELETE "repos/$GH_REPO/releases/$id"
              fi
              # What the push ran, then what was merged since the version before.
              ran=""
              [ "$workflows" = - ] || ran="Workflows that passed on this push to main: $workflows."
              if [ "$previous" = - ]; then
                notes=(--notes "The first numbered release of insulin-apps.${ran:+ $ran}")
              else
                notes=(--generate-notes --notes-start-tag "$previous")
                [ -z "$ran" ] || notes+=(--notes "$ran")
              fi
              gh release create "$version" --verify-tag --title "$version" "${notes[@]}"
            fi
            echo "Released $version at $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          done 3<<<"$RELEASES"

  # The newest release just published, built from its tag: what its pushes changed, then the gateway.
  deploy:
    needs: [plan, publish]
    if: needs.plan.outputs.deploy-version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-release.yml
    with:
      version: ${{ needs.plan.outputs.deploy-version }}
      apps: ${{ needs.plan.outputs.deploy-apps }}
      gateway: ${{ needs.plan.outputs.deploy-gateway == 'true' }}
    secrets: inherit
