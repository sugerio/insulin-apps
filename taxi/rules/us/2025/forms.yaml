      # Part III: the care credit, which can't take the tax below the tentative minimum tax.
      p2:1: { value: line.F540.35, when: "line.F3506.12 > 0" }
      p2:2: { value: line.SP.24, when: "line.F3506.12 > 0" }
      3C: { value: line.SP.excess, when: "line.F3506.12 > 0", zero: true }
      5A: line.F3506.12
      5B: line.F540.40
      5C: { value: "line.SP.excess - line.F540.40", when: "line.F3506.12 > 0", zero: true }

  F3506:
