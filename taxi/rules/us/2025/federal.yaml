lines:
  # Filing status. Unmarried on December 31 (never married, divorced, legally separated under a decree, or widowed
  # before 2025) files Single. A married couple chooses (family.filingStatus): one joint return, on the person
  # preparing's, with the spouse's income on it; or a separate return each. Each `if` leaves the status missing, and
  # asks nothing that depends on it, until it is known. A dependant makes head of household or a qualifying surviving
  # spouse possible: those come with dependants (SCOPE.dependants).
  US.single:
    label: Filing status is Single (1 for yes)
    formula: 'if(family.maritalStatus == "married", 0, if(line.US.qss == 1, 0, if(line.US.hoh == 1, 0, 1)))'
    source: "Instructions, Filing Status"
  US.hoh:
    label: Filing status is Head of household (1 for yes)
    formula: >-
      if(family.maritalStatus == "married", 0, if(line.US.qss == 1, 0, if(line.US.claimsDependants == 0, 0,
      if(sum(dependants.DEP.hohQualifying) == 0, 0, if(answer.paidHalfOfHome, 1, 0)))))
    source: "Instructions, Head of Household: unmarried, paid over half the cost of keeping up a home, with a qualifying person; it is never worse than Single"
  US.qss:
    label: Filing status is Qualifying surviving spouse (1 for yes)
    formula: >-
      if(family.maritalStatus == "widowed", if(answer.spouseDiedIn2025, 0, if(answer.spouseDiedIn2023Or2024,
      if(line.US.claimsDependants == 0, 0, if(sum(dependants.DEP.qssChild) == 0, 0, if(answer.paidHalfOfHome, 1, 0))), 0)), 0)
    source: "Instructions, Qualifying Surviving Spouse: spouse died in 2023 or 2024, a dependent child who lived with you all year, and you paid over half the cost of the home"
  US.jointRates:
    label: Joint return rates, Married filing jointly or Qualifying surviving spouse (1 for yes)
    formula: "if(line.US.joint == 1, 1, line.US.qss)"
  US.joint:
    label: Filing status is Married filing jointly (1 for yes)
    formula: 'if(family.maritalStatus == "married", if(family.filingStatus == "joint", 1, 0), 0)'
  US.separate:
    label: Filing status is Married filing separately (1 for yes)
    formula: 'if(family.maritalStatus == "married", if(family.filingStatus == "separate", 1, 0), 0)'

  # Each person's own amounts. A joint return adds the spouse's (`spouse.line.US.own…`); a separate one doesn't.
  US.ownWages:
    label: Wages on this person's Forms W-2, box 1
    formula: "sum(W2.box1)"
  US.ownTaxableInterest:
    label: This person's taxable interest, Forms 1099-INT boxes 1 and 3
    formula: "sum(INT.box1) + sum(INT.box3)"
  US.ownExemptInterest:
    label: This person's tax-exempt interest, Forms 1099-INT box 8
    formula: "sum(INT.box8)"
  US.ownMedicareWages:
    label: This person's Medicare wages and tips, Forms W-2 box 5
    formula: "sum(W2.box5)"
  US.ownMedicareTax:
    label: This person's Medicare tax withheld, Forms W-2 box 6
    formula: "sum(W2.box6)"
  US.ownWithheldW2:
    label: Federal income tax withheld on this person's Forms W-2
    formula: "sum(W2.box2)"
  US.ownWithheld1099:
    label: Federal income tax withheld on this person's Forms 1099
    formula: "sum(INT.box4)"
  US.ownEstimated:
    label: This person's estimated tax payments
    formula: "answer.estimatedPayments"
  US.ownBoxes:
    label: This person's boxes on line 12d (born before January 2, 1961; blind)
    formula: "if(person.age >= 65, 1, 0) + if(answer.isBlind, 1, 0)"
    source: >-
      Form 1040, line 12d. Someone born on January 1, 1961 counts as 65 for 2025; the app knows the birth year only and
      counts them as 64. On a separate return the spouse's boxes, which count only when the spouse had no income and
      files no return, aren't counted
  US.ownExcessSocialSecurity:
    label: Social security tax withheld on this person's wages over the 2025 maximum
    formula: >-
      if(max(W2.box4) > param.socialSecurityMax,
      unsupported("An employer withheld more social security tax than the 2025 maximum of $10,918.20; ask it to refund the excess"),
      if(countIssuers(W2.box4) > 1, max(0, sum(W2.box4) - param.socialSecurityMax), 0))
    source: "Instructions, Schedule 3, line 11: with more than one employer, the tax withheld over $10,918.20, figured separately for you and your spouse"

  # Income
  F1040.1a:
    label: Wages from Forms W-2, box 1
    formula: "line.US.ownWages + if(line.US.joint == 1, spouse.line.US.ownWages, 0)"
  F1040.1z:
    label: Wages and other earned income
    formula: "line.F1040.1a"
  F1040.2a:
    label: Tax-exempt interest
    formula: "line.US.ownExemptInterest + if(line.US.joint == 1, spouse.line.US.ownExemptInterest, 0)"
    source: "Form 1040, line 2a: Form 1099-INT, box 8. It isn't taxed; it is reported"
  F1040.2b:
    label: Taxable interest
    formula: "line.US.ownTaxableInterest + if(line.US.joint == 1, spouse.line.US.ownTaxableInterest, 0)"
    source: "Form 1040, line 2b: Form 1099-INT, boxes 1 and 3 (savings bond and Treasury interest is taxed federally)"
  F1040.9:
    label: Total income
    formula: "line.F1040.1z + line.F1040.2b"
  F1040.11a:
    label: Adjusted gross income
    formula: "line.F1040.9"
    source: "Form 1040, line 11a: line 9 less line 10; no adjustment from Schedule 1 is worked out yet"

  # Standard deduction
  US.boxes:
    label: Boxes checked on line 12d
    formula: "line.US.ownBoxes + if(line.US.joint == 1, spouse.line.US.ownBoxes, 0)"
  US.claimable:
    label: Someone can claim you, or your spouse on a joint return, as a dependent (1 for yes)
    formula: "if(answer.canBeClaimed, 1, if(line.US.joint == 1, if(spouse.answer.canBeClaimed, 1, 0), 0))"
    source: "Form 1040, line 12a"
  US.basicStandard:
    label: Standard deduction for the filing status
    formula: "if(line.US.jointRates == 1, param.standardJoint, if(line.US.hoh == 1, param.standardHead, if(line.US.single == 1, param.standardSingle, param.standardSeparate)))"
  US.dependentStandard:
    label: Standard deduction for someone who can be claimed as a dependent, before line 12d's boxes
    formula: "min(line.US.basicStandard, max(param.dependentMinimum, line.F1040.1z + param.dependentEarnedAdd))"
    source: "Instructions, Standard Deduction Worksheet for Dependents, lines 2 to 4"
  US.standard:
    label: Standard deduction with line 12d's boxes
    formula: >-
      if(line.US.claimable == 1, line.US.dependentStandard, line.US.basicStandard)
      + line.US.boxes * if(line.US.single == 1 or line.US.hoh == 1, param.additionalUnmarried, param.additionalMarried)
  # `if`, not `and`: until the filing status is known, a separate return's question isn't asked.
  F1040.12e:
    label: Standard deduction
    formula: >-
      if(line.US.separate == 1, if(answer.spouseItemizes,
      unsupported("Your spouse itemizes, so you must itemize too (Schedule A); this app doesn't itemize deductions yet"),
      line.US.standard), line.US.standard)

  # Schedule 1-A, Part V: the enhanced deduction for seniors, for each spouse 65 or older on a joint return. A married
  # person filing separately can't claim it.
  S1A.3:
    label: Modified adjusted gross income
    formula: "line.F1040.11a"
    source: "Schedule 1-A, line 3: line 11b, plus income excluded from Puerto Rico or abroad (not handled)"
  S1A.32:
    label: Modified AGI over which the deduction is reduced
    formula: "if(line.US.joint == 1, param.seniorPhaseOutStartJoint, param.seniorPhaseOutStart)"
  S1A.35:
    label: Enhanced deduction for seniors, after the reduction
    formula: "max(0, param.seniorAmount - round(max(0, line.S1A.3 - line.S1A.32) * param.seniorPhaseOutRate, 2))"
    source: "Schedule 1-A, lines 31 to 35"
  S1A.37:
    label: Enhanced deduction for seniors
    formula: >-
      if(line.US.separate == 1, 0, if(person.age >= 65, line.S1A.35, 0)
      + if(line.US.joint == 1, if(spouse.person.age >= 65, line.S1A.35, 0), 0))
    source: "Schedule 1-A, lines 36a and 36b: you, and your spouse on a joint return, born before January 2, 1961, with a valid social security number"
  F1040.13b:
    label: Additional deductions from Schedule 1-A
    formula: "line.S1A.37"
    source: "Schedule 1-A, line 38; the deductions for tips, overtime and car loan interest aren't worked out yet (SCOPE.tips)"
  F1040.14:
    label: Total deductions
    formula: "line.F1040.12e + line.F1040.13b"
  F1040.15:
    label: Taxable income
    formula: "max(0, line.F1040.11a - line.F1040.14)"

  # Tax
  US.tableRow:
    label: The middle of the Tax Table's row for line 15
    formula: >-
      if(line.F1040.15 < 5, 2.5, if(line.F1040.15 < 15, 10, if(line.F1040.15 < 25, 20,
      if(line.F1040.15 < 3000, floor(line.F1040.15, 25) + 12.5, floor(line.F1040.15, 50) + 25))))
    source: >-
      2025 Tax Table: rows of $5, $10 and $10, then $25 wide to $3,000 and $50 wide to $100,000. Each row's tax is the
      tax on the middle of the row, to the nearest dollar ($3,000 to $3,050: $303)
  US.tableTax:
    label: Tax from the Tax Table
    formula: >-
      round(if(line.US.jointRates == 1, bracket(param.bracketsJoint, line.US.tableRow), if(line.US.hoh == 1, bracket(param.bracketsHead, line.US.tableRow),
      if(line.US.single == 1, bracket(param.bracketsSingle, line.US.tableRow), bracket(param.bracketsSeparate, line.US.tableRow)))), 0)
  US.worksheetTax:
    label: Tax from the Tax Computation Worksheet
    formula: >-
      round(if(line.US.jointRates == 1, bracket(param.bracketsJoint, line.F1040.15), if(line.US.hoh == 1, bracket(param.bracketsHead, line.F1040.15),
      if(line.US.single == 1, bracket(param.bracketsSingle, line.F1040.15), bracket(param.bracketsSeparate, line.F1040.15)))), 2)
  F1040.16:
    label: Tax
    formula: "if(line.F1040.15 < param.taxTableLimit, line.US.tableTax, line.US.worksheetTax)"
    source: >-
      Instructions, line 16: the Tax Table under $100,000, the Tax Computation Worksheet from $100,000. Line 17 (the
      alternative minimum tax, Schedule 2 line 3) is 0 here: with only wages, interest and the standard deduction, the
      tentative minimum tax of Form 6251 stays below this tax
  F1040.18:
    label: Tax and the alternative minimum tax
    formula: "line.F1040.16"
  F1040.19:
    label: Child tax credit and credit for other dependents
    formula: "line.S8812.14"
    source: "Schedule 8812, line 14"
  F1040.21:
    label: Total nonrefundable credits
    formula: "line.F1040.19"
    source: "Form 1040, lines 19 and 20; no credit on Schedule 3 is worked out yet"
  F1040.22:
    label: Tax after nonrefundable credits
    formula: "max(0, line.F1040.18 - line.F1040.21)"

  # Schedule 2: other taxes
  F8959.1:
    label: Medicare wages and tips
    formula: "line.US.ownMedicareWages + if(line.US.joint == 1, spouse.line.US.ownMedicareWages, 0)"
    source: "Form 8959, line 1: Form W-2, box 5 (both spouses' on a joint return)"
  F8959.5:
    label: Threshold for Additional Medicare Tax
    formula: "if(line.US.joint == 1, param.medicareThresholdJoint, if(line.US.separate == 1, param.medicareThresholdSeparate, param.medicareThresholdSingle))"
    source: "Instructions, Schedule 2, line 11: $200,000 for single, head of household or qualifying surviving spouse"
  F8959.7:
    label: Additional Medicare Tax on Medicare wages
    formula: "round(max(0, line.F8959.1 - line.F8959.5) * param.additionalMedicareRate, 2)"
    source: "Form 8959, lines 4 to 7"
  F8960.13:
    label: Modified adjusted gross income
    formula: "line.F1040.11a"
  F8960.14:
    label: Threshold for the net investment income tax
    formula: "if(line.US.jointRates == 1, param.niitThresholdJoint, if(line.US.separate == 1, param.niitThresholdSeparate, param.niitThresholdSingle))"
    source: "Instructions, Schedule 2, line 12: $250,000 married filing jointly or qualifying surviving spouse; $200,000 single or head of household"
  F8960.17:
    label: Net investment income tax
    formula: "round(min(line.F1040.2b, max(0, line.F8960.13 - line.F8960.14)) * param.niitRate, 2)"
    source: "Form 8960, lines 8 and 13 to 17: the smaller of the net investment income (here, taxable interest) and the MAGI over the threshold, times 3.8%"
  S2.21:
    label: Total other taxes
    formula: "line.F8959.7 + line.F8960.17"
    source: "Schedule 2, line 21: lines 11 (Form 8959) and 12 (Form 8960)"
  F1040.23:
    label: Other taxes
    formula: "line.S2.21"
  F1040.24:
    label: Total tax
    formula: "line.F1040.22 + line.F1040.23 + line.SCOPE.return"

  # Payments
  F1040.25a:
    label: Federal income tax withheld on Forms W-2
    formula: "line.US.ownWithheldW2 + if(line.US.joint == 1, spouse.line.US.ownWithheldW2, 0)"
  F1040.25b:
    label: Federal income tax withheld on Forms 1099
    formula: "line.US.ownWithheld1099 + if(line.US.joint == 1, spouse.line.US.ownWithheld1099, 0)"
  F8959.19:
    label: Medicare tax withheld
    formula: "line.US.ownMedicareTax + if(line.US.joint == 1, spouse.line.US.ownMedicareTax, 0)"
  F8959.21:
    label: Regular Medicare tax withholding on Medicare wages
    formula: "round(line.F8959.1 * param.medicareRate, 2)"
  F8959.24:
    label: Additional Medicare Tax withheld
    formula: "max(0, line.F8959.19 - line.F8959.21)"
    source: "Form 8959, lines 19 to 24: what box 6 holds above 1.45% of box 5"
  F1040.25c:
    label: Federal income tax withheld on other forms
    formula: "line.F8959.24"
    source: "Instructions, line 25c: the Additional Medicare Tax withheld, Form 8959 line 24"
  F1040.25d:
    label: Federal income tax withheld
    formula: "line.F1040.25a + line.F1040.25b + line.F1040.25c"
  F1040.26:
    label: Estimated tax payments
    formula: "line.US.ownEstimated + if(line.US.joint == 1, spouse.line.US.ownEstimated, 0)"
  S3.11:
    label: Excess social security tax withheld
    formula: "line.US.ownExcessSocialSecurity + if(line.US.joint == 1, spouse.line.US.ownExcessSocialSecurity, 0)"
    source: "Instructions, Schedule 3, line 11: figured separately for you and your spouse, then added"
  F1040.28:
    label: Additional child tax credit
    formula: "line.S8812.27"
  F1040.31:
    label: Credits and payments from Schedule 3
    formula: "line.S3.11"
  F1040.32:
    label: Other payments and refundable credits
    formula: "line.F1040.28 + line.F1040.31"
    source: "Form 1040, line 32: lines 27a (not worked out yet), 28 and 31"
  F1040.33:
    label: Total payments
    formula: "line.F1040.25d + line.F1040.26 + line.F1040.32"
  F1040.34:
    label: Refund
    formula: "max(0, line.F1040.33 - line.F1040.24)"
    source: "Form 1040, line 34: the amount you overpaid"
  F1040.37:
    label: Amount you owe
    formula: "max(0, line.F1040.24 - line.F1040.33)"
  RESULT.net:
    label: Refund, less the amount owed
    formula: "line.F1040.34 - line.F1040.37"

  # What this part of the app doesn't prepare: each one says so on the return instead of giving a wrong amount.
  SCOPE.return:
    label: Situations this app doesn't handle yet
    formula: >-
      line.SCOPE.residency + line.SCOPE.widowed + line.SCOPE.tips + line.SCOPE.kiddie + line.SCOPE.eic + line.SCOPE.actc
  SCOPE.residency:
    label: A nonresident or dual-status alien
    formula: >-
      if(person.residentAllYear, 0, unsupported("A nonresident or dual-status alien files Form 1040-NR or a dual-status return, which this app doesn't prepare"))
      + if(line.US.joint == 1, if(spouse.person.residentAllYear, 0,
      unsupported("Your spouse wasn't a U.S. citizen or resident alien all year: filing jointly then takes an election to treat them as a resident, which this app doesn't handle")), 0)
  SCOPE.widowed:
    label: A spouse who died in 2025
    formula: 'if(family.maritalStatus == "widowed", if(answer.spouseDiedIn2025, unsupported("Your spouse died in 2025, so you can file jointly for 2025; this app doesn''t prepare that return yet"), 0), 0)'
  SCOPE.tips:
    label: Tips and overtime pay
    formula: >-
      if(answer.hasTipsOrOvertime, unsupported("The 2025 deductions for tips and overtime pay (Schedule 1-A) aren't worked out by this app yet"), 0)
      + if(line.US.joint == 1, if(spouse.answer.hasTipsOrOvertime,
      unsupported("Your spouse's tips or overtime pay: the 2025 deductions for them (Schedule 1-A) aren't worked out by this app yet"), 0), 0)
  SCOPE.kiddie:
    label: A child's interest taxed at the parent's rate
    formula: 'if(line.US.joint == 1, 0, if(person.age < 24 and line.F1040.2b > param.kiddieThreshold, unsupported("Interest over $2,700 for someone under 24 may be taxed on Form 8615 (the kiddie tax), which this app doesn''t prepare"), 0))'
    source: "Instructions, line 16, Form 8615: not for someone filing a joint return"
  US.eicAge:
    label: People on the return 25 to 64 at the end of 2025
    formula: "if(person.age >= 25 and person.age < 65, 1, 0) + if(line.US.joint == 1, if(spouse.person.age >= 25 and spouse.person.age < 65, 1, 0), 0)"
  US.eicChildren:
    label: Qualifying children for the earned income credit, as far as this app checks
    formula: "if(line.US.claimsDependants == 0, 0, sum(dependants.DEP.eicChild))"
  US.eicLimit:
    label: AGI below which the earned income credit may apply
    formula: >-
      if(line.US.eicChildren == 0, if(line.US.joint == 1, param.eicNoChildLimitJoint, param.eicNoChildLimit),
      if(line.US.eicChildren == 1, if(line.US.joint == 1, param.eicLimitOneChildJoint, param.eicLimitOneChild),
      if(line.US.eicChildren == 2, if(line.US.joint == 1, param.eicLimitTwoChildrenJoint, param.eicLimitTwoChildren),
      if(line.US.joint == 1, param.eicLimitThreeChildrenJoint, param.eicLimitThreeChildren))))
  SCOPE.eic:
    label: The earned income credit
    formula: >-
      if(line.US.separate == 1, 0, if((line.US.eicChildren > 0 or (line.US.claimable == 0 and line.US.eicAge > 0)) and line.F1040.1z > 0
      and line.F1040.11a < line.US.eicLimit and line.F1040.2a + line.F1040.2b <= param.eicInvestmentLimit,
      unsupported("You may get the earned income credit, which this app doesn't work out yet (Form 1040, line 27a)"), 0))
