# The CRA forms a return is printed on, and what goes in each row. A row is the number printed at the right of its box
# (or the line code of a box without one); form-layout.yaml says where it is on the CRA's print PDF. Each amount is a
# formula from the return's side, like a line's. A zero or a missing amount is left blank, as the CRA asks ("complete
# only the lines that apply to you"). Rows the app has nothing for (a pension, a foreign tax credit) are left out.
#
# A bracket table fills, in the column of the bracket the amount falls in, the amount, the amount over the column's
# floor, that times the rate, and that plus the printed base; its parts are the printed tables, in bracket order.
#
# The PDFs come from canada.ca on first use (url) and must match the layout's SHA-256: a form the CRA changes is
# measured again with npm run form-layout before it is filled.

forms:
  T1:
    title: T1 Income Tax and Benefit Return
    url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.pdf
