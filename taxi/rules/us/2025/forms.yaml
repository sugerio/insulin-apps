        "11": { box: "11" }
        16a: { box: "16", if: { box: "15", is: [NY] } }
        17a: { box: "17", if: { box: "15", is: [NY] } }
        15b: { box: "15", if: { box: "15", is: [NY], not: true } }
        16b: { box: "16", if: { box: "15", is: [NY], not: true } }
        17b: { box: "17", if: { box: "15", is: [NY], not: true } }
        18a: { box: "18" }
        19a: { box: "19" }
        20a: { box: "20" }

  # Form IT-1099-R: a record for each Form 1099-R with New York State tax withheld (three on a form). Its boxes are
  # numbered its own way: 12a is the state tax withheld (the 1099-R's box 14), 14 the state distribution (16), 15a the
  # local tax (17), the locality (18) and 17a the local distribution (19).
  IT1099R:
    title: Form IT-1099-R, Summary of Federal Form 1099-R Statements
