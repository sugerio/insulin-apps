    french: { title: "Annexe U, Cotisation et déduction relatives au Régime de rentes du Québec (Revenu Québec)", url: https://www.revenuquebec.ca/documents/fr/formulaires/tp/2025-12/TP-1.D.U%282025-12%29.pdf }
    applies: 'person.province == "QC" and (line.QCU.23 > 0 or line.QCU.33 > 0)'
    fields:
      # Part B – Deduction for QPP contributions on employment income
      "10": { value: "min(line.TP1.98, param.qppMaxEmployee)", when: "line.QCU.33 == 0" }
      "11": { value: line.QCU.11, when: "line.QCU.33 == 0" }
      "12": { value: "min(line.TP1.98_1, param.qppMaxPensionable)", when: "line.QCU.33 == 0" }
      "13": { value: param.qppExemption, when: "line.QCU.33 == 0" }
      "14": { value: "max(0, min(line.TP1.98_1, param.qppMaxPensionable) - param.qppExemption)", when: "line.QCU.33 == 0" }
      "14.1": { value: param.qppMaxPensionable, when: "line.QCU.33 == 0" }
      "14.2": { value: param.qppExemption, when: "line.QCU.33 == 0" }
      "14.3": { value: "param.qppMaxPensionable - param.qppExemption", when: "line.QCU.33 == 0" }
      "14.4": { value: line.QCU.14_4, when: "line.QCU.33 == 0" }
      "15": { value: "round(line.QCU.14_4 * param.qppFirstRate, 2)", when: "line.QCU.33 == 0" }
      "16": { value: line.QCU.16, when: "line.QCU.33 == 0" }
      "17": { value: line.TP1.98, when: "line.QCU.33 == 0" }
      "17.1": { value: line.QCU.14_4, when: "line.QCU.33 == 0" }
      "17.2": { value: "round(line.QCU.14_4 * param.qppEmployeeRate, 2)", when: "line.QCU.33 == 0" }
      "17.3": { value: "max(0, line.TP1.98 - round(line.QCU.14_4 * param.qppEmployeeRate, 2))", when: "line.QCU.33 == 0" }
      "17.4": { value: line.TP1.98_2, when: "line.QCU.33 == 0" }
      "17.5": { value: line.QCU.17_5, when: "line.QCU.33 == 0" }
      "18.5": { value: line.TP1.98_1, when: "line.QCU.33 == 0" }
      "18.6": { value: param.qppMaxPensionable, when: "line.QCU.33 == 0" }
      "18.7": { value: "max(0, line.TP1.98_1 - param.qppMaxPensionable)", when: "line.QCU.33 == 0" }
      "18.8": { value: param.qppAdditionalMaxPensionable, when: "line.QCU.33 == 0" }
      "18.9": { value: param.qppMaxPensionable, when: "line.QCU.33 == 0" }
      "19": { value: "param.qppAdditionalMaxPensionable - param.qppMaxPensionable", when: "line.QCU.33 == 0" }
      "20": { value: "min(max(0, line.TP1.98_1 - param.qppMaxPensionable), param.qppAdditionalMaxPensionable - param.qppMaxPensionable)", when: "line.QCU.33 == 0" }
      "21": { value: line.QCU.21, when: "line.QCU.33 == 0" }
      "22": { value: "min(line.QCU.17_5, line.QCU.21)", when: "line.QCU.33 == 0" }
      "22.1": { value: line.QCU.16, when: "line.QCU.33 == 0" }
      "23": { value: line.QCU.23, when: "line.QCU.33 == 0" }
      # Part C, section 1 – QPP contribution on income from self-employment
      "30": line.QCU.33
      "31.1": line.QCU.33
      "31.3": line.QCU.33
      "33": line.QCU.33
      "34": { value: line.TP1.98, when: "line.QCU.33 > 0" }
      "35": { value: line.TP1.98_2, when: "line.QCU.33 > 0" }
      "36": { value: "line.TP1.98 + line.TP1.98_2", when: "line.QCU.33 > 0" }
      "38": { value: "round((line.TP1.98 + line.TP1.98_2) / param.qppEmployeeRate, 2)", when: "line.QCU.33 > 0" }
      "39": { value: param.qppExemption, when: "line.QCU.33 > 0" }
      "40": { value: line.QCU.40, when: "line.QCU.33 > 0" }
      "41": { value: line.TP1.98_1, when: "line.QCU.33 > 0" }
      "42": { value: "max(0, line.QCU.40 - line.TP1.98_1)", when: "line.QCU.33 > 0" }
      "43": line.QCU.43
      "44": { value: param.qppMaxPensionable, when: "line.QCU.33 > 0" }
      "45": { value: param.qppExemption, when: "line.QCU.33 > 0" }
      "46": { value: "param.qppMaxPensionable - param.qppExemption", when: "line.QCU.33 > 0" }
      "47": { value: "round((line.TP1.98 + line.TP1.98_2) / param.qppEmployeeRate, 2)", when: "line.QCU.33 > 0" }
      "47.1": { value: "max(0, param.qppMaxPensionable - line.QCU.40)", when: "line.QCU.33 > 0" }
      "47.2": { value: "min(line.QCU.43, max(0, param.qppMaxPensionable - line.QCU.40))", when: "line.QCU.33 > 0" }
      "48": line.QCU.48
      "53": { value: param.qppAdditionalMaxPensionable, when: "line.QCU.33 > 0" }
      "54": { value: param.qppMaxPensionable, when: "line.QCU.33 > 0" }
      "55": { value: "param.qppAdditionalMaxPensionable - param.qppMaxPensionable", when: "line.QCU.33 > 0" }
      "75": { value: line.QCU.40, when: "line.QCU.33 > 0" }
      "76": { value: "min(line.TP1.98_1, line.QCU.40)", when: "line.QCU.33 > 0" }
      "77": { value: "line.QCU.33 + min(line.TP1.98_1, line.QCU.40)", when: "line.QCU.33 > 0" }
      "78": { value: param.qppMaxPensionable, when: "line.QCU.33 > 0" }
      "79": { value: "max(0, line.QCU.33 + min(line.TP1.98_1, line.QCU.40) - param.qppMaxPensionable)", when: "line.QCU.33 > 0" }
      "81": { value: "max(0, line.QCU.33 + min(line.TP1.98_1, line.QCU.40) - param.qppMaxPensionable)", when: "line.QCU.33 > 0" }
      "82": { value: "param.qppAdditionalMaxPensionable - param.qppMaxPensionable", when: "line.QCU.33 > 0" }
      "84": { value: "param.qppAdditionalMaxPensionable - param.qppMaxPensionable", when: "line.QCU.33 > 0" }
      "85": line.QCU.33
      "87": { value: line.TP1.98_1, when: "line.QCU.33 > 0" }
      "88": { value: param.qppMaxPensionable, when: "line.QCU.33 > 0" }
      "89": { value: "max(0, line.TP1.98_1 - param.qppMaxPensionable)", when: "line.QCU.33 > 0" }
      "91": line.QCU.33
      "92":
        value: "min(max(0, line.QCU.33 + min(line.TP1.98_1, line.QCU.40) - param.qppMaxPensionable), param.qppAdditionalMaxPensionable - param.qppMaxPensionable, line.QCU.33)"
        when: "line.QCU.33 > 0"
      "93":
        value: "round(min(max(0, line.QCU.33 + min(line.TP1.98_1, line.QCU.40) - param.qppMaxPensionable), param.qppAdditionalMaxPensionable - param.qppMaxPensionable, line.QCU.33) * param.qppSecondSelfEmployedRate, 2)"
        when: "line.QCU.33 > 0"
      "93.1": { value: line.QCU.48, when: "line.QCU.33 > 0" }
      "94": line.QCU.94
      "95.1": { value: line.QCU.71, when: "line.QCU.33 > 0" }
      "95.2": { value: line.TP1.98_1, when: "line.QCU.33 > 0" }
      "95.3": line.QCU.33
      "95.4": { value: "line.TP1.98_1 + line.QCU.33", when: "line.QCU.33 > 0" }
      "95.5": { value: "min(param.qppAdditionalMaxPensionable, line.TP1.98_1 + line.QCU.33)", when: "line.QCU.33 > 0" }
      "95.6": { value: param.qppMaxPensionable, when: "line.QCU.33 > 0" }
      "95.7": { value: "max(0, min(param.qppAdditionalMaxPensionable, line.TP1.98_1 + line.QCU.33) - param.qppMaxPensionable)", when: "line.QCU.33 > 0" }
      "95.8":
        value: "round(max(0, min(param.qppAdditionalMaxPensionable, line.TP1.98_1 + line.QCU.33) - param.qppMaxPensionable) * param.qppSecondRate, 2)"
        when: "line.QCU.33 > 0"
      "95": line.QCU.95
      "96": { value: "line.TP1.98 + line.TP1.98_2", when: "line.QCU.33 > 0" }
      "97": { value: "max(0, line.QCU.95 - line.TP1.98 - line.TP1.98_2)", when: "line.QCU.33 > 0" }
      "98": line.QCU.98
      "99": line.QCU.99
      # Part C, section 2 – QPP deduction
      "100": line.QCU.48
      "101": line.QCU.101
      "102": line.QCU.48
      "103": line.QCU.103
      "104": { value: line.TP1.98, when: "line.QCU.33 > 0" }
      "105": { value: "round(line.TP1.98 * param.qppFirstShare, 2)", when: "line.QCU.33 > 0" }
      "106": line.QCU.33
      "107": { value: line.TP1.98_1, when: "line.QCU.33 > 0" }
      "108": { value: "line.QCU.33 + line.TP1.98_1", when: "line.QCU.33 > 0" }
      "109": { value: param.qppExemption, when: "line.QCU.33 > 0" }
      "110": { value: "max(0, line.QCU.33 + line.TP1.98_1 - param.qppExemption)", when: "line.QCU.33 > 0" }
      "111": line.QCU.111
      "112": { value: "round(line.QCU.111 * param.qppFirstRate, 2)", when: "line.QCU.33 > 0" }
      "113": { value: "min(round(line.TP1.98 * param.qppFirstShare, 2), round(line.QCU.111 * param.qppFirstRate, 2))", when: "line.QCU.33 > 0" }
      "114":
        value: "line.QCU.101 + line.QCU.103 + min(round(line.TP1.98 * param.qppFirstShare, 2), round(line.QCU.111 * param.qppFirstRate, 2))"
