questions:
  livedApartLastSixMonths:
    type: boolean
    module: about
    ask: You and your spouse lived apart for the last 6 months of 2025
    help: Filing separately, you can get the earned income credit (with a qualifying child) or the credit for child care only if you didn't share a home with your spouse for the last 6 months of 2025.

lines:
  # A qualifying child for the EIC: relationship, age and a home with you for more than half of 2025; unlike a
  # dependent, no support or citizenship test. Not checked: that the child is younger than you (only a brother or
  # sister can fail it) and that the home was in the United States (the return is a resident's).
  DEP.eicChild:
    each: dependant
    label: A qualifying child for the earned income credit (1 for yes)
    formula: >-
      if(line.DEP.relatedChild == 1 and dependant.answer.monthsWithYou >= 7 and line.DEP.ageTest == 1
      and not dependant.answer.filedJointReturn, if(dependant.answer.hasSSN, 1, 0), 0)
    source: "Instructions, line 27a, Step 3, Qualifying Child, with a valid SSN (Step 1)"
  US.eicChildren:
    label: Qualifying children for the earned income credit
    formula: "sum(dependants.DEP.eicChild)"
  US.eicKids:
    label: Qualifying children counted for the EIC Table (three or more count as three)
    formula: "min(3, line.US.eicChildren)"
  US.eicRateIn:
    label: Earned income credit rate as it rises
    formula: "if(line.US.eicKids == 0, param.eicRateInNoChild, if(line.US.eicKids == 1, param.eicRateInOneChild, if(line.US.eicKids == 2, param.eicRateInTwoChildren, param.eicRateInThreeChildren)))"
  US.eicMax:
    label: Largest earned income credit
    formula: "if(line.US.eicKids == 0, param.eicMaxNoChild, if(line.US.eicKids == 1, param.eicMaxOneChild, if(line.US.eicKids == 2, param.eicMaxTwoChildren, param.eicMaxThreeChildren)))"
  US.eicEarnedAmount:
    label: Earned income at which the credit is largest
    formula: "if(line.US.eicKids == 0, param.eicEarnedAmountNoChild, if(line.US.eicKids == 1, param.eicEarnedAmountOneChild, if(line.US.eicKids == 2, param.eicEarnedAmountTwoChildren, param.eicEarnedAmountThreeChildren)))"
  US.eicRateOut:
    label: Earned income credit phase-out rate
    formula: "if(line.US.eicKids == 0, param.eicRateOutNoChild, if(line.US.eicKids == 1, param.eicRateOutOneChild, if(line.US.eicKids == 2, param.eicRateOutTwoChildren, param.eicRateOutThreeChildren)))"
  US.eicStart:
    label: Income from which the earned income credit goes down
    formula: "if(line.US.eicKids == 0, if(line.US.joint == 1, param.eicStartNoChildJoint, param.eicStartNoChild), if(line.US.eicKids == 1, if(line.US.joint == 1, param.eicStartOneChildJoint, param.eicStartOneChild), if(line.US.eicKids == 2, if(line.US.joint == 1, param.eicStartTwoChildrenJoint, param.eicStartTwoChildren), if(line.US.joint == 1, param.eicStartThreeChildrenJoint, param.eicStartThreeChildren))))"
  US.eicLimit:
    label: Income from which there is no earned income credit
    formula: "if(line.US.eicKids == 0, if(line.US.joint == 1, param.eicLimitNoChildJoint, param.eicLimitNoChild), if(line.US.eicKids == 1, if(line.US.joint == 1, param.eicLimitOneChildJoint, param.eicLimitOneChild), if(line.US.eicKids == 2, if(line.US.joint == 1, param.eicLimitTwoChildrenJoint, param.eicLimitTwoChildren), if(line.US.joint == 1, param.eicLimitThreeChildrenJoint, param.eicLimitThreeChildren))))"
  US.eicAge:
    label: People on the return 25 to 64 at the end of 2025
    formula: "if(person.age >= 25 and person.age < 65, 1, 0) + if(line.US.joint == 1, if(spouse.person.age >= 25 and spouse.person.age < 65, 1, 0), 0)"
    source: "Instructions, line 27a, Step 4: at least 25 but under 65 at the end of 2025 (you, or your spouse filing jointly)"
  US.eicSSN:
    label: You, and your spouse filing jointly, have a valid SSN (1 for yes)
    formula: "if(answer.hasValidSSN, if(line.US.joint == 1, if(spouse.answer.hasValidSSN, 1, 0), 1), 0)"
    source: "Instructions, line 27a, Step 1, question 2"
  # Each condition in the order of the steps, so a question is asked only when it decides.
  US.eicEligible:
    label: Can take the earned income credit (1 for yes)
    formula: >-
      if(line.US.claimable == 1, 0, if(line.F1040.1z < 1, 0, if(line.F1040.2a + line.F1040.2b > param.eicInvestmentLimit, 0,
      if(line.F1040.11a >= line.US.eicLimit or line.F1040.1z >= line.US.eicLimit, 0,
      if(line.US.eicKids == 0, if(line.US.separate == 1 or line.US.hoh == 1, 0, if(line.US.eicAge > 0, line.US.eicSSN, 0)),
      if(line.US.separate == 1, if(answer.livedApartLastSixMonths, line.US.eicSSN, 0), line.US.eicSSN))))))
    source: >-
      Instructions, line 27a: Step 1 (AGI under the limit, valid SSNs), Step 2 (investment income: lines 2a and 2b), Step
      3 (filing separately: a qualifying child and living apart for the last 6 months; not someone else's qualifying
      child, which the app takes as not being someone's dependent), Step 4 (no qualifying child: 25 to 64, not
      separately or head of household) and Step 5 (earned income under the limit)
  US.eicRowEarned:
    label: Start of the EIC Table's row for earned income
    formula: "if(line.F1040.1z < 50, 1, floor(line.F1040.1z, 50))"
  US.eicRowEndEarned:
    label: End of the EIC Table's row for earned income; the last row of a column stops at the limit
    formula: "if(line.F1040.1z < 50, 50, min(line.US.eicRowEarned + 50, line.US.eicLimit))"
  US.eicMiddleEarned:
    label: Middle of the EIC Table's row for earned income
    formula: "(line.US.eicRowEarned + line.US.eicRowEndEarned) / 2"
  US.eicTableEarned:
    label: Earned income credit from the EIC Table for earned income
    formula: >-
      if(line.F1040.1z < 1 or line.F1040.1z >= line.US.eicLimit, 0, round(max(0,
      if(line.US.eicRowEndEarned > line.US.eicEarnedAmount, line.US.eicMax, min(line.US.eicRateIn * line.US.eicMiddleEarned, line.US.eicMax))
      - if(line.US.eicRowEarned >= line.US.eicStart, line.US.eicRateOut * (line.US.eicMiddleEarned - line.US.eicStart), 0)), 0))
    source: >-
      The 2025 EIC Table (Instructions, pages 49 to 60), checked row by row: each row's credit is worked out on the
      middle of the row (of the narrower last row, by its limit), to the nearest dollar; the row with the earned
      income amount gives the largest credit, and it goes down only from rows starting at the phase-out start
  US.eicRowAGI:
    label: Start of the EIC Table's row for adjusted gross income
    formula: "if(line.F1040.11a < 50, 1, floor(line.F1040.11a, 50))"
  US.eicRowEndAGI:
    label: End of the EIC Table's row for adjusted gross income; the last row of a column stops at the limit
    formula: "if(line.F1040.11a < 50, 50, min(line.US.eicRowAGI + 50, line.US.eicLimit))"
  US.eicMiddleAGI:
    label: Middle of the EIC Table's row for adjusted gross income
    formula: "(line.US.eicRowAGI + line.US.eicRowEndAGI) / 2"
  US.eicTableAGI:
    label: Earned income credit from the EIC Table for adjusted gross income
    formula: >-
      if(line.F1040.11a < 1 or line.F1040.11a >= line.US.eicLimit, 0, round(max(0,
      if(line.US.eicRowEndAGI > line.US.eicEarnedAmount, line.US.eicMax, min(line.US.eicRateIn * line.US.eicMiddleAGI, line.US.eicMax))
      - if(line.US.eicRowAGI >= line.US.eicStart, line.US.eicRateOut * (line.US.eicMiddleAGI - line.US.eicStart), 0)), 0))
    source: >-
      The 2025 EIC Table (Instructions, pages 49 to 60), checked row by row: each row's credit is worked out on the
      middle of the row (of the narrower last row, by its limit), to the nearest dollar; the row with the earned
      income amount gives the largest credit, and it goes down only from rows starting at the phase-out start
  F1040.27a:
    label: Earned income credit
    formula: >-
      if(line.US.eicEligible == 0, 0, if(line.F1040.11a == line.F1040.1z or line.F1040.11a < line.US.eicStart,
      line.US.eicTableEarned, min(line.US.eicTableEarned, line.US.eicTableAGI)))
    source: "Instructions, EIC Worksheet A: the credit on earned income; when AGI differs and isn't under the phase-out start, the smaller of that and the credit on AGI"
