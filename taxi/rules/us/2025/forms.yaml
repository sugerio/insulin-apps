      "9": line.F540.9
      "10": line.F540.10
      "11": line.F540.11
      "12": line.F540.12
      "13": line.F540.13
      "14": line.F540.14
      "15": { value: line.F540.15, zero: true }
      "16": line.F540.16
      "17": { value: line.F540.17, zero: true }
