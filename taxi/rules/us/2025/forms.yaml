      rateSchedule: { tick: "line.F540.19 > param.caTaxTableLimit" }
      "31": { value: line.F540.31, zero: true }
      "32": line.F540.32
      "33": { value: line.F540.33, zero: true }
      "35": { value: line.F540.35, zero: true }
      "40": line.F540.40
      "46": line.F540.46
      "47": line.F540.47
      "48": { value: line.F540.48, zero: true }
      "61": line.F540.61
      "62": line.F540.62
      "63": line.F540.63
      "64": { value: line.F540.64, zero: true }
      "71": line.F540.71
      "72": line.F540.72
      "75": line.F540.75
      "76": line.F540.76
      "77": line.F540.77
