name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` too, so a title or body changed later is checked again (Commit messages).
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# A newer commit cancels a pull request's run, but every push to main finishes its own: a push whose runs all pass is a
# release (release.yml), and a cancelled one gets no version.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  public-content:
    # The repository is public. Organization-specific terms live in the maintainer's private deny list, which this
    # job never has.
    name: Public content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Script tests
        run: node --test .github/scripts/*.test.mjs
      - name: Check app workflows
        run: node .github/scripts/check-app-workflows.mjs
      - name: Scan tracked files
        run: node .github/scripts/check-public-content.mjs

  commit-messages:
    # Pull requests are squash merged, and the squash commit carries every commit message: a line telling GitHub to skip
    # workflows in any of them, or in the title or body, would start no push workflow for the merge, so nothing would be
    # checked on main, released or deployed.
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: No directive to skip workflows
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/check-commit-messages.mjs "$BASE" "$HEAD"
