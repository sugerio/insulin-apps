      # person writes them. Line 6 is the family income of both the sales tax and the renter's credits.
      "6": { value: "line.BC479.6", when: "line.BC.claimsSalesCredit == 1 or line.BC.claimsRentersCredit == 1" }
      # Sales tax credit, on the return that claims it
      "7": { value: "line.BC479.7", when: "line.BC.claimsSalesCredit == 1" }
      "8": { value: "line.BC479.8", when: "line.BC.claimsSalesCredit == 1" }
      "9": { value: "param.bcSalesCreditAmount", when: "line.BC.claimsSalesCredit == 1" }
      "10": { value: "line.BC479.10", when: "line.BC.claimsSalesCredit == 1" }
      "11": { value: "line.BC479.11", when: "line.BC.claimsSalesCredit == 1" }
      "12": { value: "round(line.BC479.8 * param.bcSalesCreditRate, 2)", when: "line.BC.claimsSalesCredit == 1" }
      "13": line.BC479.13
      # Home renovation tax credit for seniors and persons with disabilities
      "60480": line.BC479.60480
      "14": line.BC479.14
      "15": line.BC479.15
      "16": line.BC479.15
      "35": line.BC479.15
      "36": line.BC479.15
      # Renter's tax credit: the months (line 37) are column D of the declaration, which the person fills in, and lines
      # 39 to 42 sit in a column the layout doesn't measure. Line 38 ($400) is printed.
      "43": line.BC479.43
      "44": line.BC479.44
      "45": line.BC479.45

  # The CARE credit (line 2) is worked out on Schedule ON479-A, which isn't printed. Lines 17 and 20 (flow-through
  # shares, co-operative education) aren't handled.
  ON479:
    title: Form ON479, Ontario Credits
    url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-tc/5006-tc-25e.pdf
    applies: 'person.province == "ON" and line.ON479.21 > 0'
    fields:
      "61268": { value: "line.ON479.61268", when: "line.ON479.1 > 0" }
      "1": line.ON479.1
      "2": line.ON479A.8
      # The seniors care at home credit: written only when it is claimed (lines 4, 9 and 11 are printed). Lines 9 to 12
      # are skipped at $35,000 or less, where line 5 goes on line 13.
      "3": { value: "line.ON428.43", when: "line.ON479.13 > 0" }
      "5": { value: "line.ON479.5", when: "line.ON479.13 > 0" }
      "6": { value: "line.T1.23600", when: "line.ON479.13 > 0" }
      "7": { value: "line.HH.spouseNetIncome", when: "line.ON479.13 > 0" }
      "8": { value: "line.ON479.8", when: "line.ON479.13 > 0" }
      "10": { value: "line.ON479.8 - param.onSeniorsCareBase", when: "line.ON479.13 > 0 and line.ON479.8 > param.onSeniorsCareBase" }
      "12": { value: "round((line.ON479.8 - param.onSeniorsCareBase) * param.onSeniorsCareReductionRate, 2)", when: "line.ON479.13 > 0 and line.ON479.8 > param.onSeniorsCareBase" }
      "63095": line.ON479.13
      "13": line.ON479.13
      "63100": { value: "min(answer.publicTransitPaid, param.onTransitMax)", when: "line.ON479.14 > 0" }
      "14": line.ON479.14
      "15": { value: "line.ON479.15", when: "line.ON479.16 > 0" }
      "16": line.ON479.16
      "18": line.ON479.18
      "19": line.ON479.18
      "21": line.ON479.21
