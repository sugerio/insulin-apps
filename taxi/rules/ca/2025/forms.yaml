      "79": line.BC428.79
      "80": line.BC428.91
      "82": line.BC428.91
      "85": line.BC428.91
      "89": line.BC428.91
      "91": line.BC428.91
    tables:
      # Part A – British Columbia tax on taxable income, in two printed tables
      - brackets: bcTaxBrackets
        amount: line.T1.26000
        parts:
          - { columns: "3", amount: "2", over: "4", times: "6", tax: "8" }
          - { columns: "10", amount: "9", over: "11", times: "13", tax: "15" }

