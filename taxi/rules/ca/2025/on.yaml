# Ontario tax: Form ON428, Schedule ON428-A (the LIFT credit), Schedules ON(S2) and ON(S11), and Form ON479 (Ontario
# credits) with Schedule ON479-A (the CARE credit). Line ids are the line numbers in the forms' right margin. Every
# number below was checked against the 2025 ON428 (5006-C), ON428-A (5006-A), Worksheet ON428 (5006-D), ON(S2)
# (5006-S2), ON(S11) (5006-S11), ON479 (5006-TC), Worksheet ON479 (5006-D1), ON479-A (5006-TCA) and the Ontario tax
# information page (5006-PC).
#
# Left out of ON428 and ON479: tax on split income (line 54), the minimum tax carryover and additional tax (lines 60
# and 72), EI premiums on self-employment (line 22, 58305), the community food program donation credit for farmers
# (line 87), the focused flow-through share credit (ON479 line 17, mining) and the co-operative education credit
# (ON479 line 20, for employers). The Ontario Trillium Benefit (energy and property tax credit, northern energy
# credit) is applied for on Form ON-BEN and paid apart from the return: it is not on line 47900.

