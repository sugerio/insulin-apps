# Questions a formula reads as answer.<id>. A question with a default gives an estimate until it is answered. `module`
# is the part of the return that asks it (about the person, income, deductions, credits); the screens build their forms
# from these entries, in this order. A question is asked only when the return reads it. In a module:
# - a yes/no question with a `slip` is a kind of income or expense shown by that slip: finding the slip adds it to the
#   return, and a yes without the slip is missing. It is asked when the return reads that slip's boxes: every return
#   reads the federal slips, and only a Quebec return reads the RL slips;
# - a yes/no question without one is a group: its parts (questions with `parent`) are asked in its card once it applies,
#   or, with a `note`, something to know (a form to file separately);
# - a money question is an amount to enter. Its `receipts` are shown with it; a line that adds them makes the amount
#   what isn't on an uploaded receipt, and a `suggest` line works out the amount from the receipts to start from.
# A question without a module and with `decision: true` is a choice the app makes (its default) until a hint, accepted,
# changes it: the result stays complete without an answer.

questions:
  # Income
  hasEmploymentIncome:
    type: boolean
    module: income
    slip: T4
    ask: Employment income
    help: A T4 from each employer you worked for in 2025.
  hasRl1:
    type: boolean
    module: income
    slip: RL1
    ask: Employment income in Quebec (RL-1)
    help: An RL-1 from each employer in Quebec, which also gives you a T4. The Quebec return reads the RL-1.
  hasInvestmentIncome:
    type: boolean
    module: income
    slip: T5
    ask: Interest or dividends
    help: A T5 from each bank, credit union or broker that paid you $50 or more.
  hasRl3:
    type: boolean
    module: income
    slip: RL3
    ask: Interest or dividends, Quebec slip (RL-3)
    help: An RL-3 from each bank, credit union or broker, which also gives you a T5.
  hasTrustIncome:
    type: boolean
    module: income
    slip: T3
    ask: Mutual fund or trust income
    help: A T3 from each mutual fund or trust held outside an RRSP or TFSA.
  hasRl16:
    type: boolean
    module: income
    slip: RL16
    ask: Mutual fund or trust income, Quebec slip (RL-16)
    help: An RL-16 from each mutual fund or trust, which also gives you a T3.
  hasSoldInvestments:
    type: boolean
    module: income
    slip: T5008
    ask: Sold shares, bonds or fund units
    help: A T5008 from each broker, for sales outside an RRSP or TFSA.
  hasOasPension:
    type: boolean
    module: income
    slip: T4AOAS
    ask: Old Age Security pension
    help: A T4A(OAS) from Service Canada.
  hasCppBenefits:
    type: boolean
    module: income
    slip: T4AP
    ask: Canada Pension Plan benefits
    help: A T4A(P) from Service Canada, for a CPP retirement, survivor or disability pension.
  hasPensionIncome:
    type: boolean
    module: income
    slip: T4A
    ask: A pension, annuity, scholarship or other T4A income
    help: A T4A from each pension plan, school or other payer.
  hasRl2:
    type: boolean
    module: income
    slip: RL2
    ask: Pension, RRSP, RRIF or QPP payments, Quebec slip (RL-2)
    help: An RL-2 from each pension plan, RRSP or RRIF issuer, and from Retraite Québec for QPP benefits. They also give you a T4A, T4RSP, T4RIF or T4A(P).
  hasRrifIncome:
    type: boolean
    module: income
    slip: T4RIF
    ask: RRIF payments
    help: A T4RIF from each registered retirement income fund you were paid from.
  hasEiBenefits:
    type: boolean
    module: income
    slip: T4E
    ask: Employment insurance benefits
    help: A T4E from Service Canada, for EI regular, sickness, maternity or parental benefits.
  hasRl6:
    type: boolean
    module: income
    slip: RL6
    ask: Québec parental insurance plan benefits (RL-6)
    help: An RL-6 from the Québec parental insurance plan, for maternity, paternity, parental or adoption benefits.
  hasSelfEmployment:
    type: boolean
    module: income
    ask: Self-employment or business income
    help: Income from your own business, profession, farm or fishing, freelancing or gig work (Form T2125, T2042 or T2121). Attach the form to a paper return.
    default: false
  selfEmploymentKind:
    type: choice
    module: income
    parent: hasSelfEmployment
    ask: Kind of income
    options: [business, professional, commission, farming, fishing]
    optionLabels:
      business: Business (a shop, trade or gig work)
      professional: Professional (a consultant, accountant, designer…)
      commission: Commission sales
      farming: Farming (Form T2042)
      fishing: Fishing (Form T2121)
  selfEmploymentGross:
    type: money
    module: income
    parent: hasSelfEmployment
    ask: Gross income
    help: What you were paid in 2025, without GST/HST you collected.
  selfEmploymentExpenses:
    type: money
    module: income
    parent: hasSelfEmployment
    ask: Business expenses
    help: Supplies, rent, phone, travel, fees and other costs of earning it. Not capital cost allowance, which is asked next.
  # Capital cost allowance (Area A of the form): one class, because a group asks a fixed set of amounts. Most small
  # businesses have one (a vehicle, or computers); more than one class is said not to be handled rather than guessed.
  businessCcaClass:
    type: choice
    module: income
    parent: hasSelfEmployment
    ask: Capital cost allowance
    help: "Depreciation of property you use in the business: equipment, a vehicle, computers or a building. This app works out one class."
    options: [none, class1, class8, class10, class10_1, class50, several]
    optionLabels:
      none: None
      class1: Class 1 (4%), a building
      class8: Class 8 (20%), furniture, tools, equipment
      class10: Class 10 (30%), a vehicle, other than class 10.1
      class10_1: Class 10.1 (30%), a car that cost more than $38,000
      class50: Class 50 (55%), computers and software
      several: More than one class
    default: none
  businessUccStart:
    type: money
    module: income
    parent: hasSelfEmployment
    askedWhen: { question: businessCcaClass, options: [class1, class8, class10, class10_1, class50] }
    ask: Undepreciated capital cost at the start of 2025
    help: The class's balance at the end of 2024, from last year's form (Area A, last column). 0 for property first bought in 2025.
  businessCcaAdditions:
    type: money
    module: income
    parent: hasSelfEmployment
    askedWhen: { question: businessCcaClass, options: [class1, class8, class10, class10_1, class50] }
    ask: Property bought and put in use in 2025
    help: Its cost. For a class 10.1 car, at most $38,000 plus GST/HST and PST.
  businessCcaDispositions:
    type: money
    module: income
    parent: hasSelfEmployment
    askedWhen: { question: businessCcaClass, options: [class1, class8, class10, class10_1, class50] }
    ask: Property of the class sold in 2025
    help: What you got for it, up to what it cost you. If you sold everything in the class, the terminal loss isn't worked out here.
  businessCcaPersonalUse:
    type: percent
    module: income
    parent: hasSelfEmployment
    askedWhen: { question: businessCcaClass, options: [class1, class8, class10, class10_1, class50] }
    ask: Personal use of the property
    help: For a car you also drive for yourself, the share of the kilometres that were personal. That part of the allowance isn't deducted. Leave it empty for none.
  businessCcaLimit:
    type: money
    module: income
    parent: hasSelfEmployment
    askedWhen: { question: businessCcaClass, options: [class1, class8, class10, class10_1, class50] }
    ask: Most capital cost allowance to claim, if less than the maximum
    help: Leave it empty to claim the most allowed. What you don't claim stays in the class for later years.
  hasRentalIncome:
    type: boolean
    module: income
    ask: Rental income
    help: Rent from a property you own (Form T776). If you own it with someone, enter your share.
    default: false
  rentalGross:
    type: money
    module: income
    parent: hasRentalIncome
    ask: Rents received
  rentalExpenses:
    type: money
    module: income
    parent: hasRentalIncome
    ask: Rental expenses
    help: Mortgage interest, property tax, insurance, repairs, utilities you paid, and fees. Not capital cost allowance, which is asked next.
  # As for a business: one class, the rental building's (class 1 or 3, by when it was bought, Guide T4036) or its
  # furniture and appliances (class 8).
  rentalCcaClass:
    type: choice
    module: income
    parent: hasRentalIncome
    ask: Capital cost allowance
    help: Depreciation of the rental building, or of its furniture and appliances. It can't make or increase a rental loss. This app works out one class.
    options: [none, class1, class3, class8, several]
    optionLabels:
      none: None
      class1: Class 1 (4%), a building bought after 1987
      class3: Class 3 (5%), a building bought before 1988
      class8: Class 8 (20%), furniture and appliances
      several: More than one class
    default: none
  rentalUccStart:
    type: money
    module: income
    parent: hasRentalIncome
    askedWhen: { question: rentalCcaClass, options: [class1, class3, class8] }
    ask: Undepreciated capital cost at the start of 2025
    help: The class's balance at the end of 2024, from last year's Form T776 (Area A, last column). 0 for property first bought in 2025.
  rentalCcaAdditions:
    type: money
    module: income
    parent: hasRentalIncome
    askedWhen: { question: rentalCcaClass, options: [class1, class3, class8] }
    ask: Property bought and put in use in 2025
    help: Its cost, the rental part only. Not the land, which isn't depreciated.
  rentalCcaDispositions:
    type: money
    module: income
    parent: hasRentalIncome
    askedWhen: { question: rentalCcaClass, options: [class1, class3, class8] }
    ask: Property of the class sold in 2025
    help: What you got for the building (not the land), up to what it cost you. If you sold everything in the class, the terminal loss isn't worked out here.
  rentalCcaLimit:
    type: money
    module: income
    parent: hasRentalIncome
    askedWhen: { question: rentalCcaClass, options: [class1, class3, class8] }
    ask: Most capital cost allowance to claim, if less than the maximum
    help: Leave it empty to claim the most allowed. What you don't claim stays in the class for later years.
  hasForeignIncome:
    type: boolean
    module: income
    ask: Income from outside Canada
    help: Interest, dividends or employment income earned abroad, in Canadian dollars. Foreign tax paid on it gives a foreign tax credit (Form T2209).
    default: false
  foreignInvestmentIncome:
    type: money
    module: income
    parent: hasForeignIncome
    ask: Foreign interest and dividends
  foreignInvestmentTax:
    type: money
    module: income
    parent: hasForeignIncome
    ask: Foreign tax withheld on them
  foreignEmploymentIncome:
    type: money
    module: income
    parent: hasForeignIncome
    ask: Employment income earned abroad
  foreignEmploymentTax:
    type: money
    module: income
    parent: hasForeignIncome
    ask: Foreign tax paid on it
  hasForeignProperty:
    type: boolean
    module: income
    ask: Property outside Canada that cost more than $100,000
    help: Foreign bank accounts, shares or real estate (not a home you use) that cost more than $100,000 in total at any time in 2025.
    note: File Form T1135, Foreign Income Verification Statement, with your return. It reports the property; it doesn't change your tax. This app doesn't prepare it.
    default: false
  soldProperty:
    type: boolean
    module: income
    ask: Sold your home or other real estate
    help: The sale of a home, cottage or rental property in 2025 (Schedule 3; Form T2091(IND) for a home).
    default: false
  propertyUse:
    type: choice
    module: income
    parent: soldProperty
    ask: What the property was
    help: "For your home, file Form T2091(IND) and tick the box at line 17900 of Schedule 3: box 1 for every year, box 2 for some years."
    options: [principal_residence, principal_residence_some_years, rental_or_investment, personal_use, flipped]
    optionLabels:
      principal_residence: Your home, every year you owned it
      principal_residence_some_years: Your home, but only some of the years
      rental_or_investment: A rental or investment property
      personal_use: A cottage or other property for your own use
      flipped: A home owned less than 12 months, not sold because of a life event
  propertyProceeds:
    type: money
    module: income
    parent: soldProperty
    ask: Selling price
  propertyCost:
    type: money
    module: income
    parent: soldProperty
    ask: What you paid for it, with improvements
    help: "The adjusted cost base: the purchase price, the costs of buying, and the cost of improvements."
  propertyOutlays:
    type: money
    module: income
    parent: soldProperty
    ask: Selling costs
    help: Real estate commission, legal fees and other costs of selling.
  propertyYearsOwned:
    type: count
    module: income
    parent: soldProperty
    askedWhen: { question: propertyUse, options: [principal_residence_some_years] }
    ask: Years you owned it
    help: The tax years, from the year you bought it to 2025, counting both (Form T2091(IND), line 7).
  propertyYearsDesignated:
    type: count
    module: income
    parent: soldProperty
    askedWhen: { question: propertyUse, options: [principal_residence_some_years] }
    ask: Years it was your principal residence
    help: The years you designate it as your principal residence (Form T2091(IND), line 3). One more year is added for you.

  hasRrspIncome:
    type: boolean
    module: income
    slip: T4RSP
    ask: RRSP withdrawals
    help: A T4RSP from each plan you took money out of in 2025.
  hasBenefitsStatement:
    type: boolean
    module: income
    slip: T5007
    ask: Workers' compensation or social assistance
    help: A T5007 from the board or the government that paid you.
  hasRl5:
    type: boolean
    module: income
    slip: RL5
    ask: Social assistance, Quebec slip (RL-5)
    help: An RL-5 from the Quebec government for social assistance or similar financial assistance, which also gives you a T5007.
  hasFhsaWithdrawals:
    type: boolean
    module: income
    slip: T4FHSA
    ask: First home savings account (FHSA)
    help: A T4FHSA from each FHSA you contributed to or withdrew from in 2025.
  hasSupportReceived:
    type: boolean
    module: income
    ask: Support payments received
    help: Payments from a former spouse or partner under a court order or written agreement.
    default: false
  supportReceived:
    type: money
    module: income
    parent: hasSupportReceived
    ask: Total support received in 2025
  childSupportReceived:
    type: money
    module: income
    parent: hasSupportReceived
    ask: The part that is child support
    help: Child support under an order or agreement made after April 1997 isn't taxable.

  # Deductions
  rrspDeduction:
    type: money
    module: deductions
    receipts: RRSP
    suggest: SUGGEST.rrspDeduction
    ask: RRSP contributions to deduct for 2025
    help: Contributions from March 4, 2025 to March 2, 2026, up to your limit on last year's notice of assessment.
    default: 0
  fhsaDeduction:
    type: money
    module: deductions
    receipts: T4FHSA
    suggest: SUGGEST.fhsaDeduction
    ask: FHSA contributions to deduct for 2025
    help: Contributions in 2025 (box 18 of your T4FHSA), and any from earlier years you haven't deducted yet. You can also leave some for a later year.
    default: 0
  hasWorkFromHome:
    type: boolean
    module: deductions
    ask: Working from home
    help: Home-office expenses as an employee who worked from home more than half the time for at least 4 weeks in a row (Form T777). Your employer must sign Form T2200; keep it.
    default: false
  homeOfficeExpenses:
    type: money
    module: deductions
    parent: hasWorkFromHome
    ask: Home expenses for 2025
    help: Electricity, heat, water, home internet, maintenance and rent for your whole home. Mortgage interest and property tax don't count.
  homeOfficeShare:
    type: percent
    module: deductions
    parent: hasWorkFromHome
    ask: Share used for work
    help: The workspace's share of your home's area, times its share of the week's hours used for work. 12% of the area for 40 of 168 hours is 2.86%.
  hasChildCare:
    type: boolean
    module: deductions
    ask: Child care expenses
    help: Daycare, before- and after-school programs or day camps, so you or your spouse could work (Form T778). Enter them on one return of a couple; the app has the right spouse claim them.
    default: false
  childCareExpenses:
    type: money
    module: deductions
    parent: hasChildCare
    receipts: CHILDCARE
    ask: Child care paid
    help: Uploaded receipts are added; enter what isn't on one.
  # The limit is by birth year (Form T778, Part B): the household's dependants give the age bands, and these counts
  # move a child with the disability tax credit to the $11,000 limit, or an older infirm child to the $5,000 one.
  childCareDisabledUnder7:
    type: count
    module: deductions
    parent: hasChildCare
    ask: Children born in 2019 or later with the disability tax credit
    default: "0"
  childCareDisabled7to16:
    type: count
    module: deductions
    parent: hasChildCare
    ask: Children born from 2009 to 2018 with the disability tax credit
    default: "0"
  childCareDisabledOlder:
    type: count
    module: deductions
    parent: hasChildCare
    ask: Children born in 2008 or earlier with the disability tax credit
    help: An infirm child who depends on you, of any age.
    default: "0"
  childCareInfirmOlder:
    type: count
    module: deductions
    parent: hasChildCare
    ask: Children born in 2008 or earlier with an infirmity, without the disability tax credit
    help: An infirm child who depends on you.
    default: "0"
  childCareSpouseUnable:
    type: boolean
    module: deductions
    ask: Your spouse or partner couldn't care for the children for part of 2025
    help: "They went to school, were confined for 2 weeks or more by an infirmity, or in prison, or you lived apart 90 days or more and reconciled (Form T778, Part C). Then you, with the higher net income, can claim part of the child care."
    default: false
  childCareSpouseWeeks:
    type: count
    module: deductions
    parent: childCareSpouseUnable
    ask: Weeks they were a full-time student, infirm, in prison, or you lived apart
    help: Form T778, Part C, situations b) to f).
    default: "0"
  childCareSpouseMonths:
    type: count
    module: deductions
    parent: childCareSpouseUnable
    ask: Months they were a part-time student
    help: Form T778, Part C, situation a). Don't count a month with one of the weeks above.
    default: "0"
  hasMovingExpenses:
    type: boolean
    module: deductions
    ask: Moving expenses
    help: A move at least 40 km closer to a new job or business (Form T1-M).
    default: false
  movingExpenses:
    type: money
    module: deductions
    parent: hasMovingExpenses
    ask: Moving expenses
    help: Movers, travel, up to 15 days of temporary living, and the costs of selling your old home and buying the new one, less what your employer paid back.
  movingIncome:
    type: money
    module: deductions
    parent: hasMovingExpenses
    ask: Income earned at the new location
    help: Employment or self-employment income from the new job or business in 2025, less its deductions (union dues, CPP).

  hasSupportPaid:
    type: boolean
    module: deductions
    ask: Support payments made
    help: Payments to a former spouse or partner under a court order or written agreement.
    default: false
  supportPaid:
    type: money
    module: deductions
    parent: hasSupportPaid
    ask: Total support paid in 2025
  childSupportPaid:
    type: money
    module: deductions
    parent: hasSupportPaid
    ask: The part that is child support
    help: Child support under an order or agreement made after April 1997 isn't deductible.
  carryingCharges:
    type: money
    module: deductions
    ask: Interest and fees to earn investment income
    help: Interest on money borrowed to invest (outside an RRSP or TFSA) and investment counsel fees.
    default: 0
  hasDisabilitySupports:
    type: boolean
    module: deductions
    ask: Disability supports
    help: Attendant care, sign-language interpretation, devices and other supports paid so you could work or go to school (Form T929).
    default: false
  disabilitySupportsExpenses:
    type: money
    module: deductions
    parent: hasDisabilitySupports
    ask: Disability supports paid
    help: Less what was paid back to you.
  nonCapitalLosses:
    type: money
    module: deductions
    ask: Non-capital losses of earlier years to apply
    help: Losses from a business or employment in earlier years that you haven't used yet.
    default: 0
  netCapitalLosses:
    type: money
    module: deductions
    ask: Net capital losses of earlier years to apply
    help: From your notice of assessment. They can only reduce this year's taxable capital gains.
    default: 0
  hasNorthernResidence:
    type: boolean
    module: deductions
    ask: Lived in the North
    help: You lived in Yukon, the Northwest Territories or Nunavut for at least six months in a row, starting or ending in 2025. All three are a prescribed northern zone (Form T2222, northern residents deductions).
    default: false
  northernDays:
    type: count
    module: deductions
    parent: hasNorthernResidence
    ask: Days you lived there in 2025
  northernHome:
    type: choice
    module: deductions
    parent: hasNorthernResidence
    ask: Others in your home claiming it
    help: The additional residency amount is only for the one person in a home who claims the basic residency amount.
    options: [alone, shared]
    optionLabels:
      alone: No one else in my home claims the northern residents deduction
      shared: Someone else in my home claims it too

  # Credits
  hasDisability:
    type: boolean
    module: credits
    ask: Disability tax credit
    help: The CRA approved your Form T2201, Disability Tax Credit Certificate.
    default: false
  spouseInfirm:
    type: boolean
    module: credits
    ask: Your spouse or partner depends on you because of an impairment
    help: An impairment in physical or mental functions that makes them dependent on others for personal needs (Canada caregiver amount).
    default: false
  hasInfirmChildren:
    type: boolean
    module: credits
    ask: A child under 18 with an impairment
    help: A child who, because of an impairment, depends on others for personal needs much more than children of the same age.
    default: false
  infirmChildren:
    type: count
    module: credits
    parent: hasInfirmChildren
    ask: Number of children
  hasInfirmDependant:
    type: boolean
    module: credits
    ask: An adult relative with an impairment depends on you
    help: A parent, grandparent, adult child, brother, sister, aunt, uncle, niece or nephew, 18 or older, with a net income under $28,798.
    default: false
  infirmDependants:
    type: count
    module: credits
    parent: hasInfirmDependant
    ask: Number of dependants
  infirmDependantIncome:
    type: money
    module: credits
    parent: hasInfirmDependant
    ask: Their net income
    help: Line 23600 of their return, or what it would be.
  infirmDependantHome:
    type: choice
    module: credits
    parent: hasInfirmDependant
    ask: Where they lived
    help: Some provinces give a larger caregiver amount for a dependant who lived in your home.
    options: [with_you, elsewhere]
    optionLabels:
      with_you: In your home
      elsewhere: Somewhere else
  hasDisabledDependant:
    type: boolean
    module: credits
    ask: A dependant with the disability tax credit
    help: A child or another relative who depends on you, has no income and has an approved Form T2201.
    default: false
  disabledChildren:
    type: count
    module: credits
    parent: hasDisabledDependant
    ask: Children under 18
  disabledChildCare:
    type: money
    module: credits
    parent: hasDisabledDependant
    ask: Child care and attendant care claimed for them
    help: By you or anyone else, as child care or medical expenses.
  disabledAdults:
    type: count
    module: credits
    parent: hasDisabledDependant
    ask: Dependants 18 or older
  hasVolunteerService:
    type: boolean
    module: credits
    ask: Volunteer firefighter or search and rescue
    help: At least 200 hours of eligible volunteer service in 2025.
    default: false
  volunteerKind:
    type: choice
    module: credits
    parent: hasVolunteerService
    ask: Service
    options: [firefighter, search_rescue]
    optionLabels:
      firefighter: Volunteer firefighter
      search_rescue: Search and rescue volunteer
  homeBuyers:
    type: money
    module: credits
    ask: Home buyers' amount
    help: Up to $10,000 when you or your spouse bought a first home in 2025, or a home for a person with a disability. A couple shares the $10,000.
    default: 0
  homeAccessibility:
    type: money
    module: credits
    ask: Home accessibility renovations
    help: Up to $20,000 to make a home safer or easier to use for someone 65 or older or with the disability tax credit.
    default: 0
  hasAdoption:
    type: boolean
    module: credits
    ask: Adoption expenses
    help: For an adoption completed in 2025.
    default: false
  adoptionExpenses:
    type: money
    module: credits
    parent: hasAdoption
    ask: Eligible adoption expenses
    help: Less any reimbursement or assistance.
  adoptedChildren:
    type: count
    module: credits
    parent: hasAdoption
    ask: Children adopted
  studentLoanInterest:
    type: money
    module: credits
    ask: Interest paid on student loans
    help: On loans under the Canada Student Loans Act or a provincial student loan program, for 2025 and up to five earlier years not claimed.
    default: 0
  childTuitionTransfer:
    type: money
    module: credits
    ask: Tuition transferred from a child or grandchild
    help: The amount they designated to you on their T2202, up to $5,000 each.
    default: 0
  childProvincialTuitionTransfer:
    type: money
    module: credits
    ask: Provincial or territorial tuition transferred from a child or grandchild
    help: The provincial or territorial amount they designated to you on their T2202. It can differ from the federal amount, since some provinces add education amounts.
  hasOtherDependantMedical:
    type: boolean
    module: credits
    ask: Medical expenses for another dependant
    help: An adult child or grandchild, a parent, grandparent, brother, sister, aunt, uncle, niece or nephew who depended on you.
    default: false
  otherDependantMedical:
    type: money
    module: credits
    parent: hasOtherDependantMedical
    ask: Their medical expenses you paid
  otherDependantIncome:
    type: money
    module: credits
    parent: hasOtherDependantMedical
    ask: Their net income
  politicalContributions:
    type: money
    module: credits
    ask: Federal political contributions
    help: To a registered federal party, association or candidate, on official receipts.
    default: 0
  provincialPoliticalContributions:
    type: money
    module: credits
    ask: Provincial or territorial political contributions
    help: To a registered party, association or candidate of your province or territory, on official receipts. In Quebec, a contribution to a provincial party gives no credit.
    default: 0
  qcMunicipalPoliticalContributions:
    type: money
    module: credits
    ask: Contributions to Quebec municipal political parties or candidates
    help: To an authorized municipal party or independent candidate in Quebec, on official receipts. Up to $200 counts.
    default: 0
  hasRentedHome:
    type: boolean
    module: credits
    ask: Rented the home you lived in
    help: A home you rented and lived in during 2025. Some provincial credits depend on the rent and on how many months you rented.
    default: false
  rentPaid:
    type: money
    module: credits
    parent: hasRentedHome
    ask: Rent paid in 2025
    help: For the home you lived in, not counting any part a roommate or someone else paid.
  rentMonths:
    type: count
    module: credits
    parent: hasRentedHome
    ask: Months you paid rent
    help: Months of 2025 you rented and lived in it. Don't count months you paid rent to a relative, or for a campsite or a mobile home pad.
  propertyTaxPaid:
    type: money
    module: credits
    ask: Property tax paid on your home for 2025
    help: Municipal and school taxes on the home you owned and lived in.
    default: 0
  paidSchoolTaxes:
    type: boolean
    module: credits
    ask: School taxes on a home you owned and lived in
    help: The school taxes on your 2025 property tax statement. A couple enters them on one return.
    default: false
  schoolTaxes:
    type: money
    module: credits
    parent: paidSchoolTaxes
    ask: School taxes for 2025
    help: The gross school taxes, before the homeowners affordability tax credit advance was taken off.
  schoolTaxAdvance:
    type: money
    module: credits
    parent: paidSchoolTaxes
    ask: Homeowners affordability tax credit advance
    help: The advance taken off your property tax statement, or credited to your property tax account. 0 if none.
  homeOwnedDays:
    type: count
    module: credits
    parent: paidSchoolTaxes
    ask: Days in 2025 you owned it and lived in it
    help: 365 for the whole year.
  publicTransitPaid:
    type: money
    module: credits
    ask: Public transit paid as a senior
    help: Passes, tickets and fares for local public transit you used in 2025, at the senior fare where there is one, less any amount paid back to you. Ontario gives 15% of up to $3,000 if you were 65 or older on December 31, 2024.
    default: 0
  teacherSupplies:
    type: money
    module: credits
    ask: School supplies you paid as a teacher or early childhood educator
    help: Up to $1,000 of supplies for your teaching, not paid back to you.
    default: 0
  multigenerationalRenovation:
    type: money
    module: credits
    ask: Multigenerational home renovation
    help: Up to $50,000 to build a secondary unit for a senior or an adult with a disability to live with a relative (Schedule 12).
    default: 0
  hasCwbAdvance:
    type: boolean
    module: credits
    slip: RC210
    ask: Canada workers benefit paid in advance
    help: An RC210 from the CRA.
  hasRl19:
    type: boolean
    module: credits
    slip: RL19
    ask: Quebec tax credits paid in advance (RL-19)
    help: An RL-19 from Revenu Québec, for the work premium, childcare or home-support credits paid to you during 2025.
  trainingCreditLimit:
    type: money
    module: credits
    receipts: NOA
    suggest: SUGGEST.trainingCreditLimit
    ask: Canada training credit limit from your 2024 notice of assessment
    help: Half your 2025 tuition is refunded, up to this limit.
    default: 0
  instalmentsPaid:
    type: money
    module: credits
    ask: Tax paid by instalments
    help: Instalments you paid to the CRA for 2025.
    default: 0
  hasTuition:
    type: boolean
    module: credits
    slip: T2202
    ask: Tuition at a college or university
    help: A T2202 from each school, for 2025.
  hasRl8:
    type: boolean
    module: credits
    slip: RL8
    ask: Tuition at a college or university in Quebec (RL-8)
    help: An RL-8 from each school in Quebec, which also gives you a T2202.
  unusedTuition:
    type: money
    module: credits
    receipts: NOA
    suggest: SUGGEST.unusedTuition
    ask: Unused federal tuition from your 2024 notice of assessment
    default: 0
  unusedProvincialTuition:
    type: money
    module: credits
    receipts: NOA
    ask: Unused provincial or territorial tuition from your 2024 notice of assessment
    help: The unused tuition and education amounts your notice shows for your province or territory, apart from the federal amount. If you lived in another one at the end of 2024, enter your unused federal amount. In Quebec, the unused tuition or examination fees on your 2024 notice of assessment from Revenu Québec (line 48 of Schedule T).
    default: 0
  tuitionTransfer:
    type: money
    module: credits
    ask: Tuition to transfer to your spouse or partner
    help: Up to $5,000 of this year's tuition, as designated on the back of your T2202.
    default: 0
  medicalExpenses:
    type: money
    module: credits
    receipts: MEDICAL
    ask: Medical expenses
    help: For you, your spouse or your children. Uploaded receipts are added; enter what isn't on one. Either spouse can claim the family's medical expenses; it usually saves more on the lower income.
    default: 0
  physicalActivityFees:
    type: money
    module: credits
    ask: Physical activity fees to claim on this return
    help: Fees paid in 2025 to register you, your spouse or your children in a program of physical activity, or for membership in an eligible organization. In Newfoundland and Labrador your family can claim up to $2,000 in all; in Manitoba up to $500 for each person (you or your spouse under 25, each child under 18). Claim on one return or split between yours and your spouse's.
    default: 0
  donations:
    type: money
    module: credits
    receipts: DONATION
    ask: Donations
    help: On official receipts. Uploaded receipts and box 46 of your T4 are added; enter what isn't on one. Either spouse can claim both spouses' donations; claiming them together usually saves more.
    default: 0
  childActivityFees:
    type: money
    module: credits
    ask: Children's sports, arts and activity fees
    help: Registration or membership fees paid in 2025 for your children's sports, arts, cultural or recreational programs, less any reimbursement. For each child, count at most your province's limit ($300 in Saskatchewan, or $400 for a child with the disability tax credit; $500 in Nova Scotia and in Quebec, for a child born from 2009 to 2019; $1,000 in Prince Edward Island). A couple can split them; enter only what you claim on this return.
    default: 0
  homeRenovationExpenses:
    type: money
    module: credits
    ask: Home renovation expenses
    help: Renovations to the home you own and live in, in Saskatchewan, paid from October 1, 2024 to December 31, 2025 (Schedule SK(S12)), such as a kitchen, bathroom, roof, floors, deck or furnace. Not repairs, maintenance, furniture or appliances. Enter the family's expenses on one return.
    default: 0
  fertilityExpenses:
    type: money
    module: credits
    ask: Fertility or surrogacy treatment expenses
    help: Fertility treatment, fertility preservation or surrogacy costs paid in 2025, not covered by insurance, also entered with your medical expenses. Ontario, Saskatchewan and Yukon each have a credit for them, with their own rules on what counts. In Ontario and Saskatchewan only one spouse can claim it; in Yukon each spouse claims what they paid.
    default: 0
  childFitnessFees:
    type: money
    module: credits
    ask: Children's fitness fees
    help: Fees you paid in 2025 for a program of physical activity for a child under 16, such as a sports team or a swimming class (Form YT479). Up to $1,000 for each child.
    default: 0
  childArtsFees:
    type: money
    module: credits
    ask: Children's arts and learning program fees
    help: Fees paid in 2025 for your children's arts, cultural, nature, learning or developmental programs, such as music or dance lessons, that aren't sports or physical activity, less any reimbursement. Count at most $500 for each child under 16. A couple can split them; enter only what you claim on this return.
    default: 0

  # Quebec: what the Quebec return (TP-1) needs besides the federal answers. Only a Quebec return reads them.
  qcLivedAlone:
    type: boolean
    module: credits
    ask: Lived alone all year (Quebec)
    help: All of 2025 in a home you kept, alone or only with people under 18 or your children who were full-time students. It gives the amount for a person living alone (Schedule B) and counts for the solidarity tax credit (Schedule D).
    default: false
  hasRl31:
    type: boolean
    module: credits
    slip: RL31
    ask: Rented your home on December 31 (RL-31)
    help: An RL-31 from your landlord, for the solidarity tax credit (Schedule D). Copy its dwelling number (box A) onto Schedule D yourself; this app doesn't keep it.
  qcHomeOwner:
    type: boolean
    module: credits
    ask: Owned the home you lived in on December 31 (Quebec)
    help: For the solidarity tax credit (Schedule D). Copy the roll number from your municipal tax bill onto Schedule D yourself; this app doesn't keep it.
    default: false
  qcHomeOwners:
    type: count
    module: credits
    parent: qcHomeOwner
    ask: Owners living in the home
    help: You included (Schedule D, line 36).
    default: "1"
  qcGroupDrugPlan:
    type: boolean
    module: credits
    ask: Covered by a group drug insurance plan (Quebec)
    help: Basic prescription drug insurance through a group plan at work, or through your spouse's or a parent's plan. Without one, you pay the premium of the public plan (Schedule K).
    default: false
  qcDrugMonthsJanJun:
    type: count
    module: credits
    parent: qcGroupDrugPlan
    ask: Months from January to June it covered you
    help: Count a month if the plan covered you for at least one day of it. 6 for all of them.
    default: "6"
  qcDrugMonthsJulDec:
    type: count
    module: credits
    parent: qcGroupDrugPlan
    ask: Months from July to December it covered you
    help: 6 for all of them.
    default: "6"
  hasRl24:
    type: boolean
    module: credits
    slip: RL24
    ask: Childcare in Quebec (RL-24)
    help: An RL-24 from each daycare or childcare provider, for the tax credit for childcare expenses (Schedule C).
  qcChildCareReceipts:
    type: money
    module: credits
    ask: Childcare paid without an RL-24 (Quebec)
    help: Childcare that qualifies for the Quebec credit, paid to a person who gave you a receipt instead of an RL-24. Not the reduced contribution of a subsidized daycare.
    default: 0
  hasHomeSupport:
    type: boolean
    module: credits
    ask: Home-support services for seniors (Quebec)
    help: Rent in an apartment building, or housekeeping, personal care, meal or nursing services you paid for, at 70 or older (Schedule J). A couple enters them on one return.
    default: false
  homeSupportRent:
    type: money
    module: credits
    parent: hasHomeSupport
    ask: Monthly rent of your apartment
    help: 0 if you lived in your own house or in a private seniors' residence. A seniors' residence (form TP-1029.61.MD-V) isn't handled.
  homeSupportRentMonths:
    type: count
    module: credits
    parent: hasHomeSupport
    ask: Months you paid this rent in 2025
  homeSupportServices:
    type: money
    module: credits
    parent: hasHomeSupport
    ask: Home-support services you paid, not in your rent
    help: Housekeeping, grounds maintenance and snow removal, personal care, meal preparation and delivery, nursing.
  qcChildTransfer:
    type: money
    module: credits
    ask: Amount transferred to you by a child who is a student (Quebec)
    help: What your child, 18 or older and a full-time student with an RL-8, transfers to you on their Schedule S (lines 20.1 and 20.2).
    default: 0
  qcChildTuitionTransfer:
    type: money
    module: credits
    ask: Tuition credit transferred to you by a child (Quebec)
    help: The amount on line 68 of your child's Schedule T.
    default: 0
  qcInstalmentsPaid:
    type: money
    module: credits
    ask: Tax paid by instalments to Revenu Québec
    help: Instalments you paid to Revenu Québec for 2025. Instalments paid to the CRA are a separate question.
    default: 0

  # About the person (Personal info)
  spouseNetIncome:
    type: money
    module: about
    ask: Your spouse's or partner's 2025 net income
    help: Line 23600 of their return. Their return isn't prepared here, but some of your credits depend on it.

  daysResident:
    type: count
    module: about
    ask: Days you lived in Canada in 2025
    help: From the day you arrived, or up to the day you left, counting that day. 365 if you lived here all year.
  nonResidentIncome:
    type: money
    module: about
    ask: Your world income for the part of 2025 you didn't live in Canada
    help: All the income you had while you weren't a resident, from anywhere, in Canadian dollars. 0 if none.
  nonResidentCanadianIncome:
    type: money
    module: about
    ask: The part of it from Canada
    help: Employment or business income from Canada in that period. If it is 90% or more of that world income, you can claim your full personal amounts.
  departureProperty:
    type: boolean
    module: income
    ask: You left Canada owning shares, funds or other property
    help: Only if you left Canada in 2025. Property other than Canadian real estate, a business in Canada, pensions and registered plans (RRSP, TFSA, FHSA) is treated as sold the day you left.
    default: false

  # Decisions between spouses: which return claims what either spouse may claim. Changed by accepting a hint
  # (hints.yaml); each spouse claims their own until then.
  claimSpouseDonations:
    type: boolean
    ask: Claim your spouse's or partner's donations on this return
    default: false
    decision: true
  pensionSplit:
    type: money
    ask: Pension income split with your spouse or partner (Form T1032)
    default: 0
    decision: true
  claimSpouseMedical:
    type: boolean
    ask: Claim your spouse's or partner's medical expenses on this return
    default: false
    decision: true
