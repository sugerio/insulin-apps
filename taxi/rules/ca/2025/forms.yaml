    applies: "line.S11.8 + line.S11.9 > 0"
    fields:
      # The app takes the fees on the T2202 slips as paid to Canadian institutions: none foreign (line 7).
      "1": sum(T2202.box26)
      # Lines 2 to 4: only when the Canada training credit is claimed.
      "2@1": { value: sum(T2202.box26), when: "line.T1.45350 > 0" }
      "2": { value: "round(sum(T2202.box26) * param.trainingCreditRate, 2)", when: "line.T1.45350 > 0" }
      "3": { value: answer.trainingCreditLimit, when: "line.T1.45350 > 0" }
      "4": { value: "min(round(sum(T2202.box26) * param.trainingCreditRate, 2), answer.trainingCreditLimit)", when: "line.T1.45350 > 0" }
      "5": line.T1.45350
