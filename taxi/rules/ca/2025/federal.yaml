# Federal tax: the T1 (5006-R) and Schedules 3, 9 and 11, for the income, deductions and credits in scope. Line ids
# are the form's own: T1 lines by their five-digit number, a schedule's lines by the number in its right margin, a
# form's area A (capital cost allowance) by its column (T2125A.7 is column 7).
# Every number below was checked against the 2025 forms: T1 5006-R, Federal Worksheet 5000-D1, Schedules 2, 3, 5, 8, 9
# and 11, Forms T2125, T2042, T2121, T776, T778, T2091(IND) and T2204, Guides T4002 and T4036, and the CRA's 2025
# payroll tables for CPP and EI.
#
# A resident of Quebec on December 31 files the T1 for residents of Quebec (5005-R) with Quebec's own Schedules 6, 8 and
# 10 (5005-S6, 5005-S8, 5005-S10): QPP instead of CPP, EI at the Quebec rate, PPIP premiums, the refundable Quebec
# abatement (line 44000), and the Canada workers benefit at Quebec's rates. The lines below branch on
# person.province == "QC" for these; Quebec's own tax is on the TP-1, not on line 42800, and there is no Form 479.

