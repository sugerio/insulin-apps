  S2:
    title: Schedule 2, Federal Amounts Transferred From Your Spouse or Common-law Partner
    url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s2/5000-s2-25e.pdf
    # Worked out only when both returns are prepared here (line 32600 is zero otherwise), so the spouse's lines are known.
    # The schedule has no place for a part-year resident's proration: line 13 is the whole transfer, and line 32600 of
    # the return the prorated amount (RC4018 does the same for a pre-bankruptcy return: line 32600 is prorated, the
    # lines of Schedule 2 aren't).
    applies: "line.T1.32600 > 0"
    fields:
      "1": spouse.line.T1.30100
      "2": spouse.line.T1.30500
      "3": spouse.line.T1.31400
      "4": spouse.line.T1.31600
      "5": spouse.line.S11.24
      "6": line.S2.6
      # Above $57,375 of taxable income, their line 76 is carried in before the division.
      "7@1": { value: spouse.line.T1.40400, when: "spouse.line.T1.26000 > param.tuitionIncomeThreshold" }
