      yonkersYes: { tick: "line.NYS.yonkers == 1" }
      yonkersMonths: { count: "if(line.NYS.yonkers == 1, 12, 0)" }
      yonkersSpouseMonths: { count: "if(line.NYS.yonkers == 1 and line.US.joint == 1, 12, 0)" }
      nycYes: { tick: "line.NYS.nyc == 1" }
      nycMonths: { count: "if(line.NYS.nyc == 1, 12, 0)" }
      nycSpouseMonths: { count: "if(line.NYS.nyc == 1 and line.US.joint == 1, 12, 0)" }
      "1": line.IT201.1
      "2": line.IT201.2
      "3": line.IT201.3
      "6": line.IT201.6
      "7": line.IT201.7
      "9": line.IT201.9
      "10": line.IT201.10
      "15": line.IT201.15
      "17": line.IT201.17
      "18": line.IT201.18
      "19": { value: line.IT201.19, zero: true }
      "20": line.IT201.20
      "21": line.IT201.21
      "24": { value: line.IT201.24, zero: true }
      "26": line.IT201.26
      "27": line.IT201.27
      "28": line.IT201.28
      "29": line.IT201.29
      "30": line.IT201.30
      "32": line.IT201.32
      "33": { value: line.IT201.33, zero: true }
      standard: { tick: "line.NYS.itemizes == 0" }
      itemized: { tick: "line.NYS.itemizes == 1" }
      "34": line.IT201.34
      "35": { value: line.IT201.35, zero: true }
      "36": line.IT201.36
      "37": { value: line.IT201.38, zero: true }
      "38": { value: line.IT201.38, zero: true }
      "39": { value: line.IT201.39, zero: true }
      "40": line.IT201.40
      "43": line.IT201.43
      "44": { value: line.IT201.44, zero: true }
      "46": { value: line.IT201.46, zero: true }
      "47": { value: line.IT201.47, when: "line.NYS.nyc == 1", zero: true }
      "47a": { value: line.IT201.47a, when: "line.NYS.nyc == 1", zero: true }
      "48": line.IT201.48
      "49": { value: line.IT201.49, when: "line.NYS.nyc == 1", zero: true }
      "52": { value: line.IT201.52, when: "line.NYS.nyc == 1", zero: true }
      "54": { value: line.IT201.54, when: "line.NYS.nyc == 1", zero: true }
      54a: line.IT201.54a
      54b: line.IT201.54b
      54c: line.IT201.54c
      54d: line.IT201.54d
      54e: line.IT201.54e
      "55": line.IT201.55
      "58": line.IT201.58
      # "Do not leave blank."
      "59": { value: line.IT201.59, zero: true }
      "61": { value: line.IT201.61, zero: true }
      "62": { value: line.IT201.62, zero: true }
      "63": line.IT201.63
      "64": line.IT201.64
      "65": line.IT201.65
      "68": line.IT201.68
      "69": line.IT201.69
      69a: line.IT201.69a
