  # printed (wholeDollars). The social security numbers, dates of birth, address, county and school district, the
  # questions Taxi doesn't ask and the signature stay for the person to fill in.
  IT201:
    title: Form IT-201, Resident Income Tax Return (New York State)
    url: https://www.tax.ny.gov/pdf/2025/inc/it201_2025_fill_in.pdf
