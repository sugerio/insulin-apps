      "55": line.T1.23500
      "56": line.T1.23600
      # Step 4 – Taxable income
      "57": line.T1.23600
      "69": line.T1.26000
      # Step 5 – Federal tax: Part B, non-refundable tax credits
      "77": line.T1.30000
      "78": line.T1.30100
      "79": line.T1.30300
      "80": line.T1.30400
      "84": line.T1.30000 + line.T1.30100 + line.T1.30300 + line.T1.30400
      "85": line.T1.30000 + line.T1.30100 + line.T1.30300 + line.T1.30400
      "86": line.T1.30800
      "87": line.T1.31000
      "88": line.T1.31200
      "92": line.T1.31260
      "96": line.T1.30800 + line.T1.31000 + line.T1.31200 + line.T1.31260
      "97": line.T1.31400
      "98": line.T1.T101
      "101": line.T1.T101
      "103": line.T1.32300
      "105": line.T1.32600
      "106": line.T1.T101 + line.T1.32300 + line.T1.32600
      "107": line.T1.33099
      "108": round(line.T1.23600 * param.medicalThresholdRate, 2)
      "109": min(param.medicalThresholdMax, round(line.T1.23600 * param.medicalThresholdRate, 2))
      "110": line.T1.33200
      "112": line.T1.33200
      "113": line.T1.33500
      "115": line.T1.33800
      "116": line.T1.34900
